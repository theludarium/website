name = "ludarium-ludometer"
main = "src/index.ts"
compatibility_date = "2025-02-14"

[vars]
# Only these sites may call the Worker from a browser. Add a preview URL while testing.
ALLOWED_ORIGINS = "https://theludarium.com,https://www.theludarium.com"
USER_AGENT = "TheLudarium-Ludometer/1.0 (+https://theludarium.com)"
# Keep "false" until BoardGameGeek grants the commercial license.
# While false, the week, game and feed routes need the ADMIN_TOKEN.
PUBLIC_API = "false"

# Secrets, never vars. Set each one with:
#   npx wrangler secret put BGG_TOKEN        (BGG XML API token)
#   npx wrangler secret put ADMIN_TOKEN      (admin API and the gated public routes)
#   npx wrangler secret put EVENTS_TOKEN     (site, app and jobs posting events)
#   npx wrangler secret put KIT_WEBHOOK_KEY  (the ?key= on the Kit webhook URL)
# Optional:
#   npx wrangler secret put KIT_WEBHOOK_SECRET  (Kit's signing secret, checks X-Kit-Signature)

# D1 database. Create it once, then paste the id it prints below:
#   npx wrangler d1 create ludometer
# Apply the schema (remote, then local for wrangler dev):
#   npx wrangler d1 migrations apply ludometer --remote
#   npx wrangler d1 migrations apply ludometer --local
[[d1_databases]]
binding = "DB"
database_name = "ludometer"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# Daily BGG snapshot at 06:00 UTC. Weekly score on Monday at 09:00 UTC.
crons = ["0 6 * * *", "0 9 * * 1"]

# Serve the API under the site. Uncomment after the first deploy.
# routes = [{ pattern = "theludarium.com/api/ludometer/*", zone_name = "theludarium.com" }]
