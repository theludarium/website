# ludarium-cube-refresh: keeps the Cube Library's card counts and "Updated" dates
# current from Cube Cobra. It runs every 6 hours and checks a quarter of the Cubes
# each time, so every Cube is checked once a day. It has no public URL.
#
# Deploy:  npx wrangler deploy -c workers/cube-refresh/wrangler.toml
name = "ludarium-cube-refresh"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ludarium-site"
database_id = "085f2cab-09e9-40f8-9f4d-6ea08e830cfa"
