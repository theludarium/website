<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t">
<title id="t">An abstract SETI setup: the main board with the planetary board, the rotating solar system with eight sectors and their stars, and the tech board, surrounded by the card row, gold tiles, end-of-round stacks, and a player board</title>
<rect width="480" height="320" fill="#F6EFE3"/>
<g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">
<!-- main board -->
<rect x="8" y="8" width="336" height="226" rx="10" fill="#2F5D50"/>
<!-- planetary board -->
<rect x="16" y="16" width="78" height="210" rx="6" fill="#F6EFE3" opacity=".14" stroke="#F6EFE3" stroke-width="1"/>
<text x="55" y="32" text-anchor="middle" fill="#F6EFE3">Planetary</text>
<text x="55" y="46" text-anchor="middle" fill="#F6EFE3">board</text>
<circle cx="36" cy="72" r="8" fill="#B9AD9C"/><circle cx="60" cy="68" r="6" fill="#B9AD9C"/><circle cx="78" cy="78" r="7" fill="#B9AD9C"/>
<circle cx="40" cy="100" r="10" fill="#B9AD9C"/><circle cx="72" cy="104" r="9" fill="#B9AD9C"/>
<rect x="22" y="128" width="30" height="40" rx="4" fill="#2B1E16" stroke="#E0A23B" stroke-width="1.5"/>
<rect x="58" y="128" width="30" height="40" rx="4" fill="#2B1E16" stroke="#E0A23B" stroke-width="1.5"/>
<text x="37" y="153" text-anchor="middle" fill="#E0A23B" font-size="14">?</text>
<text x="73" y="153" text-anchor="middle" fill="#E0A23B" font-size="14">?</text>
<text x="55" y="186" text-anchor="middle" fill="#F6EFE3">2 alien</text>
<text x="55" y="200" text-anchor="middle" fill="#F6EFE3">species,</text>
<text x="55" y="214" text-anchor="middle" fill="#F6EFE3">face down</text>
<!-- solar system -->
<circle cx="190" cy="118" r="92" fill="#24493f" stroke="#F6EFE3" stroke-width="1"/>
<g stroke="#F6EFE3" stroke-width="1" opacity=".55">
<line x1="190" y1="26" x2="190" y2="210"/><line x1="98" y1="118" x2="282" y2="118"/>
<line x1="125" y1="53" x2="255" y2="183"/><line x1="255" y1="53" x2="125" y2="183"/>
</g>
<circle cx="190" cy="118" r="64" fill="#2F5D50" stroke="#B9AD9C" stroke-width="1.5"/>
<circle cx="190" cy="118" r="46" fill="#3a6e60" stroke="#B9AD9C" stroke-width="1.5"/>
<circle cx="190" cy="118" r="28" fill="#2F5D50" stroke="#B9AD9C" stroke-width="1.5"/>
<circle cx="190" cy="118" r="11" fill="#E0A23B"/>
<circle cx="214" cy="104" r="4" fill="#F6EFE3"/><circle cx="160" cy="96" r="5" fill="#B9AD9C"/><circle cx="232" cy="150" r="6" fill="#B9AD9C"/>
<!-- stars with data slots, one per sector -->
<g fill="#E0A23B">
<circle cx="225" cy="36" r="3.5"/><circle cx="272" cy="83" r="3.5"/><circle cx="272" cy="153" r="3.5"/><circle cx="225" cy="200" r="3.5"/>
<circle cx="155" cy="200" r="3.5"/><circle cx="108" cy="153" r="3.5"/><circle cx="108" cy="83" r="3.5"/><circle cx="155" cy="36" r="3.5"/>
</g>
<text x="190" y="228" text-anchor="middle" fill="#F6EFE3">Solar system: 3 discs, 8 sectors</text>
<!-- tech board -->
<rect x="290" y="16" width="48" height="210" rx="6" fill="#F6EFE3" opacity=".14" stroke="#F6EFE3" stroke-width="1"/>
<text x="314" y="32" text-anchor="middle" fill="#F6EFE3">Techs</text>
<g stroke="#F6EFE3" stroke-width="1">
<rect x="296" y="42" width="10" height="10" fill="#E0A23B"/><rect x="309" y="42" width="10" height="10" fill="#B9AD9C"/><rect x="322" y="42" width="10" height="10" fill="#3a6e60"/>
<rect x="296" y="58" width="10" height="10" fill="#E0A23B"/><rect x="309" y="58" width="10" height="10" fill="#B9AD9C"/><rect x="322" y="58" width="10" height="10" fill="#3a6e60"/>
<rect x="296" y="74" width="10" height="10" fill="#E0A23B"/><rect x="309" y="74" width="10" height="10" fill="#B9AD9C"/><rect x="322" y="74" width="10" height="10" fill="#3a6e60"/>
<rect x="296" y="90" width="10" height="10" fill="#E0A23B"/><rect x="309" y="90" width="10" height="10" fill="#B9AD9C"/><rect x="322" y="90" width="10" height="10" fill="#3a6e60"/>
</g>
<text x="314" y="120" text-anchor="middle" fill="#F6EFE3">12</text>
<text x="314" y="134" text-anchor="middle" fill="#F6EFE3">stacks,</text>
<text x="314" y="148" text-anchor="middle" fill="#F6EFE3">2 pts</text>
<text x="314" y="162" text-anchor="middle" fill="#F6EFE3">on top</text>
<circle cx="314" cy="190" r="8" fill="#E0A23B"/>
<text x="314" y="214" text-anchor="middle" fill="#F6EFE3">Rotation</text>
<!-- right column -->
<text x="356" y="22">Card row</text>
<rect x="356" y="28" width="30" height="40" rx="4" fill="#fff" stroke="#2B1E16"/><rect x="392" y="28" width="30" height="40" rx="4" fill="#fff" stroke="#2B1E16"/><rect x="428" y="28" width="30" height="40" rx="4" fill="#fff" stroke="#2B1E16"/>
<text x="356" y="88">Gold scoring tiles</text>
<g fill="#E0A23B" stroke="#2B1E16">
<rect x="356" y="94" width="24" height="24" rx="4"/><rect x="386" y="94" width="24" height="24" rx="4"/><rect x="416" y="94" width="24" height="24" rx="4"/><rect x="446" y="94" width="24" height="24" rx="4"/>
</g>
<text x="356" y="138">End-of-round cards</text>
<g fill="#B9AD9C" stroke="#2B1E16">
<rect x="356" y="144" width="22" height="30" rx="3"/><rect x="384" y="144" width="22" height="30" rx="3"/><rect x="412" y="144" width="22" height="30" rx="3"/><rect x="440" y="144" width="22" height="30" rx="3"/>
</g>
<text x="356" y="190" font-size="12">Rounds 1 to 4,</text>
<text x="356" y="204" font-size="12">players plus 1 each</text>
<text x="356" y="226">Deck</text>
<rect x="392" y="212" width="26" height="20" rx="3" fill="#fff" stroke="#2B1E16"/>
<!-- player board -->
<rect x="8" y="242" width="336" height="70" rx="10" fill="#fff" stroke="#B9AD9C" stroke-width="1.5"/>
<text x="18" y="260">Player board</text>
<text x="18" y="280">Computer</text>
<g fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5">
<circle cx="88" cy="276" r="7"/><circle cx="108" cy="276" r="7"/><circle cx="128" cy="276" r="7"/><circle cx="148" cy="276" r="7"/><circle cx="168" cy="276" r="7"/><circle cx="188" cy="276" r="7"/>
</g>
<text x="18" y="302">Data pool (max 6)</text>
<rect x="128" y="292" width="72" height="14" rx="4" fill="#F6EFE3" stroke="#2F5D50"/>
<rect x="232" y="252" width="44" height="52" rx="4" fill="#E0A23B" stroke="#2B1E16"/>
<rect x="238" y="290" width="44" height="18" rx="3" fill="#fff" stroke="#2B1E16"/>
<text x="290" y="268">Income</text>
<text x="290" y="282">card,</text>
<text x="290" y="296">1 tucked</text>
<!-- supply -->
<text x="356" y="262">Supply:</text>
<text x="356" y="278">credits, energy,</text>
<text x="356" y="294">data tokens</text>
<circle cx="440" cy="300" r="6" fill="#B9AD9C"/><circle cx="456" cy="300" r="6" fill="#E0A23B"/><circle cx="470" cy="300" r="5" fill="#2F5D50"/>
</g>
</svg>
