<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">7 Wonders Duel setup</title>
  <desc id="d">Player 1 sits on the left and Player 2 on the right, each with 7 coins and a column of 4 Wonders. The board runs between them along the top: a Conflict track of 19 spaces with the pawn on the middle space and a capital at each end, two Military tokens on each side (2 coins nearer the middle, 5 coins nearer the capital), and 5 Progress tokens face up. In the middle, the Age I layout: 20 cards in rows of 2, 3, 4, 5, and 6, alternating face up and face down. Below it, the discard pile, the bank, and the box that holds 3 unseen cards from each Age.</desc>
