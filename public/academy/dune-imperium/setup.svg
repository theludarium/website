<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Dune: Imperium setup</title>
  <desc id="d">The game board with a cube for every player at the bottom of each of the four Influence tracks and an Alliance token on the 4 space, three troops in each garrison around the Conflict area, the 10-card Conflict deck, the Mentat, and the score track. Below the board: the Imperium deck, the Imperium Row of five face-up cards, the Intrigue deck, and the Reserve stacks. Each player has a Leader with two Agents, a 10-card deck, 1 water, and a Swordmaster waiting beside the board. The bank holds Solari, spice, and water.</desc>
  <defs>
    <g id="agent">
      <circle cx="5" cy="3" r="3"/>
      <path d="M0 14 L2 6.5 L8 6.5 L10 14 Z"/>
    </g>
    <g id="stack">
      <rect x="6" y="6" width="22" height="30" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="3" y="3" width="22" height="30" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="22" height="30" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <g id="drop">
      <path d="M6 0 C3 5 0 8 0 11 A6 6 0 0 0 12 11 C12 8 9 5 6 0 Z"/>
    </g>
    <g id="cubes">
      <rect x="1" y="1" width="3.6" height="3.6" fill="#2F5D50"/>
      <rect x="5.4" y="1" width="3.6" height="3.6" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
      <rect x="1" y="5.4" width="3.6" height="3.6" fill="#2B1E16"/>
      <rect x="5.4" y="5.4" width="3.6" height="3.6" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.4"/>
    </g>
    <path id="alliance" d="M5 0 L10 5 L5 10 L0 5 Z" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Game board -->
    <rect x="104" y="6" width="272" height="214" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="116" y="24" font-size="13" font-weight="700">Game board</text>

    <!-- Influence tracks: every cube at the bottom (0), Alliance token on the 4 space -->
    <text x="116" y="44" font-weight="700" fill="#2F5D50">Influence tracks</text>
    <g>
      <text x="116" y="62">Emperor</text>
      <text x="116" y="80">Spacing Guild</text>
      <text x="116" y="98">Bene Gesserit</text>
      <text x="116" y="116">Fremen</text>
    </g>
    <g fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1">
      <rect x="200" y="52" width="10" height="10" stroke="#2B1E16"/><rect x="212" y="52" width="10" height="10"/><rect x="224" y="52" width="10" height="10"/><rect x="236" y="52" width="10" height="10"/><rect x="248" y="52" width="10" height="10"/><rect x="260" y="52" width="10" height="10"/>
      <rect x="200" y="70" width="10" height="10" stroke="#2B1E16"/><rect x="212" y="70" width="10" height="10"/><rect x="224" y="70" width="10" height="10"/><rect x="236" y="70" width="10" height="10"/><rect x="248" y="70" width="10" height="10"/><rect x="260" y="70" width="10" height="10"/>
      <rect x="200" y="88" width="10" height="10" stroke="#2B1E16"/><rect x="212" y="88" width="10" height="10"/><rect x="224" y="88" width="10" height="10"/><rect x="236" y="88" width="10" height="10"/><rect x="248" y="88" width="10" height="10"/><rect x="260" y="88" width="10" height="10"/>
      <rect x="200" y="106" width="10" height="10" stroke="#2B1E16"/><rect x="212" y="106" width="10" height="10"/><rect x="224" y="106" width="10" height="10"/><rect x="236" y="106" width="10" height="10"/><rect x="248" y="106" width="10" height="10"/><rect x="260" y="106" width="10" height="10"/>
    </g>
    <use href="#cubes" x="200" y="52"/><use href="#cubes" x="200" y="70"/><use href="#cubes" x="200" y="88"/><use href="#cubes" x="200" y="106"/>
    <use href="#alliance" x="248" y="52"/><use href="#alliance" x="248" y="70"/><use href="#alliance" x="248" y="88"/><use href="#alliance" x="248" y="106"/>
    <use href="#alliance" x="116" y="126"/>
    <text x="131" y="135">Alliance token on 4</text>

    <!-- Conflict area with four garrisons, 3 troops each -->
    <circle cx="328" cy="80" r="27" fill="#B9AD9C" fill-opacity="0.35" stroke="#2B1E16" stroke-width="1"/>
    <text x="328" y="84" text-anchor="middle">Conflict</text>
    <g stroke="#2B1E16" stroke-width="1" fill="#F6EFE3">
      <circle cx="298" cy="48" r="12"/><circle cx="358" cy="48" r="12"/>
      <circle cx="298" cy="112" r="12"/><circle cx="358" cy="112" r="12"/>
    </g>
    <g fill="#2F5D50"><rect x="290" y="45.5" width="5" height="5"/><rect x="295.5" y="45.5" width="5" height="5"/><rect x="301" y="45.5" width="5" height="5"/></g>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.5"><rect x="350" y="45.5" width="5" height="5"/><rect x="355.5" y="45.5" width="5" height="5"/><rect x="361" y="45.5" width="5" height="5"/></g>
    <g fill="#2B1E16"><rect x="290" y="109.5" width="5" height="5"/><rect x="295.5" y="109.5" width="5" height="5"/><rect x="301" y="109.5" width="5" height="5"/></g>
    <g fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.5"><rect x="350" y="109.5" width="5" height="5"/><rect x="355.5" y="109.5" width="5" height="5"/><rect x="361" y="109.5" width="5" height="5"/></g>
    <text x="316" y="140" text-anchor="middle">Garrisons: 3 troops</text>

    <!-- Conflict deck -->
    <use href="#stack" x="116" y="148"/>
    <text x="152" y="162">Conflict deck: 10 cards</text>
    <text x="152" y="177">1 I on top, 5 II, 4 III</text>

    <!-- Mentat -->
    <circle cx="322" cy="166" r="6" fill="#2B1E16"/>
    <text x="332" y="170">Mentat</text>

    <!-- Score track: spaces 0 to 12; the end is triggered at 10 -->
    <g fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1">
      <rect x="116" y="190" width="10" height="10" stroke="#2B1E16"/><rect x="135" y="190" width="10" height="10"/><rect x="154" y="190" width="10" height="10"/><rect x="173" y="190" width="10" height="10"/><rect x="192" y="190" width="10" height="10"/><rect x="211" y="190" width="10" height="10"/><rect x="230" y="190" width="10" height="10"/><rect x="249" y="190" width="10" height="10"/><rect x="268" y="190" width="10" height="10"/><rect x="287" y="190" width="10" height="10"/><rect x="306" y="190" width="10" height="10" stroke="#2F5D50" stroke-width="1.5"/><rect x="325" y="190" width="10" height="10"/><rect x="344" y="190" width="10" height="10"/>
    </g>
    <g>
      <circle cx="118.8" cy="192.8" r="1.9" fill="#2F5D50"/><circle cx="123.2" cy="192.8" r="1.9" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
      <circle cx="118.8" cy="197.2" r="1.9" fill="#2B1E16"/><circle cx="123.2" cy="197.2" r="1.9" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.4"/>
    </g>
    <text x="311" y="186" text-anchor="middle" font-weight="700" fill="#2F5D50">10</text>
    <text x="116" y="214">Score track: start on 0 (1 with 4 players)</text>

    <!-- Card row below the board -->
    <use href="#stack" x="108" y="228"/>
    <text x="122" y="278" text-anchor="middle">Imperium</text>
    <text x="122" y="292" text-anchor="middle">deck</text>

    <g fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5">
      <rect x="148" y="230" width="22" height="30" rx="3"/><rect x="174" y="230" width="22" height="30" rx="3"/><rect x="200" y="230" width="22" height="30" rx="3"/><rect x="226" y="230" width="22" height="30" rx="3"/><rect x="252" y="230" width="22" height="30" rx="3"/>
    </g>
    <text x="211" y="278" text-anchor="middle">Imperium Row</text>
    <text x="211" y="292" text-anchor="middle">5 cards face up</text>

    <use href="#stack" x="290" y="228"/>
    <text x="304" y="278" text-anchor="middle">Intrigue</text>
    <text x="304" y="292" text-anchor="middle">deck</text>

    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="331" y="230" width="12" height="30" rx="2"/><rect x="346" y="230" width="12" height="30" rx="2"/><rect x="361" y="230" width="12" height="30" rx="2"/>
    </g>
    <text x="352" y="278" text-anchor="middle">Reserve</text>
    <text x="352" y="292" text-anchor="middle">stacks</text>

    <!-- Each player's area -->
    <text x="10" y="24" font-weight="700">Each player</text>
    <rect x="10" y="32" width="80" height="50" rx="6" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
    <text x="50" y="48" text-anchor="middle">Leader</text>
    <g fill="#2F5D50"><use href="#agent" x="34" y="58"/><use href="#agent" x="54" y="58"/></g>
    <text x="10" y="98">2 Agents on it</text>
    <use href="#stack" x="12" y="106"/>
    <text x="48" y="122">10-card</text>
    <text x="48" y="136">deck</text>
    <g fill="#2F5D50"><use href="#drop" x="14" y="152"/></g>
    <text x="34" y="166">1 water</text>
    <g fill="#2F5D50" stroke="#E0A23B" stroke-width="1"><use href="#agent" x="14" y="180"/></g>
    <text x="10" y="210">Swordmaster</text>
    <text x="10" y="224">waits by board</text>

    <!-- Bank -->
    <text x="388" y="24" font-weight="700">Bank</text>
    <circle cx="398" cy="44" r="8" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <text x="412" y="48">Solari</text>
    <circle cx="398" cy="70" r="8" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <text x="412" y="74">Spice</text>
    <g fill="#2F5D50"><use href="#drop" x="392" y="88"/></g>
    <text x="412" y="100">Water</text>
    <text x="388" y="130" font-weight="700">First player</text>
    <text x="388" y="144">at random</text>

    <text x="240" y="312" text-anchor="middle" fill="#2F5D50">Uprising: add Spies, Objectives, and the Shield Wall. No Mentat.</text>
  </g>
</svg>
