<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
<title id="t">Kingdomino setup for four players</title>
<desc id="d">The box holds the face-down draw pile. Beside it, a first line of four face-up dominoes sorted by number, lowest next to the box, with a king on each, and a second line of four dominoes laid out after the kings are placed. Four players each have a castle on a starting tile. One castle is shown inside the 5 by 5 frame every kingdom must fit in. A key names the six terrains and shows a crown.</desc>
