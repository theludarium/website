<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Dominion setup for two players</title>
  <desc id="d">The Supply of 17 face-up piles: 7 Base card piles with their two-player counts and the 10 First Game Kingdom piles sorted by cost, the Trash mat beside them, and two players who have each shuffled 7 Coppers and 3 Estates and drawn a hand of 5.</desc>
  <defs>
    <g id="back">
      <rect x="0" y="0" width="30" height="42" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <g id="cu">
      <rect x="0" y="0" width="24" height="40" rx="3" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <circle cx="12" cy="20" r="6" fill="#F6EFE3" stroke="#2B1E16" stroke-width="0.8"/>
    </g>
    <g id="es">
      <rect x="0" y="0" width="24" height="40" rx="3" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
      <path d="M12 13 L18 26 L6 26 Z" fill="#F6EFE3"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- The Supply -->
    <rect x="10" y="6" width="460" height="192" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="22" y="25" font-size="13" font-weight="700">The Supply</text>
    <text x="100" y="25">17 face-up piles, counts for 2 players</text>

    <!-- Base card piles, two-player counts -->
    <text x="22" y="44" font-weight="700" fill="#2F5D50">Base cards</text>
    <g>
      <rect x="22" y="50" width="112" height="17" rx="4" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <rect x="22" y="70" width="112" height="17" rx="4" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <rect x="22" y="90" width="112" height="17" rx="4" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <rect x="22" y="110" width="112" height="17" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
      <rect x="22" y="130" width="112" height="17" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
      <rect x="22" y="150" width="112" height="17" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
      <rect x="22" y="170" width="112" height="17" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <g>
      <text x="30" y="63">Copper</text><text x="126" y="63" text-anchor="end">46</text>
      <text x="30" y="83">Silver</text><text x="126" y="83" text-anchor="end">40</text>
      <text x="30" y="103">Gold</text><text x="126" y="103" text-anchor="end">30</text>
    </g>
    <g fill="#F6EFE3">
      <text x="30" y="123">Estate</text><text x="126" y="123" text-anchor="end">8</text>
      <text x="30" y="143">Duchy</text><text x="126" y="143" text-anchor="end">8</text>
      <text x="30" y="163">Province</text><text x="126" y="163" text-anchor="end">8</text>
    </g>
    <text x="30" y="183">Curse</text><text x="126" y="183" text-anchor="end">10</text>

    <!-- Kingdom piles: the First Game set, sorted by cost -->
    <text x="146" y="44" font-weight="700" fill="#2F5D50">Kingdom cards: the First Game set</text>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="146" y="50" width="58" height="48" rx="6"/>
      <rect x="209" y="50" width="58" height="48" rx="6"/>
      <rect x="272" y="50" width="58" height="48" rx="6"/>
      <rect x="335" y="50" width="58" height="48" rx="6"/>
      <rect x="398" y="50" width="58" height="48" rx="6"/>
      <rect x="146" y="104" width="58" height="48" rx="6"/>
      <rect x="209" y="104" width="58" height="48" rx="6"/>
      <rect x="272" y="104" width="58" height="48" rx="6"/>
      <rect x="335" y="104" width="58" height="48" rx="6"/>
      <rect x="398" y="104" width="58" height="48" rx="6"/>
    </g>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8">
      <circle cx="175" cy="85" r="8"/><circle cx="238" cy="85" r="8"/><circle cx="301" cy="85" r="8"/><circle cx="364" cy="85" r="8"/><circle cx="427" cy="85" r="8"/>
      <circle cx="175" cy="139" r="8"/><circle cx="238" cy="139" r="8"/><circle cx="301" cy="139" r="8"/><circle cx="364" cy="139" r="8"/><circle cx="427" cy="139" r="8"/>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="175" y="68">Cellar</text><text x="238" y="68">Moat</text><text x="301" y="68">Merchant</text><text x="364" y="68">Village</text><text x="427" y="68">Workshop</text>
      <text x="175" y="122">Militia</text><text x="238" y="122">Remodel</text><text x="301" y="122">Smithy</text><text x="364" y="122">Market</text><text x="427" y="122">Mine</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="175" y="89">2</text><text x="238" y="89">2</text><text x="301" y="89">3</text><text x="364" y="89">3</text><text x="427" y="89">3</text>
      <text x="175" y="143">4</text><text x="238" y="143">4</text><text x="301" y="143">4</text><text x="364" y="143">5</text><text x="427" y="143">5</text>
    </g>
    <text x="146" y="172">10 cards per pile.</text>
    <text x="146" y="187">Coin = cost.</text>

    <!-- Trash mat -->
    <rect x="298" y="160" width="158" height="30" rx="6" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="377" y="179" text-anchor="middle" font-weight="700">Trash mat (empty)</text>

    <!-- Player 1 -->
    <rect x="10" y="204" width="226" height="110" rx="12" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/>
    <text x="20" y="221" font-weight="700">Player 1</text>
    <text x="80" y="221">7 Coppers, 3 Estates</text>
    <use href="#back" x="24" y="234"/>
    <use href="#back" x="21" y="231"/>
    <use href="#back" x="18" y="228"/>
    <use href="#cu" x="70" y="230"/>
    <use href="#cu" x="86" y="230"/>
    <use href="#es" x="102" y="230"/>
    <use href="#cu" x="118" y="230"/>
    <use href="#cu" x="134" y="230"/>
    <rect x="178" y="230" width="30" height="42" rx="4" fill="none" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="292">Deck</text>
    <text x="20" y="306" font-size="11">5 left</text>
    <text x="70" y="292">Hand</text>
    <text x="70" y="306" font-size="11">5 cards drawn</text>
    <text x="172" y="292">Discard</text>
    <text x="172" y="306" font-size="11">empty</text>

    <!-- Player 2 -->
    <rect x="244" y="204" width="226" height="110" rx="12" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/>
    <text x="254" y="221" font-weight="700">Player 2</text>
    <text x="314" y="221">7 Coppers, 3 Estates</text>
    <use href="#back" x="258" y="234"/>
    <use href="#back" x="255" y="231"/>
    <use href="#back" x="252" y="228"/>
    <use href="#cu" x="304" y="230"/>
    <use href="#es" x="320" y="230"/>
    <use href="#cu" x="336" y="230"/>
    <use href="#es" x="352" y="230"/>
    <use href="#cu" x="368" y="230"/>
    <rect x="412" y="230" width="30" height="42" rx="4" fill="none" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="254" y="292">Deck</text>
    <text x="254" y="306" font-size="11">5 left</text>
    <text x="304" y="292">Hand</text>
    <text x="304" y="306" font-size="11">5 cards drawn</text>
    <text x="406" y="292">Discard</text>
    <text x="406" y="306" font-size="11">empty</text>
  </g>
</svg>
