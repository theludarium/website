<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Lost Ruins of Arnak setup</title>
  <desc id="d">A four-player setup on the Bird Temple side: the card row with the artifact deck, Fear cards, and item deck above 1 artifact, the moon staff on round I, and 5 items; the island with level II sites holding 2 idols each, level I sites holding 1 face-up idol, and 5 starting sites; the research track with the Lost Temple's temple tile stacks and every player's magnifying glass on their notebook at the start; the supply board; and each player's deck, archaeologists, idol slots, and starting coins and compasses by seat.</desc>
  <defs>
    <g id="stack">
      <rect x="4" y="4" width="18" height="22" rx="3" stroke="#2B1E16" stroke-width="1"/>
      <rect x="2" y="2" width="18" height="22" rx="3" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="18" height="22" rx="3" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <g id="tiles">
      <rect x="4" y="4" width="14" height="14" rx="2" stroke="#2B1E16" stroke-width="1"/>
      <rect x="2" y="2" width="14" height="14" rx="2" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="14" height="14" rx="2" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <polygon id="hex" points="6,0 3,5.2 -3,5.2 -6,0 -3,-5.2 3,-5.2" stroke="#2B1E16" stroke-width="1"/>
    <path id="pawn" d="M6 0 a3.6 3.6 0 1 1 0 7.2 a3.6 3.6 0 1 1 0 -7.2 Z M1 18 L3 9 L9 9 L11 18 Z"/>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Main board -->
    <rect x="8" y="8" width="336" height="228" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="18" y="24" font-weight="700" fill="#2F5D50">Main board, Bird Temple side, four players</text>

    <!-- Card row: decks -->
    <use href="#stack" x="18" y="30" fill="#B9AD9C"/>
    <text x="46" y="46">Artifact deck</text>
    <use href="#stack" x="136" y="30" fill="#2B1E16"/>
    <text x="164" y="46">Fear cards</text>
    <use href="#stack" x="238" y="30" fill="#B9AD9C"/>
    <text x="266" y="46">Item deck</text>

    <!-- Card row: 1 artifact, moon staff, 5 items -->
    <rect x="18" y="60" width="18" height="26" rx="3" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <line x1="45" y1="60" x2="45" y2="90" stroke="#2B1E16" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45" cy="59" r="5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="1">
      <rect x="54" y="60" width="18" height="26" rx="3"/>
      <rect x="76" y="60" width="18" height="26" rx="3"/>
      <rect x="98" y="60" width="18" height="26" rx="3"/>
      <rect x="120" y="60" width="18" height="26" rx="3"/>
      <rect x="142" y="60" width="18" height="26" rx="3"/>
    </g>
    <g font-size="11">
      <text x="172" y="65">Each round the staff</text>
      <text x="172" y="76">moves right: more</text>
      <text x="172" y="87">artifacts, fewer items</text>
      <text x="18" y="101">1 artifact, moon staff on round I, 5 items</text>
    </g>
    <line x1="14" y1="106" x2="338" y2="106" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Island: level II sites -->
    <text x="18" y="126" font-weight="700">Level II sites</text>
    <text x="18" y="140" font-size="11">1 idol up, 1 down</text>
    <g fill="none" stroke="#B9AD9C" stroke-width="1.2">
      <rect x="128" y="114" width="26" height="30" rx="4"/>
      <rect x="160" y="114" width="26" height="30" rx="4"/>
      <rect x="192" y="114" width="26" height="30" rx="4"/>
    </g>
    <use href="#hex" x="138" y="125" fill="#B9AD9C"/>
    <use href="#hex" x="144" y="133" fill="#E0A23B"/>
    <use href="#hex" x="170" y="125" fill="#B9AD9C"/>
    <use href="#hex" x="176" y="133" fill="#E0A23B"/>
    <use href="#hex" x="202" y="125" fill="#B9AD9C"/>
    <use href="#hex" x="208" y="133" fill="#E0A23B"/>
    <text x="222" y="132">…</text>
    <line x1="14" y1="149" x2="232" y2="149" stroke="#B9AD9C" stroke-width="1"/>

    <!-- Island: level I sites -->
    <text x="18" y="166" font-weight="700">Level I sites</text>
    <text x="18" y="180" font-size="11">1 idol face up</text>
    <g fill="none" stroke="#B9AD9C" stroke-width="1.2">
      <rect x="128" y="154" width="26" height="30" rx="4"/>
      <rect x="160" y="154" width="26" height="30" rx="4"/>
      <rect x="192" y="154" width="26" height="30" rx="4"/>
    </g>
    <use href="#hex" x="141" y="169" fill="#E0A23B"/>
    <use href="#hex" x="173" y="169" fill="#E0A23B"/>
    <use href="#hex" x="205" y="169" fill="#E0A23B"/>
    <text x="222" y="172">…</text>
    <line x1="14" y1="189" x2="232" y2="189" stroke="#B9AD9C" stroke-width="1"/>

    <!-- Island: 5 starting sites, each with a single and a double space -->
    <text x="18" y="208" font-weight="700">Starting sites</text>
    <text x="18" y="222" font-size="11">5, open at the start</text>
    <g fill="#2F5D50" stroke="#2B1E16" stroke-width="1">
      <rect x="128" y="196" width="18" height="16" rx="3"/>
      <rect x="150" y="196" width="18" height="16" rx="3"/>
      <rect x="172" y="196" width="18" height="16" rx="3"/>
      <rect x="194" y="196" width="18" height="16" rx="3"/>
      <rect x="216" y="196" width="18" height="16" rx="3"/>
    </g>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <circle cx="132" cy="221" r="3"/><circle cx="139" cy="221" r="2.6"/><circle cx="143.5" cy="221" r="2.6"/>
      <circle cx="154" cy="221" r="3"/><circle cx="161" cy="221" r="2.6"/><circle cx="165.5" cy="221" r="2.6"/>
      <circle cx="176" cy="221" r="3"/><circle cx="183" cy="221" r="2.6"/><circle cx="187.5" cy="221" r="2.6"/>
      <circle cx="198" cy="221" r="3"/><circle cx="205" cy="221" r="2.6"/><circle cx="209.5" cy="221" r="2.6"/>
      <circle cx="220" cy="221" r="3"/><circle cx="227" cy="221" r="2.6"/><circle cx="231.5" cy="221" r="2.6"/>
    </g>

    <!-- Research track -->
    <rect x="240" y="110" width="98" height="122" rx="6" fill="none" stroke="#B9AD9C" stroke-width="1"/>
    <text x="289" y="124" font-weight="700" text-anchor="middle">Research track</text>
    <rect x="247" y="130" width="84" height="40" rx="4" fill="none" stroke="#2B1E16" stroke-width="1"/>
    <text x="289" y="143" font-size="11" text-anchor="middle">Lost Temple</text>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8">
      <rect x="282" y="147" width="14" height="6" rx="1"/>
      <rect x="273" y="155" width="14" height="6" rx="1"/>
      <rect x="291" y="155" width="14" height="6" rx="1"/>
      <rect x="264" y="163" width="14" height="5" rx="1"/>
      <rect x="282" y="163" width="14" height="5" rx="1"/>
      <rect x="300" y="163" width="14" height="5" rx="1"/>
    </g>
    <g fill="none" stroke="#B9AD9C" stroke-width="1">
      <rect x="249" y="175" width="36" height="7" rx="1"/><rect x="293" y="175" width="36" height="7" rx="1"/>
      <rect x="249" y="185" width="36" height="7" rx="1"/><rect x="293" y="185" width="36" height="7" rx="1"/>
      <rect x="249" y="195" width="36" height="7" rx="1"/><rect x="293" y="195" width="36" height="7" rx="1"/>
    </g>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.6">
      <rect x="264" y="176" width="5" height="5"/><rect x="308" y="176" width="5" height="5"/>
      <rect x="264" y="186" width="5" height="5"/><rect x="308" y="196" width="5" height="5"/>
    </g>
    <!-- Every player's magnifying glass sits on their notebook at the start -->
    <g stroke="#2B1E16" stroke-width="0.8">
      <rect x="253" y="210" width="10" height="7" fill="#2F5D50"/><circle cx="258" cy="207" r="3.6" fill="#2F5D50"/>
      <rect x="271" y="210" width="10" height="7" fill="#E0A23B"/><circle cx="276" cy="207" r="3.6" fill="#E0A23B"/>
      <rect x="289" y="210" width="10" height="7" fill="#2B1E16"/><circle cx="294" cy="207" r="3.6" fill="#2B1E16"/>
      <rect x="307" y="210" width="10" height="7" fill="#B9AD9C"/><circle cx="312" cy="207" r="3.6" fill="#B9AD9C"/>
    </g>
    <text x="289" y="228" font-size="11" text-anchor="middle">Start spaces</text>

    <!-- Supply board -->
    <rect x="350" y="8" width="122" height="228" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="360" y="24" font-weight="700" fill="#2F5D50">Supply board</text>
    <circle cx="366" cy="38" r="5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <text x="380" y="42">Coins</text>
    <circle cx="366" cy="54" r="5" fill="#F6EFE3" stroke="#2F5D50" stroke-width="2"/>
    <polygon points="366,50.5 367.6,54 366,57.5 364.4,54" fill="#2F5D50"/>
    <text x="380" y="58">Compasses</text>
    <rect x="361" y="66" width="10" height="8" rx="1" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <text x="380" y="74">Tablets</text>
    <polygon points="366,81 371,91 361,91" fill="#2B1E16"/>
    <text x="380" y="90">Arrowheads</text>
    <polygon points="366,97 371,102 366,107 361,102" fill="#2F5D50" stroke="#2B1E16" stroke-width="0.8"/>
    <text x="380" y="106">Jewels</text>
    <line x1="356" y1="114" x2="466" y2="114" stroke="#B9AD9C" stroke-width="1"/>
    <use href="#tiles" x="358" y="120" fill="#B9AD9C"/>
    <text x="384" y="134">Level I sites</text>
    <use href="#tiles" x="358" y="146" fill="#B9AD9C"/>
    <text x="384" y="160">Level II sites</text>
    <use href="#tiles" x="358" y="172" fill="#2B1E16"/>
    <text x="384" y="186">Guardians</text>
    <g fill="#B9AD9C" stroke="#2B1E16" stroke-width="1">
      <rect x="358" y="198" width="11" height="14" rx="2"/>
      <rect x="373" y="198" width="11" height="14" rx="2"/>
      <rect x="388" y="198" width="11" height="14" rx="2"/>
    </g>
    <text x="404" y="210">Assistants</text>
    <text x="358" y="228" font-size="11">3 stacks of 4</text>

    <!-- Each player -->
    <rect x="8" y="244" width="464" height="70" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="18" y="260" font-weight="700" fill="#2F5D50">Each player</text>
    <use href="#stack" x="18" y="268" fill="#B9AD9C"/>
    <g font-size="11">
      <text x="48" y="276">Deck of 6, shuffled:</text>
      <text x="48" y="290">2 Funding, 2 Exploration,</text>
      <text x="48" y="304">2 Fear</text>
    </g>
    <use href="#pawn" x="204" y="264" fill="#2F5D50"/>
    <use href="#pawn" x="222" y="264" fill="#2F5D50"/>
    <text x="196" y="302" font-size="11">2 archaeologists</text>
    <g fill="none">
      <use href="#hex" x="304" y="276"/>
      <use href="#hex" x="318" y="276"/>
      <use href="#hex" x="332" y="276"/>
      <use href="#hex" x="346" y="276"/>
    </g>
    <text x="300" y="302" font-size="11">4 idol slots</text>

    <!-- Starting resources by seat -->
    <text x="380" y="260" font-weight="700">Start with</text>
    <g font-size="11">
      <text x="380" y="274">Seat 1</text>
      <text x="380" y="286">Seat 2</text>
      <text x="380" y="298">Seat 3</text>
      <text x="380" y="310">Seat 4</text>
    </g>
    <g stroke-width="1">
      <circle cx="424" cy="270" r="4" fill="#E0A23B" stroke="#2B1E16"/>
      <circle cx="435" cy="270" r="4" fill="#E0A23B" stroke="#2B1E16"/>
      <circle cx="424" cy="282" r="4" fill="#E0A23B" stroke="#2B1E16"/>
      <circle cx="435" cy="282" r="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="2"/>
      <circle cx="424" cy="294" r="4" fill="#E0A23B" stroke="#2B1E16"/>
      <circle cx="435" cy="294" r="4" fill="#E0A23B" stroke="#2B1E16"/>
      <circle cx="446" cy="294" r="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="2"/>
      <circle cx="424" cy="306" r="4" fill="#E0A23B" stroke="#2B1E16"/>
      <circle cx="435" cy="306" r="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="2"/>
      <circle cx="446" cy="306" r="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="2"/>
    </g>
  </g>
</svg>
