      <rect x="50" y="250" width="30" height="14" rx="7" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <rect x="86" y="240" width="12" height="18" rx="2" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
      <rect x="100" y="240" width="12" height="18" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <text x="18" y="292">Mat, HP dial, six</text>
      <text x="18" y="306">A cards, modifiers</text>
    </g>
    <use href="#pa" x="117"/>
    <use href="#pa" x="234"/>
    <use href="#pa" x="351"/>
