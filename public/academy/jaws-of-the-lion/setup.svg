    <!-- Bottom: four player areas -->
    <text x="10" y="224" font-size="13" font-weight="700">Each player, in front of them</text>
    <g id="pa">
      <rect x="10" y="232" width="110" height="80" rx="8" fill="#2F5D50" fill-opacity="0.08" stroke="#2F5D50" stroke-width="1.4"/>
