<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Jaws of the Lion setup for the first scenario, in the abstract</title>
  <desc id="d">The scenario book lies open in the middle of the table as the map: a grid of hexes with four starting hexes on the left, normal and elite monster hexes on the right, and obstacle hexes between. To the left sit the city map board set aside, the monster stat card in its envelope, and the 20-card monster attack modifier deck. To the right sit the token tray and the initiative order tokens. Along the bottom, each player has a character mat, hit point dial, six level A ability cards, an attack modifier deck, and a reference card.</desc>
  <defs>
    <g id="hx"><polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/></g>
    <g id="st"><polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/></g>
    <g id="ob"><polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/></g>
    <g id="mn"><polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/><circle r="5.5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.6"/></g>
    <g id="me"><polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/><circle r="5.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1.6"/></g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <text x="240" y="22" font-size="14" font-weight="700" text-anchor="middle">Scenario 1 setup, in the abstract</text>

    <!-- Scenario book: two open pages that are the map -->
    <rect x="128" y="34" width="224" height="170" rx="10" fill="#2F5D50" fill-opacity="0.08" stroke="#B9AD9C" stroke-width="1.5"/>
    <line x1="240" y1="38" x2="240" y2="200" stroke="#B9AD9C" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="240" y="50" font-size="13" font-weight="700" text-anchor="middle">Scenario book: the map</text>
    <g>
      <use href="#hx" x="148" y="70"/>
      <use href="#hx" x="167" y="70"/>
      <use href="#hx" x="186" y="70"/>
