    <!-- legend -->
    <g transform="translate(136 192)">
      <use href="#st" x="0" y="0" transform="scale(0.6)"/>
      <text x="9" y="4">Start</text>
      <use href="#ob" x="0" y="0" transform="translate(46 0) scale(0.6)"/>
