    <circle cx="398" cy="76" r="7" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <circle cx="418" cy="76" r="7" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <rect x="432" y="69" width="14" height="14" rx="3" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>

    <rect x="360" y="106" width="110" height="98" rx="8" fill="#2B1E16" fill-opacity="0.06" stroke="#2B1E16" stroke-width="1.2"/>
    <text x="370" y="124" font-weight="700">Initiative</text>
    <text x="370" y="139">order tokens</text>
    <rect x="370" y="148" width="90" height="10" rx="3" fill="#2F5D50"/>
    <rect x="370" y="162" width="90" height="10" rx="3" fill="#2F5D50"/>
    <rect x="370" y="176" width="90" height="10" rx="3" fill="#2B1E16"/>
