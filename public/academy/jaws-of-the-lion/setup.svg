    <!-- Left column: monster side and the city -->
    <rect x="10" y="34" width="110" height="44" rx="8" fill="none" stroke="#B9AD9C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="20" y="52" font-weight="700">City map board</text>
    <text x="20" y="68">set aside for now</text>

    <rect x="10" y="86" width="110" height="56" rx="8" fill="#2B1E16" fill-opacity="0.06" stroke="#2B1E16" stroke-width="1.2"/>
    <text x="20" y="104" font-weight="700">Monster stat</text>
    <text x="20" y="119">card in envelope,</text>
    <text x="20" y="134">level 1 showing</text>

    <rect x="10" y="150" width="110" height="54" rx="8" fill="#2B1E16" fill-opacity="0.06" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="18" y="160" width="22" height="34" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <rect x="22" y="156" width="22" height="34" rx="3" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <text x="50" y="166" font-weight="700">Monster</text>
    <text x="50" y="180">modifier</text>
    <text x="50" y="194">deck (20)</text>

    <!-- Right column: shared pieces -->
    <rect x="360" y="34" width="110" height="64" rx="8" fill="#2B1E16" fill-opacity="0.06" stroke="#2B1E16" stroke-width="1.2"/>
