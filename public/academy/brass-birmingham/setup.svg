<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Brass: Birmingham setup</title>
  <desc id="d">A four-player setup. On the board: the draw deck and the face-up wild cards, merchant tiles, three of them blank, with beer barrels beside the others at Warrington, Nottingham, Shrewsbury, Gloucester, and Oxford, the coal market with one £1 space empty, the iron market with both £1 spaces empty, the turn order track, and markers on the progress track. Below: the general supply and the bank. Beside: one player's mat, £17, 14 link tiles, a hand of 8 cards, and a face-down discard.</desc>
  <defs>
    <g id="barrel">
      <rect width="7" height="9" rx="2.5" fill="#2F5D50"/>
      <rect y="2.5" width="7" height="1" fill="#F6EFE3"/>
      <rect y="5.5" width="7" height="1" fill="#F6EFE3"/>
    </g>
    <rect id="coal" width="9" height="9" rx="1.5" fill="#2B1E16"/>
    <rect id="iron" width="9" height="9" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.6"/>
    <rect id="slot" width="9" height="9" rx="1.5" fill="none" stroke="#2B1E16" stroke-width="0.8" stroke-dasharray="2 1.5"/>
    <rect id="merch" width="14" height="14" rx="2.5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <rect id="town" width="20" height="12" rx="3" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <g id="stack">
      <rect x="3" width="14" height="14" rx="2.5" fill="#2F5D50" opacity="0.5"/>
      <rect y="3" width="14" height="14" rx="2.5" fill="#2F5D50"/>
    </g>
    <g id="card"><rect width="14" height="22" rx="2.5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/></g>
    <g id="coin">
      <circle r="7" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.8"/>
      <text y="3.5" font-size="10" text-anchor="middle" fill="#2B1E16">£</text>
    </g>
  </defs>

  <rect width="480" height="320" fill="#F6EFE3"/>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- The board and its progress track -->
    <rect x="8" y="8" width="292" height="260" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <rect x="14" y="14" width="280" height="248" rx="8" fill="none" stroke="#B9AD9C" stroke-width="6" stroke-dasharray="5 2"/>
    <circle cx="19" cy="257" r="4.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <circle cx="14" cy="214" r="4.5" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>

    <!-- Canal and rail lines between towns and merchants -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#2F5D50" stroke-width="2.5" opacity="0.75">
        <path d="M146 40 L150 72"/>
        <path d="M148 78 L162 116"/>
        <path d="M208 82 L214 124"/>
        <path d="M162 116 L100 154"/>
        <path d="M150 164 L206 172"/>
        <path d="M150 164 L128 228"/>
      </g>
      <g stroke="#2B1E16" stroke-width="1.5" stroke-dasharray="4 3">
        <path d="M222 40 L208 82"/>
        <path d="M148 78 L208 82"/>
        <path d="M162 116 L214 124"/>
        <path d="M100 154 L52 147"/>
        <path d="M162 116 L150 164"/>
        <path d="M214 124 L206 172"/>
        <path d="M206 172 L196 228"/>
      </g>
    </g>

    <!-- Towns -->
    <use href="#town" x="138" y="72"/>
    <use href="#town" x="198" y="76"/>
    <use href="#town" x="152" y="110"/>
    <use href="#town" x="204" y="118"/>
    <use href="#town" x="90" y="148"/>
    <use href="#town" x="140" y="158"/>
    <use href="#town" x="196" y="166"/>

    <!-- Card draw areas -->
    <rect x="28" y="28" width="20" height="28" rx="3" fill="#2B1E16"/>
    <rect x="26" y="26" width="20" height="28" rx="3" fill="#2B1E16" stroke="#B9AD9C" stroke-width="1"/>
    <text x="52" y="44">Draw deck</text>
    <rect x="26" y="62" width="20" height="28" rx="3" fill="#F6EFE3" stroke="#E0A23B" stroke-width="2"/>
    <text x="52" y="80">Wild location</text>
    <rect x="26" y="98" width="20" height="28" rx="3" fill="#F6EFE3" stroke="#E0A23B" stroke-width="2"/>
    <text x="52" y="116">Wild industry</text>

    <!-- Merchants: all 9 tiles in a 4-player game, 3 of them blank; a beer barrel beside each non-blank tile -->
    <g paint-order="stroke" stroke="#F6EFE3" stroke-width="3" stroke-linejoin="round">
      <text x="120" y="54">Warrington</text>
      <text x="196" y="54">Nottingham</text>
      <text x="24" y="170">Shrewsbury</text>
      <text x="104" y="223">Gloucester</text>
      <text x="176" y="223">Oxford</text>
    </g>
    <use href="#merch" x="120" y="26"/><use href="#barrel" x="136" y="29"/>
    <rect x="146" y="26" width="14" height="14" rx="2.5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="2.5 2"/>
    <use href="#merch" x="196" y="26"/><use href="#barrel" x="212" y="29"/>
    <use href="#merch" x="222" y="26"/><use href="#barrel" x="238" y="29"/>
    <use href="#merch" x="26" y="140"/><use href="#barrel" x="43" y="143"/>
    <use href="#merch" x="104" y="228"/><use href="#barrel" x="120" y="231"/>
    <rect x="130" y="228" width="14" height="14" rx="2.5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="2.5 2"/>
    <use href="#merch" x="176" y="228"/><use href="#barrel" x="192" y="231"/>
    <rect x="202" y="228" width="14" height="14" rx="2.5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="2.5 2"/>
    <text x="220" y="240" font-size="11">blank tile</text>

    <!-- Coal market: £1 to £7, one £1 space empty -->
    <text x="246" y="74" text-anchor="middle" font-weight="700">Coal</text>
    <use href="#coal" x="236" y="80"/><use href="#coal" x="247" y="80"/>
    <use href="#coal" x="236" y="91"/><use href="#coal" x="247" y="91"/>
    <use href="#coal" x="236" y="102"/><use href="#coal" x="247" y="102"/>
    <use href="#coal" x="236" y="113"/><use href="#coal" x="247" y="113"/>
    <use href="#coal" x="236" y="124"/><use href="#coal" x="247" y="124"/>
    <use href="#coal" x="236" y="135"/><use href="#coal" x="247" y="135"/>
    <use href="#coal" x="236" y="146"/><use href="#slot" x="247" y="146"/>

    <!-- Iron market: £1 to £5, both £1 spaces empty -->
    <text x="276" y="96" text-anchor="middle" font-weight="700">Iron</text>
    <use href="#iron" x="266" y="102"/><use href="#iron" x="277" y="102"/>
    <use href="#iron" x="266" y="113"/><use href="#iron" x="277" y="113"/>
    <use href="#iron" x="266" y="124"/><use href="#iron" x="277" y="124"/>
    <use href="#iron" x="266" y="135"/><use href="#iron" x="277" y="135"/>
    <use href="#slot" x="266" y="146"/><use href="#slot" x="277" y="146"/>
    <text x="233" y="154" font-size="11" text-anchor="end">£1</text>
    <text x="261" y="170" text-anchor="middle">markets</text>

    <!-- Line legend -->
    <path d="M238 186 L252 186" stroke="#2F5D50" stroke-width="2.5" opacity="0.75" stroke-linecap="round"/>
    <text x="256" y="190" font-size="11">canal</text>
    <path d="M238 200 L252 200" stroke="#2B1E16" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="256" y="204" font-size="11">rail</text>
    <rect x="238" y="210" width="14" height="9" rx="2" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <text x="256" y="218" font-size="11">town</text>

    <!-- Turn order track: character tiles in random order -->
    <circle cx="32" cy="192" r="5.5" fill="#2F5D50"/>
    <circle cx="32" cy="206" r="5.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <circle cx="32" cy="220" r="5.5" fill="#2B1E16"/>
    <circle cx="32" cy="234" r="5.5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.8"/>
    <text x="44" y="208">Turn order</text>
    <text x="44" y="221" font-size="11">(random)</text>

    <!-- Below the board: progress track note, general supply, bank -->
    <text x="10" y="287" font-weight="700">Progress track</text>
    <text x="10" y="300" font-size="11">VP markers on 0,</text>
    <text x="10" y="313" font-size="11">income markers on 10</text>

    <text x="140" y="287" font-weight="700">General supply</text>
    <use href="#coal" x="140" y="293"/><use href="#coal" x="151" y="293"/>
    <use href="#iron" x="172" y="293"/><use href="#iron" x="183" y="293"/>
    <use href="#barrel" x="204" y="293"/><use href="#barrel" x="214" y="293"/>
    <text x="140" y="315" font-size="11">coal</text>
    <text x="172" y="315" font-size="11">iron</text>
    <text x="204" y="315" font-size="11">beer</text>

    <text x="248" y="287" font-weight="700">Bank</text>
    <use href="#coin" x="256" y="302"/>
    <use href="#coin" x="273" y="302"/>
    <use href="#coin" x="290" y="302"/>

    <!-- One player's area -->
    <text x="312" y="20" font-size="13" font-weight="700">One player's area</text>
    <rect x="310" y="28" width="162" height="104" rx="8" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
    <text x="318" y="44" font-weight="700" fill="#2F5D50">Player mat</text>
    <use href="#stack" x="318" y="50"/><text x="318" y="81">Cotton</text>
    <use href="#stack" x="370" y="50"/><text x="370" y="81">Coal</text>
    <use href="#stack" x="422" y="50"/><text x="422" y="81">Iron</text>
    <use href="#stack" x="318" y="89"/><text x="318" y="120">Manuf.</text>
    <use href="#stack" x="370" y="89"/><text x="370" y="120">Pottery</text>
    <use href="#stack" x="422" y="89"/><text x="422" y="120">Brewery</text>

    <use href="#coin" x="320" y="151"/>
    <use href="#coin" x="336" y="151"/>
    <use href="#coin" x="352" y="151"/>
    <text x="313" y="175">£17</text>

    <rect x="392" y="140" width="26" height="7" rx="3.5" fill="#2F5D50" opacity="0.5"/>
    <rect x="394" y="148" width="26" height="7" rx="3.5" fill="#2F5D50" opacity="0.75"/>
    <rect x="396" y="156" width="26" height="7" rx="3.5" fill="#2F5D50"/>
    <text x="392" y="175">14 link tiles</text>

    <use href="#card" x="312" y="188"/>
    <use href="#card" x="321" y="188"/>
    <use href="#card" x="330" y="188"/>
    <use href="#card" x="339" y="188"/>
    <use href="#card" x="348" y="188"/>
    <use href="#card" x="357" y="188"/>
    <use href="#card" x="366" y="188"/>
    <use href="#card" x="375" y="188"/>
    <text x="312" y="226">Hand: 8 cards</text>

    <rect x="412" y="188" width="14" height="22" rx="2.5" fill="#2B1E16" stroke="#B9AD9C" stroke-width="1"/>
    <text x="404" y="226">Discard: 1</text>
    <text x="404" y="239" font-size="11">face down</text>

    <text x="312" y="262" font-weight="700" fill="#2F5D50">Four players shown</text>
    <text x="312" y="277" font-size="11">With 2 or 3 players, return</text>
    <text x="312" y="290" font-size="11">cards and merchant tiles</text>
    <text x="312" y="303" font-size="11">marked for more players.</text>
  </g>
</svg>
