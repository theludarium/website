<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
<title id="t">The Night Cage setup</title>
<desc id="d">The Night Cage after the first round of a four-player game. A 6x6 board, dark except where four Start tiles sit, each with a candle-shaped Prisoner token and a lit Passage tile at each of its two exits. Key and Nerve tokens wait on marked corners of the board. Beside it, the candle-shaped Tile Holder holds the Draw Stack, the discard board waits for lost tiles, and a key shows Passage, Crumbling, Key, Gate, and Wax Eater tiles.</desc>
