<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Riftbound two-player play area</title>
  <desc id="d">One player's side of a two-player game. The opponent's side mirrors it across the top. The battlefield zone in the middle holds two battlefields, one from each player, each with a facedown slot for one hidden card. Your side has the Legend and Chosen Champion on the left with a hand of 4, the base in the center with units, gear, and channeled runes, and the Main Deck, Rune Deck, trash, and score on the right.</desc>
  <defs>
    <g id="deck">
      <rect x="4" y="4" width="40" height="56" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="2" y="2" width="40" height="56" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="56" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Opponent's side, mirrored -->
    <rect x="16" y="6" width="448" height="26" rx="8" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="240" y="23" text-anchor="middle">Opponent's side: a mirror of yours</text>

    <!-- Battlefield zone -->
    <rect x="16" y="38" width="448" height="100" rx="12" fill="none" stroke="#2F5D50" stroke-width="1.5"/>
    <text x="28" y="54" font-size="13" font-weight="700" fill="#2F5D50">Battlefield zone</text>

    <!-- Battlefield 1 (yours) with its facedown slot -->
    <rect x="40" y="62" width="150" height="58" rx="7" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="115" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#F6EFE3">Your battlefield</text>
    <text x="115" y="104" text-anchor="middle" fill="#F6EFE3">conquer 1, hold 1 a turn</text>
    <rect x="198" y="68" width="32" height="46" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="214" y="95" text-anchor="middle" font-size="12" font-weight="700">?</text>

    <!-- Battlefield 2 (theirs) with its facedown slot -->
    <rect x="250" y="62" width="150" height="58" rx="7" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="325" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#F6EFE3">Their battlefield</text>
    <text x="325" y="104" text-anchor="middle" fill="#F6EFE3">conquer 1, hold 1 a turn</text>
    <rect x="408" y="68" width="32" height="46" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="424" y="95" text-anchor="middle" font-size="12" font-weight="700">?</text>

    <text x="240" y="133" text-anchor="middle">Dashed slots: one facedown hidden card per battlefield</text>

    <!-- Chosen Champion and Legend (Legend sits between the Champion and the base) -->
    <rect x="16" y="150" width="66" height="78" rx="6" fill="#F6EFE3" stroke="#E0A23B" stroke-width="2.5"/>
    <text x="49" y="182" text-anchor="middle" font-weight="700">Chosen</text>
    <text x="49" y="197" text-anchor="middle" font-weight="700">Champion</text>
    <text x="49" y="212" text-anchor="middle">zone</text>
    <rect x="88" y="150" width="54" height="78" rx="6" fill="#E0A23B" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="115" y="186" text-anchor="middle" font-weight="700">Legend</text>
    <text x="115" y="202" text-anchor="middle">zone</text>
    <text x="16" y="250" font-weight="700">Hand: draw 4</text>
    <text x="16" y="266">Mulligan up to 2</text>

    <!-- Base: units, gear, runes -->
    <rect x="146" y="146" width="200" height="158" rx="12" fill="none" stroke="#2F5D50" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="158" y="164" font-size="13" font-weight="700" fill="#2F5D50">Your base</text>
    <!-- two units (one exhausted, turned sideways) and a gear -->
    <rect x="160" y="170" width="30" height="42" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="196" y="176" width="42" height="30" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="248" y="170" width="30" height="42" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1.2"/>
    <text x="199" y="226" text-anchor="middle">Units</text>
    <text x="263" y="226" text-anchor="middle">Gear</text>
    <!-- runes: four ready, two exhausted -->
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="1">
      <rect x="160" y="236" width="20" height="28" rx="3"/>
      <rect x="186" y="236" width="20" height="28" rx="3"/>
      <rect x="212" y="236" width="20" height="28" rx="3"/>
      <rect x="238" y="236" width="20" height="28" rx="3"/>
      <rect x="264" y="240" width="28" height="20" rx="3"/>
      <rect x="298" y="240" width="28" height="20" rx="3"/>
    </g>
    <text x="158" y="280">Runes: channel 2 each turn</text>
    <text x="158" y="296">Sideways cards are exhausted</text>

    <!-- Decks, trash, score -->
    <use href="#deck" x="358" y="148"/>
    <use href="#deck" x="414" y="148"/>
    <text x="380" y="224" text-anchor="middle" font-weight="700">Main</text>
    <text x="380" y="238" text-anchor="middle">39 cards</text>
    <text x="436" y="224" text-anchor="middle" font-weight="700">Runes</text>
    <text x="436" y="238" text-anchor="middle">12 cards</text>
    <rect x="358" y="248" width="44" height="56" rx="5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <text x="380" y="281" text-anchor="middle" font-weight="700">Trash</text>
    <rect x="410" y="248" width="54" height="56" rx="8" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <text x="437" y="270" text-anchor="middle" fill="#F6EFE3">Score</text>
    <text x="437" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#F6EFE3">0 / 8</text>

    <text x="240" y="316" text-anchor="middle" fill="#2F5D50">Duel: each player brings 3 battlefields and uses 1, picked at random</text>
  </g>
</svg>
