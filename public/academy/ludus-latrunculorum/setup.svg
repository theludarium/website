<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Ludus Latrunculorum setup: an empty 8 by 8 board and the three capture rules</title>
  <desc id="d">An empty eight by eight board, labelled A to H across and I to VIII up the side in Roman numerals. A side panel explains placement, then shows a sandwich capture in a row, a corner capture by two pieces, and safe entry between two enemies.</desc>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2B1E16">
  <text x="24" y="26" font-size="13" font-weight="700">The board starts empty</text>
  <rect x="18" y="34" width="268" height="268" rx="8" fill="#B9AD9C" opacity="0.5"/>
  <rect x="24" y="40" width="256" height="256" fill="#FBF7EF"/><line x1="56" y1="40" x2="56" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="88" y1="40" x2="88" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="120" y1="40" x2="120" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="152" y1="40" x2="152" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="184" y1="40" x2="184" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="216" y1="40" x2="216" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="248" y1="40" x2="248" y2="296" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="72" x2="280" y2="72" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="104" x2="280" y2="104" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="136" x2="280" y2="136" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="168" x2="280" y2="168" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="200" x2="280" y2="200" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="232" x2="280" y2="232" stroke="#2B1E16" stroke-width="0.9"/><line x1="24" y1="264" x2="280" y2="264" stroke="#2B1E16" stroke-width="0.9"/><rect x="24" y="40" width="256" height="256" fill="none" stroke="#2B1E16" stroke-width="2"/><text x="40" y="314" font-size="10" text-anchor="middle">A</text><text x="72" y="314" font-size="10" text-anchor="middle">B</text><text x="104" y="314" font-size="10" text-anchor="middle">C</text><text x="136" y="314" font-size="10" text-anchor="middle">D</text><text x="168" y="314" font-size="10" text-anchor="middle">E</text><text x="200" y="314" font-size="10" text-anchor="middle">F</text><text x="232" y="314" font-size="10" text-anchor="middle">G</text><text x="264" y="314" font-size="10" text-anchor="middle">H</text><text x="289" y="59.5" font-size="9">VIII</text><text x="289" y="91.5" font-size="9">VII</text><text x="289" y="123.5" font-size="9">VI</text><text x="289" y="155.5" font-size="9">V</text><text x="289" y="187.5" font-size="9">IV</text><text x="289" y="219.5" font-size="9">III</text><text x="289" y="251.5" font-size="9">II</text><text x="289" y="283.5" font-size="9">I</text><text x="318" y="26" font-size="13" font-weight="700">1. Place</text>
  <text x="318" y="44" font-size="11">Light first, then take turns</text>
  <text x="318" y="58" font-size="11">placing one piece anywhere,</text>
  <text x="318" y="72" font-size="11">16 each. No captures yet.</text>
  <circle cx="326" cy="88" r="7" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.12"/><circle cx="344" cy="88" r="7" fill="#2B1E16" stroke="#2B1E16" stroke-width="1.12"/><circle cx="362" cy="88" r="7" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.12"/><circle cx="380" cy="88" r="7" fill="#2B1E16" stroke="#2B1E16" stroke-width="1.12"/>
  <text x="394" y="92" font-size="11">and so on</text>
  <text x="318" y="122" font-size="13" font-weight="700">2. Move and capture</text><rect x="318" y="132" width="80" height="20" fill="#F6EFE3"/><line x1="338" y1="132" x2="338" y2="152" stroke="#2B1E16" stroke-width="0.8"/><line x1="358" y1="132" x2="358" y2="152" stroke="#2B1E16" stroke-width="0.8"/><line x1="378" y1="132" x2="378" y2="152" stroke="#2B1E16" stroke-width="0.8"/><rect x="318" y="132" width="80" height="20" fill="none" stroke="#2B1E16" stroke-width="1"/><circle cx="328" cy="142" r="7.199999999999999" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.152"/><circle cx="348" cy="142" r="7.199999999999999" fill="#2B1E16" stroke="#2B1E16" stroke-width="1.152"/><path d="M344.4 138.4 L351.6 145.6 M351.6 138.4 L344.4 145.6" stroke="#E0A23B" stroke-width="2.1599999999999997" stroke-linecap="round"/><circle cx="368" cy="142" r="7.199999999999999" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.152"/><circle cx="388" cy="142" r="6" fill="none" stroke="#2F5D50" stroke-width="1" stroke-dasharray="2 1.6"/><line x1="385.6" y1="142" x2="381" y2="142" stroke="#2F5D50" stroke-width="1.4" stroke-linecap="round"/><path d="M376 142 L381 145.5 L381 138.5 Z" fill="#2F5D50"/><text x="408" y="146" font-size="11">Sandwich</text><rect x="318" y="166" width="40" height="40" fill="#F6EFE3"/><line x1="338" y1="166" x2="338" y2="206" stroke="#2B1E16" stroke-width="0.8"/><line x1="318" y1="186" x2="358" y2="186" stroke="#2B1E16" stroke-width="0.8"/><rect x="318" y="166" width="40" height="40" fill="none" stroke="#2B1E16" stroke-width="1"/><path d="M318 206 V166 H358" fill="none" stroke="#2B1E16" stroke-width="3.5"/><circle cx="328" cy="176" r="7.199999999999999" fill="#2B1E16" stroke="#2B1E16" stroke-width="1.152"/><path d="M324.4 172.4 L331.6 179.6 M331.6 172.4 L324.4 179.6" stroke="#E0A23B" stroke-width="2.1599999999999997" stroke-linecap="round"/><circle cx="348" cy="176" r="7.199999999999999" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.152"/><circle cx="328" cy="196" r="7.199999999999999" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.152"/><circle cx="348" cy="196" r="6" fill="none" stroke="#2F5D50" stroke-width="1" stroke-dasharray="2 1.6"/><line x1="348" y1="193.6" x2="348" y2="189" stroke="#2F5D50" stroke-width="1.4" stroke-linecap="round"/><path d="M348 184 L351.5 189 L344.5 189 Z" fill="#2F5D50"/><text x="368" y="190" font-size="11">Corner: two</text><text x="368" y="203" font-size="11">enemies take it</text><rect x="318" y="222" width="60" height="40" fill="#F6EFE3"/><line x1="338" y1="222" x2="338" y2="262" stroke="#2B1E16" stroke-width="0.8"/><line x1="358" y1="222" x2="358" y2="262" stroke="#2B1E16" stroke-width="0.8"/><line x1="318" y1="242" x2="378" y2="242" stroke="#2B1E16" stroke-width="0.8"/><rect x="318" y="222" width="60" height="40" fill="none" stroke="#2B1E16" stroke-width="1"/><circle cx="328" cy="232" r="7.199999999999999" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.152"/><circle cx="348" cy="232" r="7.199999999999999" fill="#2B1E16" stroke="#2B1E16" stroke-width="1.152"/><circle cx="348" cy="232" r="2.52" fill="#E0A23B"/><circle cx="368" cy="232" r="7.199999999999999" fill="#FFFFFF" stroke="#2B1E16" stroke-width="1.152"/><circle cx="348" cy="252" r="6" fill="none" stroke="#2F5D50" stroke-width="1" stroke-dasharray="2 1.6"/><line x1="348" y1="249.6" x2="348" y2="245" stroke="#2F5D50" stroke-width="1.4" stroke-linecap="round"/><path d="M348 240 L351.5 245 L344.5 245 Z" fill="#2F5D50"/><text x="388" y="236" font-size="11">Safe entry:</text><text x="388" y="249" font-size="11">no capture</text><text x="318" y="282" font-size="11">One square, never diagonal.</text><text x="318" y="296" font-size="11">Most captures wins.</text>
  </g>
</svg>
