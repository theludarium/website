<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Magic play area for two players</title>
  <desc id="d">Each player has a side of the shared battlefield, with a row of lands nearest them and a row of creatures and other permanents in front, one creature turned sideways to show it is tapped, and a life total of 20. Next to each side sit the library face down, the graveyard face up, exile, and the command zone, used mostly in Commander. Hands are held off the table and hidden. The stack, where spells wait to resolve, sits on the center line.</desc>
  <defs>
    <g id="lib">
      <rect x="4" y="4" width="30" height="40" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="2" y="2" width="30" height="40" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="30" height="40" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="6" y="6" width="18" height="28" rx="3" fill="none" stroke="#2B1E16" stroke-width="0.8"/>
    </g>
    <g id="up">
      <rect x="0" y="0" width="30" height="40" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
      <rect x="4" y="5" width="22" height="13" rx="2" fill="#B9AD9C"/>
      <line x1="5" y1="24" x2="25" y2="24" stroke="#B9AD9C" stroke-width="1.5"/>
      <line x1="5" y1="29" x2="25" y2="29" stroke="#B9AD9C" stroke-width="1.5"/>
      <line x1="5" y1="34" x2="18" y2="34" stroke="#B9AD9C" stroke-width="1.5"/>
    </g>
    <g id="crt">
      <rect x="0" y="0" width="24" height="32" rx="3" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
      <rect x="3" y="4" width="18" height="11" rx="2" fill="#F6EFE3" opacity="0.85"/>
      <rect x="13" y="24" width="9" height="6" rx="1.5" fill="#F6EFE3"/>
    </g>
    <g id="land">
      <rect x="0" y="0" width="24" height="32" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <circle cx="12" cy="16" r="6" fill="#F6EFE3" stroke="#2B1E16" stroke-width="0.8"/>
    </g>
    <g id="back">
      <rect x="0" y="0" width="14" height="20" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- ===== Opponent (top) ===== -->
    <use href="#back" x="28" y="4"/><use href="#back" x="36" y="5"/><use href="#back" x="44" y="4"/>
    <text x="66" y="18" font-size="11">Opponent's hand: held, hidden</text>

    <rect x="16" y="28" width="292" height="114" rx="10" fill="none" stroke="#2F5D50" stroke-width="1.5"/>
    <!-- lands row, nearest the opponent -->
    <use href="#land" x="28" y="36"/><use href="#land" x="58" y="36"/><use href="#land" x="88" y="36"/>
    <text x="124" y="56" font-size="11">lands</text>
    <!-- creatures row -->
    <use href="#crt" x="28" y="76"/><use href="#crt" x="58" y="76"/>
    <text x="92" y="96" font-size="11">creatures and other permanents</text>
    <text x="28" y="134" font-weight="700" fill="#2F5D50">Battlefield: opponent's side</text>
    <rect x="226" y="120" width="74" height="18" rx="9" fill="#E0A23B"/>
    <text x="263" y="133" text-anchor="middle" font-weight="700">Life: 20</text>

    <rect x="335" y="6" width="30" height="40" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="339" y="11" width="22" height="13" rx="2" fill="#B9AD9C"/>
    <rect x="409" y="6" width="30" height="40" rx="4" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <rect x="413" y="11" width="22" height="13" rx="2" fill="#F6EFE3"/>
    <text x="350" y="60" text-anchor="middle">Exile</text>
    <text x="424" y="60" text-anchor="middle">Command zone</text>
    <use href="#lib" x="335" y="72"/>
    <use href="#up" x="409" y="72"/>
    <text x="350" y="130" text-anchor="middle">Library</text>
    <text x="424" y="130" text-anchor="middle">Graveyard</text>

    <!-- ===== Center line and the stack ===== -->
    <line x1="16" y1="160" x2="464" y2="160" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="104" y="148" width="272" height="24" rx="12" fill="#2F5D50"/>
    <text x="240" y="164" text-anchor="middle" fill="#F6EFE3" font-weight="700">The stack: spells wait here to resolve</text>

    <!-- ===== You (bottom) ===== -->
    <rect x="16" y="178" width="292" height="112" rx="10" fill="none" stroke="#2F5D50" stroke-width="1.5"/>
    <text x="28" y="195" font-weight="700" fill="#2F5D50">Battlefield: your side</text>
    <rect x="226" y="183" width="74" height="18" rx="9" fill="#E0A23B"/>
    <text x="263" y="196" text-anchor="middle" font-weight="700">Life: 20</text>
    <!-- creatures row, one tapped -->
    <use href="#crt" x="28" y="204"/><use href="#crt" x="58" y="204"/>
    <g transform="translate(90 232) rotate(-90)"><use href="#crt"/></g>
    <text x="130" y="218" font-size="11">creatures and other</text>
    <text x="130" y="231" font-size="11">permanents (one tapped)</text>
    <!-- lands row, nearest you -->
    <use href="#land" x="28" y="250"/><use href="#land" x="58" y="250"/><use href="#land" x="88" y="250"/><use href="#land" x="118" y="250"/>
    <text x="152" y="270" font-size="11">lands: play 1 per turn</text>

    <use href="#back" x="28" y="296"/><use href="#back" x="36" y="295"/><use href="#back" x="44" y="296"/>
    <text x="66" y="311" font-size="11">Your hand: held, hidden from others</text>

    <use href="#lib" x="335" y="180"/>
    <use href="#up" x="409" y="180"/>
    <text x="350" y="236" text-anchor="middle" font-weight="700">Library</text>
    <text x="350" y="248" text-anchor="middle" font-size="11">face down</text>
    <text x="424" y="236" text-anchor="middle" font-weight="700">Graveyard</text>
    <text x="424" y="248" text-anchor="middle" font-size="11">face up</text>

    <rect x="335" y="253" width="30" height="40" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="339" y="258" width="22" height="13" rx="2" fill="#B9AD9C"/>
    <rect x="409" y="253" width="30" height="40" rx="4" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <rect x="413" y="258" width="22" height="13" rx="2" fill="#F6EFE3"/>
    <text x="350" y="305" text-anchor="middle" font-weight="700">Exile</text>
    <text x="424" y="305" text-anchor="middle" font-weight="700">Command zone</text>
    <text x="424" y="316" text-anchor="middle" font-size="11" fill="#2F5D50">Mostly Commander</text>
  </g>
</svg>
