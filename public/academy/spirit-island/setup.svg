<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Spirit Island setup for two players</title>
  <desc id="d">The Invader board with the Fear Pool, the Fear Deck in three groups of 3, Terror Level 1, the Blight Card, and the Ravage, Build, and Explore spaces. Beside it, an Island of two boards with Ocean on the outer edges, the Minor and Major Power decks, and the supply. Along the bottom, each player's Spirit panel and hand of 4 Unique Power Cards.</desc>
  <defs>
    <g id="stack">
      <rect x="4" y="4" width="18" height="26" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="2" y="2" width="18" height="26" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="18" height="26" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <g id="town">
      <path d="M0 6 L4 2 L8 6 L8 11 L0 11 Z" fill="#2B1E16"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Invader board -->
    <rect x="8" y="8" width="192" height="228" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="18" y="27" font-size="13" font-weight="700">Invader board</text>

    <!-- Fear Pool: 4 markers per player, 8 for two players -->
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8">
      <circle cx="24" cy="42" r="4"/><circle cx="34" cy="42" r="4"/><circle cx="44" cy="42" r="4"/><circle cx="54" cy="42" r="4"/>
      <circle cx="24" cy="53" r="4"/><circle cx="34" cy="53" r="4"/><circle cx="44" cy="53" r="4"/><circle cx="54" cy="53" r="4"/>
    </g>
    <text x="68" y="45" font-weight="700">Fear Pool</text>
    <text x="68" y="59">4 per player</text>

    <!-- Fear Deck: 9 cards with two Terror Level dividers -->
    <use href="#stack" x="24" y="68"/>
    <rect x="40" y="76" width="9" height="4" rx="1" fill="#2F5D50"/>
    <rect x="40" y="86" width="9" height="4" rx="1" fill="#2F5D50"/>
    <text x="68" y="81" font-weight="700">Fear Deck, 9 cards</text>
    <text x="68" y="95">3 groups of 3</text>

    <!-- Terror Level -->
    <rect x="24" y="106" width="26" height="22" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
    <text x="37" y="122" font-size="14" font-weight="700" text-anchor="middle" fill="#2F5D50">1</text>
    <text x="68" y="116" font-weight="700">Terror Level 1</text>
    <text x="68" y="130">at the start</text>

    <!-- Blight Card -->
    <rect x="20" y="140" width="36" height="26" rx="3" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <g fill="#2B1E16">
      <circle cx="29" cy="149" r="2.5"/><circle cx="37" cy="149" r="2.5"/><circle cx="45" cy="149" r="2.5"/>
      <circle cx="33" cy="157" r="2.5"/><circle cx="41" cy="157" r="2.5"/>
    </g>
    <text x="68" y="151" font-weight="700">Blight Card</text>
    <text x="68" y="165">Healthy side up</text>

    <!-- Invader cards slide left each turn: Explore to Build to Ravage -->
    <path d="M186 180 H30" stroke="#2F5D50" stroke-width="1.5" fill="none"/>
    <path d="M24 180 L32 176 L32 184 Z" fill="#2F5D50"/>

    <!-- Ravage: empty at the start -->
    <rect x="16" y="188" width="56" height="42" rx="6" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/>
    <text x="44" y="201" font-weight="700" text-anchor="middle">Ravage</text>
    <rect x="35" y="205" width="18" height="21" rx="3" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Build: the first Invader card, face up -->
    <rect x="76" y="188" width="56" height="42" rx="6" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/>
    <text x="104" y="201" font-weight="700" text-anchor="middle">Build</text>
    <rect x="95" y="205" width="18" height="21" rx="3" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2"/>
    <rect x="95" y="211" width="18" height="8" fill="#2F5D50"/>

    <!-- Explore: the Invader Deck -->
    <rect x="136" y="188" width="56" height="42" rx="6" fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1"/>
    <text x="164" y="201" font-weight="700" text-anchor="middle">Explore</text>
    <g transform="translate(153 205) scale(0.8)"><use href="#stack"/></g>

    <!-- The Island: one board per player -->
    <text x="212" y="24" font-size="13" font-weight="700">Island: one board per player</text>
    <rect x="212" y="34" width="16" height="96" rx="4" fill="#B9AD9C"/>
    <text transform="translate(224 82) rotate(-90)" text-anchor="middle">Ocean</text>
    <rect x="452" y="34" width="16" height="96" rx="4" fill="#B9AD9C"/>
    <text transform="translate(464 82) rotate(90)" text-anchor="middle">Ocean</text>

    <rect x="230" y="34" width="220" height="96" rx="8" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <path d="M340 34 V130" stroke="#2B1E16" stroke-width="1.5"/>
    <!-- Land borders: eight lands on each board -->
    <g stroke="#B9AD9C" stroke-width="1" fill="none">
      <path d="M267 34 V130 M304 34 V130 M230 82 H267 M267 66 H340 M267 98 H340"/>
      <path d="M376 34 V130 M413 34 V130 M340 66 H413 M340 98 H413 M413 82 H450"/>
    </g>
    <!-- Starting Presence -->
    <g fill="#2F5D50">
      <circle cx="285" cy="50" r="5"/><circle cx="249" cy="112" r="5"/><circle cx="260" cy="112" r="5"/>
    </g>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8">
      <circle cx="395" cy="114" r="5"/><circle cx="426" cy="56" r="5"/>
    </g>
    <!-- Invaders and Dahan, as each land's icons show -->
    <g fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.8">
      <circle cx="320" cy="48" r="3.5"/><circle cx="249" cy="58" r="3.5"/><circle cx="358" cy="82" r="3.5"/><circle cx="432" cy="112" r="3.5"/>
    </g>
    <use href="#town" x="318" y="108"/>
    <use href="#town" x="390" y="44"/>
    <g fill="#2B1E16"><circle cx="286" cy="84" r="2.5"/><circle cx="360" cy="116" r="2.5"/></g>
    <text x="285" y="146" text-anchor="middle">Player 1's board</text>
    <text x="395" y="146" text-anchor="middle">Player 2's board</text>

    <!-- Power decks -->
    <use href="#stack" x="216" y="160"/>
    <rect x="244" y="160" width="18" height="26" rx="3" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="216" y="208">Minor Powers</text>
    <text x="216" y="222">deck, discard</text>

    <use href="#stack" x="298" y="160"/>
    <rect x="326" y="160" width="18" height="26" rx="3" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="298" y="208">Major Powers</text>
    <text x="298" y="222">deck, discard</text>

    <!-- Supply -->
    <circle cx="386" cy="172" r="6" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <circle cx="402" cy="172" r="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.8"/>
    <circle cx="415" cy="172" r="2.5" fill="#2B1E16"/>
    <use href="#town" x="423" y="165"/>
    <path d="M437 177 L437 167 L441 163 L445 167 L445 170 L449 170 L449 177 Z" fill="#2B1E16"/>
    <text x="380" y="198" font-weight="700">Supply</text>
    <text x="380" y="212">Energy, Dahan,</text>
    <text x="380" y="226">Invaders</text>

    <!-- Player 1 -->
    <rect x="8" y="244" width="228" height="68" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <rect x="16" y="252" width="70" height="52" rx="5" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
    <g stroke="#2B1E16" stroke-width="0.8">
      <circle cx="25" cy="267" r="4.5" fill="#F6EFE3"/>
      <circle cx="37" cy="267" r="4.5" fill="#2F5D50"/><circle cx="49" cy="267" r="4.5" fill="#2F5D50"/><circle cx="61" cy="267" r="4.5" fill="#2F5D50"/><circle cx="73" cy="267" r="4.5" fill="#2F5D50"/>
      <circle cx="25" cy="289" r="4.5" fill="#F6EFE3"/>
      <circle cx="37" cy="289" r="4.5" fill="#2F5D50"/><circle cx="49" cy="289" r="4.5" fill="#2F5D50"/><circle cx="61" cy="289" r="4.5" fill="#2F5D50"/>
    </g>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="92" y="258" width="14" height="22" rx="2"/><rect x="100" y="260" width="14" height="22" rx="2"/>
      <rect x="108" y="262" width="14" height="22" rx="2"/><rect x="116" y="264" width="14" height="22" rx="2"/>
    </g>
    <text x="140" y="261" font-weight="700">Player 1</text>
    <text x="140" y="275">Spirit panel</text>
    <text x="140" y="289">4 Unique Powers</text>
    <text x="140" y="303">in hand</text>

    <!-- Player 2 -->
    <rect x="244" y="244" width="228" height="68" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <rect x="252" y="252" width="70" height="52" rx="5" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
    <g stroke="#2B1E16" stroke-width="0.8">
      <circle cx="261" cy="267" r="4.5" fill="#F6EFE3"/>
      <circle cx="273" cy="267" r="4.5" fill="#E0A23B"/><circle cx="285" cy="267" r="4.5" fill="#E0A23B"/><circle cx="297" cy="267" r="4.5" fill="#E0A23B"/><circle cx="309" cy="267" r="4.5" fill="#E0A23B"/>
      <circle cx="261" cy="289" r="4.5" fill="#F6EFE3"/>
      <circle cx="273" cy="289" r="4.5" fill="#E0A23B"/><circle cx="285" cy="289" r="4.5" fill="#E0A23B"/><circle cx="297" cy="289" r="4.5" fill="#E0A23B"/>
    </g>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="328" y="258" width="14" height="22" rx="2"/><rect x="336" y="260" width="14" height="22" rx="2"/>
      <rect x="344" y="262" width="14" height="22" rx="2"/><rect x="352" y="264" width="14" height="22" rx="2"/>
    </g>
    <text x="376" y="261" font-weight="700">Player 2</text>
    <text x="376" y="275">Spirit panel</text>
    <text x="376" y="289">4 Unique Powers</text>
    <text x="376" y="303">in hand</text>
  </g>
</svg>
