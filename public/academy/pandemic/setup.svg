<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Pandemic setup</title>
  <desc id="d">A four-player Pandemic setup: one research station and every pawn in Atlanta, nine cities starting with 3, 2, or 1 disease cubes, the infection rate marker on the first 2, the outbreaks marker on 0, cure markers beside the cure indicators, the Infection deck with its discard pile of 9 setup cards, the Player deck built in piles with one Epidemic each, the cube supply in four colors, five spare research stations, and each player's role card, reference card, and 2-card hand.</desc>
  <defs>
    <g id="station">
      <path d="M0 6 L6 0 L12 6 L12 13 L0 13 Z" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.2"/>
    </g>
    <g id="cube">
      <rect width="6" height="6" rx="1" stroke="#2B1E16" stroke-width="0.8"/>
    </g>
    <g id="vial">
      <rect x="2" y="0" width="6" height="3" rx="1" fill="#2B1E16"/>
      <rect x="0" y="3" width="10" height="12" rx="3" fill="#2F5D50" stroke="#2B1E16" stroke-width="0.8"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- The board -->
    <rect x="10" y="6" width="460" height="218" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>

    <!-- Infection rate track: 2 2 2 3 3 4 4, marker on the first 2 -->
    <text x="22" y="24" font-weight="700">Infection rate</text>
    <g stroke="#2B1E16" stroke-width="1" fill="#F6EFE3">
      <circle cx="31" cy="40" r="9" fill="#E0A23B"/>
      <circle cx="53" cy="40" r="9"/>
      <circle cx="75" cy="40" r="9"/>
      <circle cx="97" cy="40" r="9"/>
      <circle cx="119" cy="40" r="9"/>
      <circle cx="141" cy="40" r="9"/>
      <circle cx="163" cy="40" r="9"/>
    </g>
    <g font-size="11" text-anchor="middle" font-weight="700">
      <text x="31" y="44">2</text><text x="53" y="44">2</text><text x="75" y="44">2</text><text x="97" y="44">3</text><text x="119" y="44">3</text><text x="141" y="44">4</text><text x="163" y="44">4</text>
    </g>
    <text x="22" y="66" font-size="11">marker on the first 2</text>

    <!-- Cure indicators with cure markers beside them -->
    <text x="196" y="24" font-weight="700">Cures</text>
    <g fill="none" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="3 2">
      <rect x="196" y="31" width="16" height="20" rx="3"/>
      <rect x="216" y="31" width="16" height="20" rx="3"/>
      <rect x="236" y="31" width="16" height="20" rx="3"/>
      <rect x="256" y="31" width="16" height="20" rx="3"/>
    </g>
    <use href="#vial" x="280" y="34"/>
    <use href="#vial" x="292" y="34"/>
    <use href="#vial" x="304" y="34"/>
    <use href="#vial" x="316" y="34"/>
    <text x="196" y="66" font-size="11">4 markers, vial side up</text>

    <!-- Infection deck and discard pile -->
    <rect x="352" y="16" width="30" height="40" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="406" y="20" width="40" height="30" rx="4"/>
      <rect x="410" y="24" width="40" height="30" rx="4"/>
      <rect x="414" y="28" width="40" height="30" rx="4"/>
    </g>
    <g stroke="#B9AD9C" stroke-width="2">
      <line x1="420" y1="36" x2="446" y2="36"/>
      <line x1="420" y1="43" x2="440" y2="43"/>
    </g>
    <text x="367" y="72" font-size="11" text-anchor="middle">Infection</text>
    <text x="367" y="85" font-size="11" text-anchor="middle">deck</text>
    <text x="430" y="72" font-size="11" text-anchor="middle">Discard:</text>
    <text x="430" y="85" font-size="11" text-anchor="middle">9 cards up</text>

    <!-- A simple map of linked cities -->
    <g stroke="#B9AD9C" stroke-width="1.5">
      <line x1="60" y1="118" x2="104" y2="100"/>
      <line x1="60" y1="118" x2="98" y2="142"/>
      <line x1="104" y1="100" x2="98" y2="142"/>
      <line x1="104" y1="100" x2="160" y2="110"/>
      <line x1="98" y1="142" x2="150" y2="150"/>
      <line x1="160" y1="110" x2="220" y2="98"/>
      <line x1="150" y1="150" x2="220" y2="98"/>
      <line x1="220" y1="98" x2="262" y2="128"/>
      <line x1="262" y1="128" x2="318" y2="110"/>
      <line x1="262" y1="128" x2="300" y2="152"/>
      <line x1="318" y1="110" x2="366" y2="122"/>
      <line x1="300" y1="152" x2="366" y2="122"/>
      <line x1="366" y1="122" x2="420" y2="104"/>
      <line x1="366" y1="122" x2="430" y2="146"/>
    </g>
    <g stroke="#2B1E16" stroke-width="1">
      <circle cx="60" cy="118" r="5" fill="#2F5D50"/>
      <circle cx="104" cy="100" r="5" fill="#2F5D50"/>
      <circle cx="98" cy="142" r="5" fill="#2F5D50"/>
      <circle cx="160" cy="110" r="5" fill="#2F5D50"/>
      <circle cx="150" cy="150" r="5" fill="#E0A23B"/>
      <circle cx="220" cy="98" r="5" fill="#2B1E16"/>
      <circle cx="262" cy="128" r="5" fill="#2B1E16"/>
      <circle cx="318" cy="110" r="5" fill="#2B1E16"/>
      <circle cx="300" cy="152" r="5" fill="#B9AD9C"/>
      <circle cx="366" cy="122" r="5" fill="#B9AD9C"/>
      <circle cx="420" cy="104" r="5" fill="#B9AD9C"/>
      <circle cx="430" cy="146" r="5" fill="#B9AD9C"/>
    </g>

    <!-- Atlanta: research station and all four pawns -->
    <use href="#station" x="92" y="149"/>
    <g stroke="#2B1E16" stroke-width="0.8">
      <circle cx="54" cy="156" r="4" fill="#2F5D50"/>
      <circle cx="64" cy="156" r="4" fill="#E0A23B"/>
      <circle cx="74" cy="156" r="4" fill="#2B1E16"/>
      <circle cx="84" cy="156" r="4" fill="#B9AD9C"/>
    </g>
    <text x="22" y="180" font-size="11">Atlanta: 1 station, every pawn</text>

    <!-- Starting cubes on three example cities -->
    <g fill="#2B1E16">
      <use href="#cube" x="211" y="82"/><use href="#cube" x="218" y="82"/><use href="#cube" x="225" y="82"/>
    </g>
    <g fill="#B9AD9C">
      <use href="#cube" x="359" y="106"/><use href="#cube" x="366" y="106"/>
    </g>
    <g fill="#E0A23B">
      <use href="#cube" x="147" y="157"/>
    </g>
    <text x="196" y="178" font-size="11" font-weight="700">9 cities start infected:</text>
    <text x="196" y="192" font-size="11">3 cities with 3 cubes,</text>
    <text x="196" y="206" font-size="11">3 with 2, and 3 with 1</text>

    <!-- Outbreaks track 0 to 8 -->
    <text x="22" y="200" font-weight="700">Outbreaks</text>
    <text x="94" y="200" font-size="11">marker on 0</text>
    <g stroke="#2B1E16" stroke-width="1" fill="#F6EFE3">
      <rect x="22" y="205" width="11" height="11" rx="2" fill="#E0A23B"/>
      <rect x="36" y="205" width="11" height="11" rx="2"/>
      <rect x="50" y="205" width="11" height="11" rx="2"/>
      <rect x="64" y="205" width="11" height="11" rx="2"/>
      <rect x="78" y="205" width="11" height="11" rx="2"/>
      <rect x="92" y="205" width="11" height="11" rx="2"/>
      <rect x="106" y="205" width="11" height="11" rx="2"/>
      <rect x="120" y="205" width="11" height="11" rx="2"/>
      <rect x="134" y="205" width="11" height="11" rx="2" fill="#2B1E16"/>
    </g>
    <text x="27.5" y="214" font-size="9" text-anchor="middle">0</text>
    <text x="139.5" y="214" font-size="9" text-anchor="middle" fill="#F6EFE3">8</text>

    <!-- Player deck and discard pile -->
    <g stroke="#2B1E16" stroke-width="1">
      <rect x="349" y="163" width="26" height="34" rx="4" fill="#B9AD9C"/>
      <rect x="346" y="160" width="26" height="34" rx="4" fill="#B9AD9C"/>
    </g>
    <rect x="420" y="160" width="26" height="34" rx="4" fill="none" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="361" y="209" font-size="11" text-anchor="middle">Player deck,</text>
    <text x="361" y="221" font-size="11" text-anchor="middle">1 Epidemic per pile</text>
    <text x="433" y="209" font-size="11" text-anchor="middle">Player</text>
    <text x="433" y="221" font-size="11" text-anchor="middle">discard</text>

    <!-- Off the board: cube supply and spare stations -->
    <text x="14" y="242" font-weight="700">Cube supply</text>
    <g fill="#2F5D50"><use href="#cube" x="20" y="256"/><use href="#cube" x="27" y="256"/><use href="#cube" x="23.5" y="250"/></g>
    <g fill="#E0A23B"><use href="#cube" x="56" y="256"/><use href="#cube" x="63" y="256"/><use href="#cube" x="59.5" y="250"/></g>
    <g fill="#2B1E16"><use href="#cube" x="92" y="256"/><use href="#cube" x="99" y="256"/><use href="#cube" x="95.5" y="250"/></g>
    <g fill="#B9AD9C"><use href="#cube" x="128" y="256"/><use href="#cube" x="135" y="256"/><use href="#cube" x="131.5" y="250"/></g>
    <g font-size="11" text-anchor="middle">
      <text x="26.5" y="276">blue</text><text x="62.5" y="276">yellow</text><text x="98.5" y="276">black</text><text x="134.5" y="276">red</text>
    </g>
    <use href="#station" x="16" y="286"/><use href="#station" x="31" y="286"/><use href="#station" x="46" y="286"/><use href="#station" x="61" y="286"/><use href="#station" x="76" y="286"/>
    <text x="14" y="315" font-size="11">5 spare research stations</text>

    <!-- Four player seats: role card, reference card, 2-card hand -->
    <text x="160" y="242" font-weight="700">Each player</text>
    <g stroke="#2B1E16" stroke-width="1">
      <rect x="160" y="250" width="20" height="28" rx="3" fill="#2F5D50"/><rect x="184" y="250" width="20" height="28" rx="3" fill="#B9AD9C"/>
      <rect x="208" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/><rect x="216" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/>

      <rect x="238" y="250" width="20" height="28" rx="3" fill="#2F5D50"/><rect x="262" y="250" width="20" height="28" rx="3" fill="#B9AD9C"/>
      <rect x="286" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/><rect x="294" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/>

      <rect x="316" y="250" width="20" height="28" rx="3" fill="#2F5D50"/><rect x="340" y="250" width="20" height="28" rx="3" fill="#B9AD9C"/>
      <rect x="364" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/><rect x="372" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/>

      <rect x="394" y="250" width="20" height="28" rx="3" fill="#2F5D50"/><rect x="418" y="250" width="20" height="28" rx="3" fill="#B9AD9C"/>
      <rect x="442" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/><rect x="450" y="252" width="16" height="24" rx="3" fill="#F6EFE3"/>
    </g>
    <g font-size="11">
      <text x="160" y="291">Player 1</text><text x="238" y="291">Player 2</text><text x="316" y="291">Player 3</text><text x="394" y="291">Player 4</text>
    </g>
    <text x="160" y="304" font-size="11">Role card face up, reference card, 2-card hand</text>
    <text x="160" y="316" font-size="11">(4 players). First game: 4 Epidemics, hands open.</text>
  </g>
</svg>
