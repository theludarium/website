<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">7 Wonders setup</title>
  <desc id="d">A four-player 7 Wonders table. In the middle: the Age I, II, and III decks, a space for the discard pile, the coin reserve, and the Conflict token reserve. Each player has a Wonder board, Day side up, with a starting resource and 3 coins on it. The players to your left and right are your neighbors; the player across is not. Ages I and III pass to the left, Age II to the right.</desc>
  <defs>
    <g id="coin">
      <circle r="5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    </g>
    <g id="deck">
      <rect x="4" y="4" width="32" height="44" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="2" y="2" width="32" height="44" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="32" height="44" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.2"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Title -->
    <text x="16" y="24" font-size="13" font-weight="700">7 Wonders setup</text>
    <text x="16" y="40">4 players shown</text>

    <!-- Middle of the table -->
    <rect x="96" y="88" width="288" height="138" rx="14" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="108" y="104" fill="#2F5D50" font-weight="700">Middle of the table</text>

    <!-- Age decks -->
    <use href="#deck" x="112" y="112"/>
    <use href="#deck" x="156" y="112"/>
    <use href="#deck" x="200" y="112"/>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="128" y="139">I</text>
      <text x="172" y="139">II</text>
      <text x="216" y="139">III</text>
    </g>
    <text x="112" y="176">Age decks, sorted</text>
    <text x="112" y="190">for player count</text>
    <text x="112" y="206" fill="#2F5D50">Age III: add guilds,</text>
    <text x="112" y="220" fill="#2F5D50">players + 2</text>

    <!-- Discard -->
    <rect x="256" y="112" width="34" height="46" rx="4" fill="none" stroke="#2B1E16" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="273" y="176" text-anchor="middle">Discard</text>

    <!-- Coin reserve -->
    <use href="#coin" x="316" y="122"/>
    <use href="#coin" x="330" y="118"/>
    <use href="#coin" x="344" y="124"/>
    <use href="#coin" x="324" y="136"/>
    <use href="#coin" x="338" y="140"/>
    <circle cx="358" cy="136" r="7" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <circle cx="352" cy="150" r="7" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
    <text x="340" y="176" text-anchor="middle">Coin reserve</text>

    <!-- Conflict token reserve -->
    <rect x="300" y="186" width="13" height="13" rx="3" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <rect x="317" y="186" width="13" height="13" rx="3" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <rect x="334" y="186" width="13" height="13" rx="3" fill="#2B1E16"/>
    <rect x="351" y="186" width="13" height="13" rx="3" fill="#2B1E16"/>
    <text x="336" y="216" text-anchor="middle">Conflict tokens</text>

    <!-- Top player: across, not a neighbor -->
    <rect x="164" y="36" width="152" height="44" rx="8" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="171" y="43" width="12" height="12" rx="2" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <g fill="#F6EFE3" text-anchor="middle">
      <text x="230" y="56" font-weight="700">Wonder board</text>
      <text x="230" y="72">Day side up</text>
    </g>
    <use href="#coin" x="292" y="51"/>
    <use href="#coin" x="304" y="51"/>
    <use href="#coin" x="298" y="66"/>
    <text x="156" y="56" text-anchor="end">Across from you:</text>
    <text x="156" y="70" text-anchor="end">not a neighbor</text>

    <!-- Left neighbor -->
    <rect x="16" y="100" width="56" height="120" rx="8" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="38" y="106" width="12" height="12" rx="2" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <text x="0" y="0" transform="translate(48 160) rotate(-90)" text-anchor="middle" fill="#F6EFE3" font-weight="700">Wonder board</text>
    <use href="#coin" x="30" y="208"/>
    <use href="#coin" x="44" y="208"/>
    <use href="#coin" x="58" y="208"/>
    <text x="44" y="240" text-anchor="middle" font-weight="700">Your left</text>
    <text x="44" y="254" text-anchor="middle" font-weight="700">neighbor</text>

    <!-- Right neighbor -->
    <rect x="408" y="100" width="56" height="120" rx="8" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="430" y="106" width="12" height="12" rx="2" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <text x="0" y="0" transform="translate(432 160) rotate(90)" text-anchor="middle" fill="#F6EFE3" font-weight="700">Wonder board</text>
    <use href="#coin" x="422" y="208"/>
    <use href="#coin" x="436" y="208"/>
    <use href="#coin" x="450" y="208"/>
    <text x="436" y="240" text-anchor="middle" font-weight="700">Your right</text>
    <text x="436" y="254" text-anchor="middle" font-weight="700">neighbor</text>

    <!-- You -->
    <rect x="164" y="236" width="152" height="44" rx="8" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
    <rect x="171" y="243" width="12" height="12" rx="2" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <g fill="#F6EFE3" text-anchor="middle">
      <text x="230" y="256" font-weight="700">Wonder board</text>
      <text x="230" y="272">Day side up</text>
    </g>
    <use href="#coin" x="292" y="251"/>
    <use href="#coin" x="304" y="251"/>
    <use href="#coin" x="298" y="266"/>
    <text x="240" y="298" text-anchor="middle" font-weight="700">You</text>

    <!-- Callouts for your board -->
    <path d="M170 249 L150 249" stroke="#2B1E16" stroke-width="1"/>
    <text x="146" y="246" text-anchor="end">starting</text>
    <text x="146" y="260" text-anchor="end">resource</text>
    <path d="M310 258 L324 258" stroke="#2B1E16" stroke-width="1"/>
    <text x="328" y="254">3 coins on</text>
    <text x="328" y="268">every board</text>

    <!-- Passing directions -->
    <text x="16" y="284" font-weight="700" fill="#2F5D50">Passing</text>
    <text x="16" y="299">Ages I and III: to your left</text>
    <text x="16" y="314">Age II: to your right</text>
  </g>
</svg>
