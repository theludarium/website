  <title id="t">Azul setup for two players</title>
  <desc id="d">Five factory displays with 4 tiles each in a circle around the empty center of the table. Two player boards, each with the score marker on 0, five empty pattern lines holding 1 to 5 tiles, the colored wall, and the floor line marked -1, -1, -2, -2, -2, -3, -3. Below: the starting player marker, the bag with all 100 tiles in five colors, and the box lid for discarded tiles.</desc>
