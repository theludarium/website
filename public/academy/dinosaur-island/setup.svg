<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Dinosaur Island setup</title>
  <desc id="d">The shared boards in the middle of the table: the research center with the rolled DNA dice (2 per player plus 1), three face-up dino recipes that need a level 1, 2, or 3 scientist, and the cold storage slots; the marketplace with four rows priced $2 to $5, each holding an attraction, a lab upgrade, and a specialist; the track board with excitement at 1 and score at 10; objective cards equal to players plus one; 2 plot twists; and the supply with the bank, dinosaurs, and the visitor bag. Below, one player's area: the lab board with cold storage limits at 4 for basic DNA and 2 for advanced DNA, 1 of each basic DNA and none of the advanced, threat and security at 1, 3 scientists and 4 workers; an empty spot for specialists; and the park board with 1 dinosaur in the starting exhibit.</desc>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Research center -->
    <rect x="16" y="8" width="160" height="144" rx="12" fill="#B9AD9C" fill-opacity="0.18" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="26" y="26" font-size="13" font-weight="700">Research center</text>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="26" y="34" width="18" height="18" rx="3"/>
      <rect x="50" y="34" width="18" height="18" rx="3"/>
      <rect x="74" y="34" width="18" height="18" rx="3"/>
      <rect x="98" y="34" width="18" height="18" rx="3"/>
      <rect x="122" y="34" width="18" height="18" rx="3"/>
    </g>
    <g fill="#2F5D50">
      <circle cx="35" cy="43" r="2.5"/>
      <circle cx="56" cy="40" r="2.5"/><circle cx="62" cy="46" r="2.5"/>
      <circle cx="83" cy="43" r="2.5"/>
      <circle cx="104" cy="40" r="2.5"/><circle cx="110" cy="46" r="2.5"/>
      <circle cx="131" cy="43" r="2.5"/>
    </g>
    <text x="26" y="67">DNA dice: 2 per player + 1</text>

    <g fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2">
      <rect x="26" y="75" width="44" height="32" rx="4"/>
      <rect x="76" y="75" width="44" height="32" rx="4"/>
      <rect x="126" y="75" width="44" height="32" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="48" y="88">Herb.</text>
      <text x="98" y="88">Small</text>
      <text x="148" y="88">Large</text>
      <text x="48" y="102" font-weight="700">1</text>
      <text x="98" y="102" font-weight="700">2</text>
      <text x="148" y="102" font-weight="700">3</text>
    </g>
    <text x="26" y="121">Recipes, minimum level</text>

    <g fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1.2">
      <circle cx="30" cy="136" r="4"/>
      <circle cx="41" cy="136" r="4"/>
      <circle cx="52" cy="136" r="4"/>
      <circle cx="63" cy="136" r="4"/>
      <circle cx="74" cy="136" r="4"/>
      <circle cx="85" cy="136" r="4"/>
    </g>
    <text x="95" y="140">Cold storage</text>

    <!-- Marketplace -->
    <rect x="184" y="8" width="160" height="144" rx="12" fill="#B9AD9C" fill-opacity="0.18" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="194" y="26" font-size="13" font-weight="700">Marketplace</text>
    <g text-anchor="middle">
      <text x="246" y="42">Attr.</text>
      <text x="282" y="42">Lab</text>
      <text x="318" y="42">Spec.</text>
    </g>
    <g font-weight="700">
      <text x="194" y="61">$2</text>
      <text x="194" y="83">$3</text>
      <text x="194" y="105">$4</text>
      <text x="194" y="127">$5</text>
    </g>
    <g fill="#F6EFE3" stroke="#2B1E16" stroke-width="1">
      <rect x="230" y="48" width="32" height="18" rx="3" fill="#E0A23B" fill-opacity="0.35"/>
      <rect x="266" y="48" width="32" height="18" rx="3"/>
      <rect x="302" y="48" width="32" height="18" rx="3" fill="#2F5D50" fill-opacity="0.25"/>
      <rect x="230" y="70" width="32" height="18" rx="3" fill="#E0A23B" fill-opacity="0.35"/>
      <rect x="266" y="70" width="32" height="18" rx="3"/>
      <rect x="302" y="70" width="32" height="18" rx="3" fill="#2F5D50" fill-opacity="0.25"/>
      <rect x="230" y="92" width="32" height="18" rx="3" fill="#E0A23B" fill-opacity="0.35"/>
      <rect x="266" y="92" width="32" height="18" rx="3"/>
      <rect x="302" y="92" width="32" height="18" rx="3" fill="#2F5D50" fill-opacity="0.25"/>
      <rect x="230" y="114" width="32" height="18" rx="3" fill="#E0A23B" fill-opacity="0.35"/>
      <rect x="266" y="114" width="32" height="18" rx="3"/>
      <rect x="302" y="114" width="32" height="18" rx="3" fill="#2F5D50" fill-opacity="0.25"/>
    </g>
    <text x="194" y="146">One item per slot</text>

    <!-- Track board, objectives, plot twists -->
    <rect x="352" y="8" width="112" height="56" rx="10" fill="#B9AD9C" fill-opacity="0.18" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="362" y="25" font-size="13" font-weight="700">Track board</text>
    <text x="362" y="41">Excitement: 1</text>
    <text x="362" y="56">Score: 10</text>

    <g fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2">
      <rect x="352" y="72" width="16" height="22" rx="2"/>
      <rect x="371" y="72" width="16" height="22" rx="2"/>
      <rect x="390" y="72" width="16" height="22" rx="2"/>
    </g>
    <text x="412" y="82" font-weight="700">Objectives</text>
    <text x="412" y="95">players + 1</text>

    <g fill="#E0A23B" fill-opacity="0.5" stroke="#2B1E16" stroke-width="1">
      <rect x="352" y="110" width="22" height="30" rx="3"/>
      <rect x="378" y="110" width="22" height="30" rx="3"/>
    </g>
    <text x="406" y="122" font-weight="700">Plot</text>
    <text x="406" y="136" font-weight="700">twists: 2</text>

    <!-- Your lab -->
    <rect x="16" y="160" width="196" height="138" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="26" y="178" font-size="13" font-weight="700">Your lab</text>
    <text x="148" y="178" text-anchor="end">Scientists</text>
    <g stroke="#2B1E16" stroke-width="1">
      <circle cx="160" cy="174" r="7" fill="#2F5D50"/>
      <circle cx="178" cy="174" r="7" fill="#2F5D50"/>
      <circle cx="196" cy="174" r="7" fill="#2F5D50"/>
    </g>
    <g text-anchor="middle" fill="#F6EFE3" font-weight="700">
      <text x="160" y="178">1</text>
      <text x="178" y="178">2</text>
      <text x="196" y="178">3</text>
    </g>

    <!-- Cold storage chart: 3 basic tracks, 3 advanced tracks -->
    <g stroke="#2B1E16" stroke-width="1">
      <rect x="26" y="190" width="14" height="60" rx="2" fill="#B9AD9C" fill-opacity="0.35"/>
      <rect x="44" y="190" width="14" height="60" rx="2" fill="#B9AD9C" fill-opacity="0.35"/>
      <rect x="62" y="190" width="14" height="60" rx="2" fill="#B9AD9C" fill-opacity="0.35"/>
      <rect x="84" y="190" width="14" height="60" rx="2" fill="#E0A23B" fill-opacity="0.3"/>
      <rect x="102" y="190" width="14" height="60" rx="2" fill="#E0A23B" fill-opacity="0.3"/>
      <rect x="120" y="190" width="14" height="60" rx="2" fill="#E0A23B" fill-opacity="0.3"/>
    </g>
    <!-- Limit cubes: 4 on basic, 2 on advanced -->
    <g fill="#2B1E16">
      <rect x="26" y="218" width="14" height="3"/>
      <rect x="44" y="218" width="14" height="3"/>
      <rect x="62" y="218" width="14" height="3"/>
      <rect x="84" y="232" width="14" height="3"/>
      <rect x="102" y="232" width="14" height="3"/>
      <rect x="120" y="232" width="14" height="3"/>
    </g>
    <!-- Markers: 1 on basic, 0 on advanced -->
    <g fill="#2F5D50">
      <circle cx="33" cy="243" r="3.5"/>
      <circle cx="51" cy="243" r="3.5"/>
      <circle cx="69" cy="243" r="3.5"/>
      <circle cx="91" cy="250" r="3.5"/>
      <circle cx="109" cy="250" r="3.5"/>
      <circle cx="127" cy="250" r="3.5"/>
    </g>
    <text x="26" y="270">Basic: limit 4, have 1</text>
    <text x="26" y="286">Advanced: limit 2, have 0</text>

    <text x="146" y="204">Threat: 1</text>
    <text x="146" y="220">Security: 1</text>
    <g fill="#2F5D50" stroke="#2B1E16" stroke-width="0.8">
      <rect x="148" y="230" width="10" height="14" rx="3"/>
      <rect x="162" y="230" width="10" height="14" rx="3"/>
      <rect x="176" y="230" width="10" height="14" rx="3"/>
      <rect x="190" y="230" width="10" height="14" rx="3"/>
    </g>
    <text x="146" y="258">4 workers</text>

    <!-- Specialists -->
    <rect x="230" y="190" width="34" height="48" rx="4" fill="none" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="247" y="256" text-anchor="middle">Specialists</text>
    <text x="247" y="270" text-anchor="middle">up to 3</text>

    <!-- Your park -->
    <rect x="282" y="160" width="110" height="138" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="292" y="178" font-size="13" font-weight="700">Your park</text>
    <rect x="292" y="188" width="42" height="40" rx="4" fill="#2F5D50" fill-opacity="0.2" stroke="#2F5D50" stroke-width="1.2"/>
    <rect x="342" y="188" width="42" height="40" rx="4" fill="#2F5D50" fill-opacity="0.2" stroke="#2F5D50" stroke-width="1.2"/>
    <text x="313" y="212" text-anchor="middle">Exhibit</text>
    <ellipse cx="361" cy="212" rx="10" ry="6" fill="#2F5D50"/>
    <circle cx="372" cy="204" r="4" fill="#2F5D50"/>
    <g fill="none" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="4 3">
      <rect x="292" y="234" width="42" height="26" rx="4"/>
      <rect x="342" y="234" width="42" height="26" rx="4"/>
    </g>
    <text x="292" y="276">Start: 1 dinosaur</text>
    <text x="292" y="290">Empty zones</text>

    <!-- Supply -->
    <rect x="398" y="160" width="74" height="138" rx="12" fill="#B9AD9C" fill-opacity="0.18" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="406" y="178" font-size="13" font-weight="700">Supply</text>
    <path d="M420 196 q15 -8 30 0 l4 30 q-19 8 -38 0 z" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <text x="406" y="244">Visitor bag</text>
    <text x="406" y="260">Bank</text>
    <text x="406" y="276">Dinosaurs</text>
    <text x="406" y="292">Paddocks</text>

    <text x="240" y="314" text-anchor="middle" fill="#2F5D50">Startup cash: $15 to the first player, $1 more for each player after.</text>
  </g>
</svg>
