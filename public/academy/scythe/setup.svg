<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Scythe setup for five players, in the abstract</title>
  <desc id="d">A simplified hex map with the Factory in the center and five home bases around the edge in seating order: Nordic at the top, Rusviet at the right, Crimea at the lower right, Saxony at the bottom, and Polania at the left. Each home base holds a character, with one worker on each of the two land territories next to it. Encounter tokens dot the map. A side panel lists the decks, the structure bonus tile, the tracks, and one player's mats.</desc>
