    <text x="340" y="70">5 resource stacks</text>
    <g stroke="#2B1E16" stroke-width="0.8">
      <rect x="340" y="78" width="18" height="24" rx="2.5" fill="#F6EFE3"/>
      <path d="M344 86 h10 M344 90 h10 M344 94 h10" stroke-width="1"/>
