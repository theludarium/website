<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Cities &amp; Knights setup</title>
  <desc id="d">Cities and Knights setup: the Catan board in the sea frame that carries the barbarian track, the barbarian ship on the track's starting space and the robber waiting beside its last space. Next to the board sit the event die and the two production dice, the 3 metropolis pieces, the merchant, and the Longest Route tile. The supply holds 5 resource stacks, 3 commodity stacks, 3 face-down progress card decks, and the VP tokens. Each player has a city improvement board with a cube at the bottom of all three tracks, 6 knights, 3 city walls, and a player aid, and starts with 1 settlement, 1 city, and 2 roads.</desc>
