<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-labelledby="t d">
  <title id="t">An invented Magic-style card with every part labeled</title>
  <desc id="d">A made-up white creature card named Lamplight Host, not a real card. Labels point out the name, the mana cost of two generic and one white, the illustration, the type line reading Creature, Human Citizen, the set symbol, the text box with rules text, reminder text and flavor text, power and toughness of 2/3, and the collector information at the bottom.</desc>
  <rect width="300" height="420" fill="#F6EFE3"/>

  <!-- Card frame: dark border, light inner panel -->
  <rect x="6" y="6" width="288" height="408" rx="16" fill="#2B1E16"/>
  <rect x="16" y="16" width="268" height="366" rx="10" fill="#B9AD9C"/>

  <g font-family="system-ui, sans-serif" fill="#2B1E16">
    <!-- Top labels -->
    <g font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">
      <rect x="24" y="20" width="40" height="12" rx="6" fill="#E0A23B"/><text x="44" y="29">NAME</text>
      <rect x="216" y="20" width="62" height="12" rx="6" fill="#E0A23B"/><text x="247" y="29">MANA COST</text>
    </g>

    <!-- Name bar and mana cost -->
    <rect x="22" y="35" width="256" height="24" rx="12" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.2"/>
    <text x="32" y="52" font-size="14.5" font-weight="700">Lamplight Host</text>
    <circle cx="246" cy="47" r="8" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <text x="246" y="51" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <circle cx="265" cy="47" r="8" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <text x="265" y="51" font-size="10" font-weight="700" text-anchor="middle">W</text>

    <!-- Illustration: original art, a round table under a lamp -->
    <rect x="28" y="64" width="244" height="132" rx="4" fill="#2F5D50"/>
    <circle cx="150" cy="104" r="34" fill="#E0A23B" opacity="0.35"/>
    <circle cx="150" cy="104" r="14" fill="#E0A23B"/>
    <line x1="150" y1="64" x2="150" y2="90" stroke="#F6EFE3" stroke-width="1.5"/>
    <g fill="#B9AD9C" stroke="#2B1E16" stroke-width="1">
      <rect x="143" y="126" width="14" height="10" rx="3"/>
      <rect x="143" y="180" width="14" height="10" rx="3"/>
      <rect x="110" y="140" width="12" height="12" rx="3"/>
      <rect x="178" y="140" width="12" height="12" rx="3"/>
      <rect x="110" y="164" width="12" height="12" rx="3"/>
      <rect x="178" y="164" width="12" height="12" rx="3"/>
    </g>
    <ellipse cx="150" cy="158" rx="25" ry="19" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <rect x="34" y="70" width="74" height="12" rx="6" fill="#E0A23B"/>
    <text x="71" y="79" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">ILLUSTRATION</text>

    <!-- Type line, with a drawn dash, and the set symbol -->
    <rect x="22" y="201" width="256" height="23" rx="11.5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.2"/>
    <text x="32" y="217" font-size="12.5" font-weight="700">Creature</text>
    <line x1="92" y1="212.5" x2="104" y2="212.5" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="109" y="217" font-size="12.5" font-weight="700">Human Citizen</text>
    <path d="M258 212.5 L262 205.6 L270 205.6 L274 212.5 L270 219.4 L262 219.4 Z" fill="#2B1E16"/>
    <g font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">
      <rect x="24" y="227" width="58" height="12" rx="6" fill="#E0A23B"/><text x="53" y="236">TYPE LINE</text>
      <rect x="214" y="227" width="64" height="12" rx="6" fill="#E0A23B"/><text x="246" y="236">SET SYMBOL</text>
    </g>

    <!-- Text box -->
    <rect x="28" y="243" width="244" height="133" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
    <rect x="34" y="248" width="52" height="12" rx="6" fill="#E0A23B"/>
    <text x="60" y="257" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">TEXT BOX</text>
    <text x="36" y="276" font-size="11.5" font-weight="700">Vigilance</text>
    <text x="36" y="290" font-size="9.5" font-style="italic">(Attacking doesn't cause this creature to tap.)</text>
    <text x="36" y="307" font-size="11">When this creature enters, each player</text>
    <text x="36" y="321" font-size="11">may draw a card.</text>
    <line x1="36" y1="330" x2="264" y2="330" stroke="#B9AD9C" stroke-width="1"/>
    <g font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">
      <rect x="34" y="335" width="66" height="12" rx="6" fill="#E0A23B"/><text x="67" y="344">FLAVOR TEXT</text>
      <rect x="170" y="335" width="98" height="12" rx="6" fill="#E0A23B"/><text x="219" y="344">POWER/TOUGHNESS</text>
    </g>
    <text x="36" y="359" font-size="9.5" font-style="italic">The game is the reason.</text>
    <text x="36" y="371" font-size="9.5" font-style="italic">The people are the point.</text>

    <!-- Power and toughness -->
    <rect x="216" y="352" width="56" height="26" rx="7" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="244" y="370" font-size="15" font-weight="700" text-anchor="middle">2/3</text>

    <!-- Collector information, on the border -->
    <rect x="22" y="386" width="80" height="12" rx="6" fill="#E0A23B"/>
    <text x="62" y="395" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">COLLECTOR INFO</text>
    <text x="22" y="408" font-size="8.5" fill="#F6EFE3">001/360 C · LDR • EN</text>
    <text x="278" y="395" font-size="8.5" fill="#F6EFE3" text-anchor="end">Illus. The Ludarium</text>
    <text x="278" y="408" font-size="8.5" fill="#E0A23B" text-anchor="end">Made-up card. Not a real Magic card.</text>
  </g>
</svg>
