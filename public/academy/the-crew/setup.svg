<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">The Crew setup</title>
  <desc id="d">The start of a four-player mission: each player's hand of ten cards with a green radio token in front, the commander token by the player holding the 4 rocket, task cards face up in the middle with a task token, the face-down task deck, the distress signal token, and a key to the 40-card deck of four colors from 1 to 9 plus rockets 1 to 4.</desc>
  <defs>
    <rect id="hand" width="9" height="14" rx="1.5" fill="#2F5D50" stroke="#F6EFE3" stroke-width="0.8"/>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Deck key -->
    <rect x="16" y="8" width="448" height="62" rx="10" fill="none" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="28" y="27" font-size="13" font-weight="700">The deck: 40 large cards, all dealt out</text>
    <rect x="28" y="38" width="12" height="17" rx="2" fill="#C98B8F" stroke="#2B1E16"/>
    <rect x="43" y="38" width="12" height="17" rx="2" fill="#6F8FA8" stroke="#2B1E16"/>
    <rect x="58" y="38" width="12" height="17" rx="2" fill="#2F5D50" stroke="#2B1E16"/>
    <rect x="73" y="38" width="12" height="17" rx="2" fill="#E0A23B" stroke="#2B1E16"/>
    <text x="92" y="51">Pink, blue, green, yellow, 1 to 9 each</text>
    <rect x="330" y="38" width="12" height="17" rx="2" fill="#2B1E16"/>
    <path d="M336 41 L339 48 L336 46 L333 48 Z" fill="#F6EFE3"/>
    <text x="348" y="51">Rockets 1 to 4</text>

    <!-- Table -->
    <rect x="96" y="82" width="288" height="226" rx="16" fill="none" stroke="#B9AD9C" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Top player -->
    <g transform="translate(195 90)">
      <use href="#hand" x="0"/><use href="#hand" x="9"/><use href="#hand" x="18"/><use href="#hand" x="27"/><use href="#hand" x="36"/><use href="#hand" x="45"/><use href="#hand" x="54"/><use href="#hand" x="63"/><use href="#hand" x="72"/><use href="#hand" x="81"/>
    </g>
    <circle cx="300" cy="97" r="7" fill="#2F5D50" stroke="#2B1E16"/>
    <text x="240" y="122" text-anchor="middle" font-size="11">Hand of 10</text>

    <!-- Left player -->
    <g transform="translate(16 140)">
      <use href="#hand" x="0"/><use href="#hand" x="9"/><use href="#hand" x="18"/><use href="#hand" x="27"/><use href="#hand" x="36"/><use href="#hand" x="45"/><use href="#hand" x="54"/><use href="#hand" x="63"/><use href="#hand" x="72"/><use href="#hand" x="81"/>
    </g>
    <text x="16" y="170" font-size="11">Hand of 10</text>
    <circle cx="23" cy="186" r="7" fill="#2F5D50" stroke="#2B1E16"/>

    <!-- Right player -->
    <g transform="translate(374 140)">
      <use href="#hand" x="0"/><use href="#hand" x="9"/><use href="#hand" x="18"/><use href="#hand" x="27"/><use href="#hand" x="36"/><use href="#hand" x="45"/><use href="#hand" x="54"/><use href="#hand" x="63"/><use href="#hand" x="72"/><use href="#hand" x="81"/>
    </g>
    <text x="464" y="170" text-anchor="end" font-size="11">Hand of 10</text>
    <circle cx="457" cy="186" r="7" fill="#2F5D50" stroke="#2B1E16"/>

    <!-- Bottom player: commander -->
    <g transform="translate(195 286)">
      <use href="#hand" x="0"/><use href="#hand" x="9"/><use href="#hand" x="18"/><use href="#hand" x="27"/><use href="#hand" x="36"/><use href="#hand" x="45"/><use href="#hand" x="54"/><use href="#hand" x="63"/><use href="#hand" x="72"/><use href="#hand" x="81"/>
    </g>
    <circle cx="300" cy="293" r="7" fill="#2F5D50" stroke="#2B1E16"/>
    <rect x="150" y="284" width="34" height="18" rx="9" fill="#E0A23B" stroke="#2B1E16"/>
    <text x="167" y="297" text-anchor="middle" font-size="11" font-weight="700">C</text>
    <text x="240" y="279" text-anchor="middle" font-size="11">Commander: holds the 4 rocket</text>

    <!-- Center: task cards -->
    <text x="240" y="146" text-anchor="middle" font-size="12" font-weight="700">Task cards, face up</text>
    <g>
      <rect x="196" y="176" width="22" height="30" rx="3" fill="#F6EFE3" stroke="#6F8FA8" stroke-width="3"/>
      <text x="207" y="196" text-anchor="middle" font-weight="700">6</text>
      <rect x="229" y="176" width="22" height="30" rx="3" fill="#F6EFE3" stroke="#2F5D50" stroke-width="3"/>
      <text x="240" y="196" text-anchor="middle" font-weight="700">3</text>
      <rect x="262" y="176" width="22" height="30" rx="3" fill="#F6EFE3" stroke="#C98B8F" stroke-width="3"/>
      <text x="273" y="196" text-anchor="middle" font-weight="700">1</text>
      <circle cx="207" cy="163" r="8" fill="#F6EFE3" stroke="#2B1E16"/>
      <text x="207" y="167" text-anchor="middle" font-size="10" font-weight="700">1</text>
    </g>
    <text x="240" y="222" text-anchor="middle" font-size="11">Task token on a task:</text><text x="240" y="235" text-anchor="middle" font-size="11">it sets an order</text>

    <!-- Task deck -->
    <rect x="122" y="178" width="24" height="32" rx="3" fill="#2B1E16" opacity=".35"/>
    <rect x="119" y="175" width="24" height="32" rx="3" fill="#2B1E16"/>
    <text x="131" y="224" text-anchor="middle" font-size="11">Task deck</text>

    <!-- Distress token -->
    <circle cx="349" cy="191" r="13" fill="#B9AD9C" stroke="#2B1E16"/>
    <text x="349" y="195" text-anchor="middle" font-size="10" font-weight="700">SOS</text>
    <text x="349" y="224" text-anchor="middle" font-size="11">Distress signal</text>
    <text x="349" y="237" text-anchor="middle" font-size="11">face down</text>

    <!-- Radio token key -->
    <circle cx="160" cy="254" r="7" fill="#2F5D50" stroke="#2B1E16"/>
    <text x="172" y="259" font-size="11">Radio token, green side up: one signal each</text>
  </g>
</svg>
