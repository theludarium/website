<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Carcassonne setup</title>
  <desc id="d">The start tile in the middle of the table, four face-down stacks of land tiles around it, the scoreboard with every score meeple on 0, and each player's supply of 7 meeples.</desc>
  <defs>
    <g id="m">
      <circle cx="5" cy="2.6" r="2.4"/>
      <path d="M1 13 L3 7.5 L0 6.8 L0.8 5 L9.2 5 L10 6.8 L7 7.5 L9 13 L5.8 13 L5 10.5 L4.2 13 Z"/>
    </g>
    <g id="stack">
      <rect x="6" y="6" width="34" height="34" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="3" y="3" width="34" height="34" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="0" width="34" height="34" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Scoreboard track -->
    <rect x="16" y="8" width="448" height="66" rx="10" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <text x="28" y="27" font-size="13" font-weight="700">Scoreboard</text>
    <text x="112" y="27">every player's 8th meeple starts on 0</text>
    <g fill="#F6EFE3" stroke="#B9AD9C" stroke-width="1">
      <rect x="28" y="34" width="22" height="22" rx="3" fill="#F6EFE3" stroke="#2B1E16"/>
      <rect x="52" y="34" width="22" height="22" rx="3"/>
      <rect x="76" y="34" width="22" height="22" rx="3"/>
      <rect x="100" y="34" width="22" height="22" rx="3"/>
      <rect x="124" y="34" width="22" height="22" rx="3"/>
      <rect x="148" y="34" width="22" height="22" rx="3"/>
      <rect x="172" y="34" width="22" height="22" rx="3"/>
      <rect x="196" y="34" width="22" height="22" rx="3"/>
      <rect x="220" y="34" width="22" height="22" rx="3"/>
      <rect x="244" y="34" width="22" height="22" rx="3"/>
      <rect x="268" y="34" width="22" height="22" rx="3"/>
      <rect x="292" y="34" width="22" height="22" rx="3"/>
      <rect x="316" y="34" width="22" height="22" rx="3"/>
      <rect x="340" y="34" width="22" height="22" rx="3"/>
      <rect x="364" y="34" width="22" height="22" rx="3"/>
      <rect x="388" y="34" width="22" height="22" rx="3"/>
      <rect x="412" y="34" width="22" height="22" rx="3"/>
      <rect x="436" y="34" width="22" height="22" rx="3"/>
    </g>
        <g font-size="10" text-anchor="middle">
      <text x="39" y="68" font-weight="700">0</text><text x="63" y="68">1</text><text x="87" y="68">2</text><text x="111" y="68">3</text><text x="135" y="68">4</text><text x="159" y="68">5</text><text x="183" y="68">6</text>
    </g>
    <text x="447" y="50" font-size="11" text-anchor="middle">…</text>

    <!-- Score meeples, one per player, all on the 0 space -->
    <g transform="translate(29.5 35) scale(0.6)" fill="#2F5D50"><use href="#m"/></g>
    <g transform="translate(39.5 35) scale(0.6)" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"><use href="#m"/></g>
    <g transform="translate(29.5 46) scale(0.6)" fill="#2B1E16"><use href="#m"/></g>
    <g transform="translate(39.5 46) scale(0.6)" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.8"><use href="#m"/></g>

    <!-- Center: start tile and the stacks -->
    <rect x="96" y="82" width="288" height="166" rx="14" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="108" y="96" fill="#2F5D50" font-weight="700">Play area</text>

    <!-- Start tile: field with a road across and a city cap on top -->
    <g transform="translate(210 132)">
      <rect width="60" height="60" rx="5" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.5"/>
      <path d="M2 2 L58 2 Q30 24 2 2 Z" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <rect x="0" y="33" width="60" height="6" fill="#F6EFE3"/>
    </g>
    <text x="240" y="208" text-anchor="middle" font-weight="700">Start tile</text>
    <text x="240" y="222" text-anchor="middle" font-size="11">(dark back), face up</text>

    <!-- Four face-down stacks -->
    <use href="#stack" x="126" y="112"/>
    <use href="#stack" x="314" y="112"/>
    <use href="#stack" x="126" y="180"/>
    <use href="#stack" x="314" y="180"/>
    <text x="146" y="166" text-anchor="middle" font-size="11">Face-down</text>
    <text x="334" y="166" text-anchor="middle" font-size="11">land tile stacks</text>

    <!-- Player supplies: 7 meeples each -->
    <g fill="#2F5D50">
      <use href="#m" x="20" y="146"/><use href="#m" x="32" y="146"/><use href="#m" x="44" y="146"/><use href="#m" x="56" y="146"/>
      <use href="#m" x="26" y="162"/><use href="#m" x="38" y="162"/><use href="#m" x="50" y="162"/>
    </g>
    <text x="16" y="194">Player 1</text>
    <text x="16" y="208" font-size="11">supply: 7</text>

    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.6">
      <use href="#m" x="404" y="146"/><use href="#m" x="416" y="146"/><use href="#m" x="428" y="146"/><use href="#m" x="440" y="146"/>
      <use href="#m" x="410" y="162"/><use href="#m" x="422" y="162"/><use href="#m" x="434" y="162"/>
    </g>
    <text x="400" y="194">Player 2</text>
    <text x="400" y="208" font-size="11">supply: 7</text>

    <g fill="#2B1E16">
      <use href="#m" x="110" y="262"/><use href="#m" x="122" y="262"/><use href="#m" x="134" y="262"/><use href="#m" x="146" y="262"/>
      <use href="#m" x="158" y="262"/><use href="#m" x="170" y="262"/><use href="#m" x="182" y="262"/>
    </g>
    <text x="110" y="294">Player 3 supply: 7 meeples</text>

    <g fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6">
      <use href="#m" x="296" y="262"/><use href="#m" x="308" y="262"/><use href="#m" x="320" y="262"/><use href="#m" x="332" y="262"/>
      <use href="#m" x="344" y="262"/><use href="#m" x="356" y="262"/><use href="#m" x="368" y="262"/>
    </g>
    <text x="296" y="294">Player 4 supply: 7 meeples</text>

    <text x="240" y="312" text-anchor="middle" font-size="11" fill="#2F5D50">First game: river tiles and abbots stay in the box</text>
  </g>
</svg>
