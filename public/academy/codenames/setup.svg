<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Codenames setup</title>
  <desc id="d">A 5 by 5 grid of 25 word cards in the middle of the table. Both spymasters sit on one side with the key card in its stand between them: the red spymaster with 8 agent tiles plus the double agent, the blue spymaster with 8 agent tiles, and the 7 bystanders and the assassin in the middle. The red and blue operatives sit across the table.</desc>
  <defs>
    <g id="card"><rect width="46" height="18" rx="3" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/><rect x="9" y="7.5" width="28" height="3" rx="1.5" fill="#B9AD9C"/></g>
    <rect id="red" width="12" height="12" rx="2" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8"/>
    <rect id="blue" width="12" height="12" rx="2" fill="#2F5D50" stroke="#2B1E16" stroke-width="0.8"/>
    <g id="person"><circle cx="0" cy="0" r="5.5"/><rect x="-9" y="7" width="18" height="12" rx="6"/></g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Red spymaster: 8 red agent tiles plus the double agent (red starts in this example) -->
    <text x="20" y="24" font-size="13" font-weight="700">Red spymaster</text>
    <use href="#red" x="20" y="34"/>
    <use href="#red" x="36" y="34"/>
    <use href="#red" x="52" y="34"/>
    <use href="#red" x="68" y="34"/>
    <use href="#red" x="20" y="50"/>
    <use href="#red" x="36" y="50"/>
    <use href="#red" x="52" y="50"/>
    <use href="#red" x="68" y="50"/>
    <g transform="translate(88 41)">
      <path d="M0 2 Q0 0 2 0 L14 0 L0 14 Z" fill="#E0A23B"/>
      <path d="M14 0 L14 12 Q14 14 12 14 L0 14 Z" fill="#2F5D50"/>
      <rect width="14" height="14" rx="2" fill="none" stroke="#2B1E16" stroke-width="0.8"/>
    </g>
    <text x="20" y="82">8 red agents</text>
    <text x="20" y="97">+ double agent</text>
    <text x="20" y="111" font-size="11">(the starting team)</text>

    <!-- Blue spymaster: 8 blue agent tiles -->
    <text x="460" y="24" font-size="13" font-weight="700" text-anchor="end">Blue spymaster</text>
    <use href="#blue" x="400" y="34"/>
    <use href="#blue" x="416" y="34"/>
    <use href="#blue" x="432" y="34"/>
    <use href="#blue" x="448" y="34"/>
    <use href="#blue" x="400" y="50"/>
    <use href="#blue" x="416" y="50"/>
    <use href="#blue" x="432" y="50"/>
    <use href="#blue" x="448" y="50"/>
    <text x="460" y="82" text-anchor="end">8 blue agents</text>

    <!-- Key card in its stand, between the spymasters. 9 red, 8 blue, 7 bystanders, 1 assassin. -->
    <rect x="206" y="10" width="68" height="68" rx="5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/>
    <rect x="212" y="16" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="223.5" y="16" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="235" y="16" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="246.5" y="16" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="258" y="16" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="212" y="27.5" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="223.5" y="27.5" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="235" y="27.5" width="10" height="10" rx="1.5" fill="#2B1E16"/>
    <rect x="246.5" y="27.5" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="258" y="27.5" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="212" y="39" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="223.5" y="39" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="235" y="39" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="246.5" y="39" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="258" y="39" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="212" y="50.5" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="223.5" y="50.5" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="235" y="50.5" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="246.5" y="50.5" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="258" y="50.5" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <rect x="212" y="62" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="223.5" y="62" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="235" y="62" width="10" height="10" rx="1.5" fill="#B9AD9C"/>
    <rect x="246.5" y="62" width="10" height="10" rx="1.5" fill="#2F5D50"/>
    <rect x="258" y="62" width="10" height="10" rx="1.5" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.4"/>
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.6">
      <path d="M235 10 L245 10 L240 14.5 Z"/><path d="M235 78 L245 78 L240 73.5 Z"/>
      <path d="M206 39 L206 49 L210.5 44 Z"/><path d="M274 39 L274 49 L269.5 44 Z"/>
    </g>
    <text x="282" y="41" font-size="11">Edge triangles</text>
    <text x="282" y="55" font-size="11">show who starts</text>
    <rect x="196" y="77" width="88" height="9" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
    <text x="240" y="99" text-anchor="middle" font-weight="700">Key card in its stand</text>

    <!-- 7 innocent bystanders and 1 assassin, between the spymasters -->
    <rect x="185.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="199.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="213.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="227.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="241.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="255.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="269.5" y="105" width="11" height="11" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <rect x="283.5" y="105" width="11" height="11" rx="2" fill="#2B1E16"/>
    <path d="M286 107.5 L292 113.5 M292 107.5 L286 113.5" stroke="#F6EFE3" stroke-width="1.4" stroke-linecap="round"/>
    <text x="240" y="129" text-anchor="middle">7 bystanders + 1 assassin</text>

    <!-- The table: 25 word cards in a 5 by 5 grid -->
    <rect x="107" y="136" width="266" height="120" rx="10" fill="none" stroke="#B9AD9C" stroke-width="1" stroke-dasharray="4 4"/>
    <use href="#card" x="117" y="143"/>
    <use href="#card" x="167" y="143"/>
    <use href="#card" x="217" y="143"/>
    <use href="#card" x="267" y="143"/>
    <use href="#card" x="317" y="143"/>
    <use href="#card" x="117" y="165"/>
    <use href="#card" x="167" y="165"/>
    <use href="#card" x="217" y="165"/>
    <use href="#card" x="267" y="165"/>
    <use href="#card" x="317" y="165"/>
    <use href="#card" x="117" y="187"/>
    <use href="#card" x="167" y="187"/>
    <use href="#card" x="217" y="187"/>
    <use href="#card" x="267" y="187"/>
    <use href="#card" x="317" y="187"/>
    <use href="#card" x="117" y="209"/>
    <use href="#card" x="167" y="209"/>
    <use href="#card" x="217" y="209"/>
    <use href="#card" x="267" y="209"/>
    <use href="#card" x="317" y="209"/>
    <use href="#card" x="117" y="231"/>
    <use href="#card" x="167" y="231"/>
    <use href="#card" x="217" y="231"/>
    <use href="#card" x="267" y="231"/>
    <use href="#card" x="317" y="231"/>
    <text x="16" y="190" font-weight="700">25 word cards</text>
    <text x="16" y="205">in a 5 by 5 grid</text>

    <!-- Legend for the tile and key colors -->
    <text x="382" y="160" font-weight="700">Colors</text>
    <rect x="382" y="170" width="10" height="10" rx="2" fill="#E0A23B" stroke="#2B1E16" stroke-width="0.6"/>
    <text x="397" y="179.5">Red agent</text>
    <rect x="382" y="187" width="10" height="10" rx="2" fill="#2F5D50" stroke="#2B1E16" stroke-width="0.6"/>
    <text x="397" y="196.5">Blue agent</text>
    <rect x="382" y="204" width="10" height="10" rx="2" fill="#B9AD9C" stroke="#2B1E16" stroke-width="0.6"/>
    <text x="397" y="213.5">Bystander</text>
    <rect x="382" y="221" width="10" height="10" rx="2" fill="#2B1E16" stroke="#2B1E16" stroke-width="0.6"/>
    <text x="397" y="230.5">Assassin</text>
    <path d="M384 238 Q382 238 382 240 L382 248 L392 238 Z" fill="#E0A23B"/>
    <path d="M392 238 L392 246 Q392 248 390 248 L382 248 Z" fill="#2F5D50"/>
    <rect x="382" y="238" width="10" height="10" rx="2" fill="none" stroke="#2B1E16" stroke-width="0.6"/>
    <text x="397" y="247.5">Double agent</text>

    <!-- Operatives sit across the table from the spymasters -->
    <g fill="#E0A23B" stroke="#2B1E16" stroke-width="0.8">
      <use href="#person" x="160" y="268"/>
      <use href="#person" x="180" y="268"/>
      <use href="#person" x="200" y="268"/>
    </g>
    <g fill="#2F5D50" stroke="#2B1E16" stroke-width="0.8">
      <use href="#person" x="280" y="268"/>
      <use href="#person" x="300" y="268"/>
      <use href="#person" x="320" y="268"/>
    </g>
    <text x="180" y="302" text-anchor="middle">Red operatives</text>
    <text x="300" y="302" text-anchor="middle">Blue operatives</text>
    <text x="240" y="316" text-anchor="middle" font-size="11" fill="#2F5D50">Only spymasters see the key. Operatives sit across the table.</text>
  </g>
</svg>
