<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-labelledby="t d">
  <title id="t">An invented Lorcana-style character card with every part labeled</title>
  <desc id="d">A made-up character card named Tilly Tallow, version Lamplight Keeper, not a real card. Labels point out the cost and inkwell symbol, ink type, illustration, name, version, Strength, Willpower, classifications, text box with a keyword and a named ability, flavor text, lore value, and the collector information at the bottom.</desc>
  <rect width="300" height="420" fill="#F6EFE3"/>
  <!-- Card frame -->
  <rect x="6" y="6" width="288" height="408" rx="16" fill="#2B1E16"/>
  <rect x="14" y="14" width="272" height="392" rx="11" fill="#F6EFE3"/>

  <g font-family="system-ui, sans-serif" fill="#2B1E16">
    <!-- Illustration window: original abstract art, a lantern over a round table -->
    <rect x="20" y="20" width="260" height="168" rx="8" fill="#2F5D50"/>
    <circle cx="170" cy="96" r="44" fill="#E0A23B" opacity="0.25"/>
    <rect x="160" y="56" width="20" height="8" rx="2" fill="#B9AD9C"/>
    <path d="M152 66 L188 66 L182 116 L158 116 Z" fill="#E0A23B" stroke="#2B1E16" stroke-width="1.5"/>
    <rect x="154" y="116" width="32" height="6" rx="2" fill="#B9AD9C"/>
    <ellipse cx="170" cy="156" rx="62" ry="11" fill="#B9AD9C"/>
    <circle cx="102" cy="150" r="7" fill="#F6EFE3" opacity="0.8"/>
    <circle cx="238" cy="150" r="7" fill="#F6EFE3" opacity="0.8"/>
    <rect x="200" y="26" width="74" height="12" rx="6" fill="#E0A23B"/>
    <text x="237" y="35" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">ILLUSTRATION</text>

    <!-- Cost with the inkwell symbol (ring) and ink type below it -->
    <circle cx="44" cy="46" r="21" fill="none" stroke="#B9AD9C" stroke-width="3" stroke-dasharray="6 3"/>
    <path d="M44 29 L59 37.5 L59 54.5 L44 63 L29 54.5 L29 37.5 Z" fill="#2B1E16" stroke="#F6EFE3" stroke-width="1.5"/>
    <text x="44" y="53" font-size="20" font-weight="700" fill="#F6EFE3" text-anchor="middle">3</text>
    <rect x="72" y="26" width="116" height="12" rx="6" fill="#E0A23B"/>
    <text x="130" y="35" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">COST + INKWELL SYMBOL</text>
    <path d="M44 74 L52 82 L44 90 L36 82 Z" fill="#E0A23B" stroke="#F6EFE3" stroke-width="1.5"/>
    <rect x="58" y="76" width="56" height="12" rx="6" fill="#E0A23B"/>
    <text x="86" y="85" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">INK TYPE</text>

    <!-- Name banner in the ink color, with Strength and Willpower -->
    <rect x="14" y="194" width="200" height="44" fill="#E0A23B"/>
    <text x="24" y="214" font-size="18" font-weight="700">Tilly Tallow</text>
    <text x="24" y="231" font-size="11" font-style="italic">Lamplight Keeper</text>
    <rect x="132" y="200" width="36" height="12" rx="6" fill="#2B1E16"/>
    <text x="150" y="209" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle" fill="#F6EFE3">NAME</text>
    <rect x="126" y="220" width="48" height="12" rx="6" fill="#2B1E16"/>
    <text x="150" y="229" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle" fill="#F6EFE3">VERSION</text>

    <!-- Strength (sword-like bar) and Willpower (shield) -->
    <g>
      <rect x="220" y="196" width="28" height="40" rx="5" fill="#2B1E16"/>
      <path d="M234 202 L237 205 L237 216 L231 216 L231 205 Z" fill="#F6EFE3"/>
      <text x="234" y="231" font-size="13" font-weight="700" text-anchor="middle" fill="#F6EFE3">2</text>
      <rect x="252" y="196" width="28" height="40" rx="5" fill="#2B1E16"/>
      <path d="M260 202 L272 202 L272 210 Q272 216 266 218 Q260 216 260 210 Z" fill="#F6EFE3"/>
      <text x="266" y="231" font-size="13" font-weight="700" text-anchor="middle" fill="#F6EFE3">4</text>
    </g>
    <rect x="160" y="172" width="116" height="12" rx="6" fill="#E0A23B"/>
    <text x="218" y="181" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">STRENGTH · WILLPOWER</text>

    <!-- Classifications -->
    <text x="24" y="254" font-size="10.5" font-weight="700">Storyborn · Ally</text>
    <rect x="126" y="245" width="70" height="12" rx="6" fill="#E0A23B"/>
    <text x="161" y="254" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">CLASSIFICATION</text>
    <line x1="20" y1="262" x2="244" y2="262" stroke="#B9AD9C" stroke-width="1"/>

    <!-- Text box -->
    <rect x="20" y="266" width="58" height="12" rx="6" fill="#E0A23B"/>
    <text x="49" y="275" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">TEXT BOX</text>
    <text x="24" y="292" font-size="9.5"><tspan font-weight="700">Support</tspan> (Whenever this character quests,</text>
    <text x="24" y="304" font-size="9.5">you may add their Strength to another chosen</text>
    <text x="24" y="316" font-size="9.5">character's Strength this turn.)</text>
    <text x="24" y="332" font-size="9.5"><tspan font-weight="700">LIGHT THE WAY</tspan> When you play this</text>
    <text x="24" y="344" font-size="9.5">character, you may draw a card, then</text>
    <text x="24" y="356" font-size="9.5">choose and discard a card.</text>
    <text x="24" y="372" font-size="9" font-style="italic" fill="#2F5D50">"Pull up a chair. The lamp is still warm."</text>

    <!-- Lore value on the right side of the text box -->
    <rect x="248" y="262" width="38" height="78" fill="#2B1E16"/>
    <path d="M267 272 L276 284 L267 296 L258 284 Z" fill="#E0A23B"/>
    <path d="M267 302 L276 314 L267 326 L258 314 Z" fill="#E0A23B"/>
    <rect x="246" y="344" width="40" height="12" rx="6" fill="#E0A23B"/>
    <text x="266" y="353" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle">LORE</text>

    <!-- Collector information -->
    <line x1="20" y1="380" x2="280" y2="380" stroke="#B9AD9C" stroke-width="1"/>
    <text x="24" y="394" font-size="8.5">Illus. A. Madeup</text>
    <text x="106" y="394" font-size="8.5" font-weight="700">007/204 · EN · L1</text>
    <circle cx="186" cy="391" r="4" fill="#2F5D50"/>
    <rect x="200" y="385" width="76" height="12" rx="6" fill="#E0A23B"/>
    <text x="238" y="394" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">COLLECTOR INFO</text>
    <text x="150" y="403" font-size="7.5" font-style="italic" fill="#2F5D50" text-anchor="middle">Made-up card for teaching. Not a real Disney Lorcana card.</text>
  </g>
</svg>
