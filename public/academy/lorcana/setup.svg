<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Disney Lorcana play area</title>
  <desc id="d">The play area for two players. On each side: a lore tracker starting at 0, the play zone with a ready character, an exerted character with damage on it, an item, and a location, the inkwell behind the play zone with facedown ink cards, some exerted sideways, and the deck and discard pile to one side. Each player's hand stays off the table, hidden.</desc>
  <defs>
    <!-- One player's side of the table, drawn for the bottom player -->
    <g id="side">
      <!-- Lore tracker -->
      <rect x="18" y="176" width="62" height="86" rx="8" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
      <path d="M49 196 L57 206 L49 216 L41 206 Z" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>

      <!-- Play zone -->
      <rect x="96" y="168" width="290" height="76" rx="10" fill="none" stroke="#2F5D50" stroke-width="1.2" stroke-dasharray="4 3"/>
      <!-- Ready character -->
      <rect x="108" y="176" width="32" height="44" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
      <path d="M124 190 L130 198 L124 206 L118 198 Z" fill="#E0A23B"/>
      <!-- Exerted character, turned sideways, with 2 damage -->
      <rect x="150" y="182" width="44" height="32" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
      <path d="M164 192 L170 198 L164 204 L158 198 Z" fill="#E0A23B"/>
      <circle cx="184" cy="190" r="6" fill="#E0A23B" stroke="#2B1E16" stroke-width="1"/>
      <!-- Item -->
      <rect x="204" y="176" width="32" height="44" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/>
      <circle cx="220" cy="198" r="7" fill="none" stroke="#2F5D50" stroke-width="1.5"/>
      <!-- Location, printed sideways -->
      <rect x="246" y="182" width="50" height="32" rx="4" fill="#B9AD9C" stroke="#2F5D50" stroke-width="1.5"/>
      <path d="M254 206 L262 196 L270 206 M266 206 L276 192 L288 206" fill="none" stroke="#2F5D50" stroke-width="1.5"/>

      <!-- Inkwell: facedown cards, three ready, two exerted -->
      <rect x="96" y="252" width="290" height="50" rx="10" fill="none" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="4 3"/>
      <rect x="106" y="260" width="24" height="34" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="134" y="260" width="24" height="34" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="162" y="260" width="24" height="34" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="192" y="265" width="34" height="24" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="232" y="265" width="34" height="24" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>

      <!-- Deck: a facedown stack -->
      <rect x="410" y="182" width="34" height="46" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="407" y="179" width="34" height="46" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="404" y="176" width="34" height="46" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <!-- Discard pile: faceup -->
      <rect x="404" y="250" width="34" height="46" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
      <rect x="409" y="256" width="24" height="14" rx="2" fill="#2F5D50" opacity="0.6"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>

  <!-- Center line -->
  <line x1="16" y1="160" x2="464" y2="160" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Opponent's side: the same layout, turned to face them -->
  <g transform="rotate(180 240 160)" opacity="0.5">
    <use href="#side"/>
  </g>
  <!-- Your side -->
  <use href="#side"/>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">
    <!-- Opponent labels -->
    <text x="102" y="38" font-size="11" fill="#2F5D50">Opponent's</text>
    <text x="102" y="52" font-size="11" fill="#2F5D50">inkwell</text>
    <text x="102" y="114" font-size="11" fill="#2F5D50">Opponent's</text>
    <text x="102" y="128" font-size="11" fill="#2F5D50">play zone</text>
    <text x="431" y="32" text-anchor="middle" font-size="11" fill="#2F5D50">Opponent's</text>
    <text x="431" y="46" text-anchor="middle" font-size="11" fill="#2F5D50">lore</text>

    <!-- Your labels: lore tracker -->
    <text x="49" y="244" text-anchor="middle" font-size="26" font-weight="700">0</text>
    <text x="49" y="278" text-anchor="middle" font-weight="700">Lore</text>
    <text x="49" y="292" text-anchor="middle" font-size="11">first to 20</text>
    <text x="49" y="305" text-anchor="middle" font-size="11">wins</text>

    <!-- Play zone -->
    <text x="124" y="234" text-anchor="middle" font-size="11">ready</text>
    <text x="172" y="234" text-anchor="middle" font-size="11">exerted</text>
    <text x="220" y="234" text-anchor="middle" font-size="11">item</text>
    <text x="271" y="234" text-anchor="middle" font-size="11">location</text>
    <text x="184" y="194" text-anchor="middle" font-size="8" font-weight="700">2</text>
    <text x="310" y="190" font-weight="700">Play zone</text>
    <text x="310" y="204" font-size="11">characters,</text>
    <text x="310" y="217" font-size="11">items, and</text>
    <text x="310" y="230" font-size="11">locations</text>

    <!-- Inkwell -->
    <text x="280" y="270" font-weight="700">Inkwell</text>
    <text x="280" y="284" font-size="11">facedown,</text>
    <text x="280" y="297" font-size="11">1 ink each</text>

    <!-- Deck and discard -->
    <text x="423" y="240" text-anchor="middle" font-weight="700">Deck</text>
    <text x="421" y="310" text-anchor="middle" font-weight="700">Discard</text>

    <!-- Hand -->
    <text x="241" y="315" text-anchor="middle" font-size="11" fill="#2F5D50">Your hand: 7 cards to start, kept hidden</text>
  </g>
</svg>
