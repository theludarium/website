<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Power Grid Recharged setup</title>
  <desc id="d">The board with four connected regions in play for four players, every player's house on 0 of the cities track, a random turn order, the resource market stocked for setup, the power plant market with four current and four future plants, the draw pile, the discount token and auction hammer, the refill card, and each player's houses, 50 Elektro, and payout card.</desc>
