<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Arkham Horror: The Card Game table at setup, for two players</title>
  <desc id="d">Across the top: the agenda deck, the act deck, the scenario reference card, the encounter deck, and the encounter discard pile. In the middle: the chaos bag, the starting location with both investigator tokens on it, the token pool, and an out-of-play area for set-aside cards and the victory display. Along the bottom: each player's play area, with a threat area for engaged enemies, the investigator card, assets, deck, and discard pile.</desc>
  <rect width="480" height="320" fill="#F6EFE3"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">

    <!-- Scenario row -->
    <rect x="8" y="8" width="464" height="92" rx="12" fill="#2F5D50" fill-opacity="0.08" stroke="#B9AD9C" stroke-width="1.5"/>
    <text x="18" y="25" font-size="13" font-weight="700">Scenario</text>

    <g stroke="#2B1E16" stroke-width="1">
      <rect x="22" y="38" width="76" height="46" rx="5" fill="#E0A23B" fill-opacity="0.35"/>
      <rect x="25" y="35" width="76" height="46" rx="5" fill="#E0A23B" fill-opacity="0.55"/>
      <rect x="112" y="38" width="76" height="46" rx="5" fill="#2F5D50" fill-opacity="0.25"/>
      <rect x="115" y="35" width="76" height="46" rx="5" fill="#2F5D50" fill-opacity="0.45"/>
      <rect x="208" y="33" width="38" height="52" rx="5" fill="#F6EFE3"/>
      <rect x="276" y="36" width="38" height="52" rx="5" fill="#2B1E16" fill-opacity="0.7"/>
      <rect x="279" y="33" width="38" height="52" rx="5" fill="#2B1E16"/>
      <rect x="350" y="33" width="38" height="52" rx="5" fill="#B9AD9C" fill-opacity="0.5"/>
    </g>
    <line x1="214" y1="45" x2="240" y2="45" stroke="#B9AD9C" stroke-width="2"/>
    <line x1="214" y1="53" x2="240" y2="53" stroke="#B9AD9C" stroke-width="2"/>
    <line x1="214" y1="61" x2="236" y2="61" stroke="#B9AD9C" stroke-width="2"/>
    <line x1="214" y1="69" x2="240" y2="69" stroke="#B9AD9C" stroke-width="2"/>
    <text x="63" y="62" text-anchor="middle" font-size="12" font-weight="700">Agenda</text>
    <text x="153" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#F6EFE3">Act</text>
    <text x="63" y="96" text-anchor="middle" font-size="11">adds doom</text>
    <text x="153" y="96" text-anchor="middle" font-size="11">needs clues</text>
    <text x="227" y="96" text-anchor="middle" font-size="11">Reference</text>
    <text x="298" y="96" text-anchor="middle" font-size="11">Encounter deck</text>
    <text x="369" y="96" text-anchor="middle" font-size="11">Discard</text>
    <text x="440" y="54" text-anchor="middle" font-size="11">first round:</text>
    <text x="440" y="68" text-anchor="middle" font-size="11">skip Mythos</text>

    <!-- Middle row -->
    <!-- Chaos bag -->
    <path d="M30 172 C24 150 34 132 52 128 L48 120 L72 120 L68 128 C86 132 96 150 90 172 Z" fill="#2B1E16"/>
    <path d="M46 121 Q60 114 74 121" fill="none" stroke="#E0A23B" stroke-width="2"/>
    <circle cx="50" cy="152" r="5" fill="#F6EFE3"/>
    <circle cx="66" cy="146" r="5" fill="#E0A23B"/>
    <circle cx="72" cy="160" r="5" fill="#B9AD9C"/>
    <text x="60" y="190" text-anchor="middle" font-size="12" font-weight="700">Chaos bag</text>

    <!-- Starting location -->
    <rect x="128" y="114" width="104" height="70" rx="8" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
    <text x="180" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#F6EFE3">Starting</text>
    <text x="180" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#F6EFE3">location</text>
    <circle cx="164" cy="166" r="8" fill="#E0A23B" stroke="#F6EFE3" stroke-width="1.5"/>
    <circle cx="196" cy="166" r="8" fill="#F6EFE3" stroke="#E0A23B" stroke-width="1.5"/>
    <text x="180" y="200" text-anchor="middle" font-size="11">both investigators</text>

    <!-- Token pool -->
    <g stroke="#2B1E16" stroke-width="0.8">
      <circle cx="272" cy="126" r="7" fill="#E0A23B"/>
      <circle cx="290" cy="126" r="7" fill="#2F5D50"/>
      <circle cx="308" cy="126" r="7" fill="#B9AD9C"/>
      <circle cx="272" cy="144" r="7" fill="#F6EFE3"/>
      <circle cx="290" cy="144" r="7" fill="#2B1E16"/>
      <circle cx="308" cy="144" r="7" fill="#E0A23B" fill-opacity="0.5"/>
    </g>
    <text x="290" y="168" text-anchor="middle" font-size="12" font-weight="700">Token pool</text>
    <text x="290" y="182" text-anchor="middle" font-size="11">damage, horror,</text>
    <text x="290" y="196" text-anchor="middle" font-size="11">clues, doom, resources</text>

    <!-- Out of play -->
    <rect x="336" y="114" width="136" height="70" rx="8" fill="none" stroke="#B9AD9C" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="404" y="140" text-anchor="middle" font-size="12" font-weight="700">Out of play</text>
    <text x="404" y="156" text-anchor="middle" font-size="11">set-aside cards and</text>
    <text x="404" y="170" text-anchor="middle" font-size="11">the victory display</text>

    <!-- Player areas -->
    <g>
      <rect x="8" y="216" width="228" height="96" rx="12" fill="#E0A23B" fill-opacity="0.12" stroke="#B9AD9C" stroke-width="1.5"/>
      <text x="18" y="233" font-size="13" font-weight="700">Player 1</text>
      <rect x="84" y="222" width="144" height="18" rx="4" fill="#2B1E16" fill-opacity="0.08" stroke="#B9AD9C"/>
      <text x="156" y="235" text-anchor="middle" font-size="11">Threat area</text>
      <rect x="18" y="246" width="52" height="40" rx="5" fill="#E0A23B" stroke="#2B1E16"/>
      <text x="44" y="300" text-anchor="middle" font-size="11">Investigator</text>
      <rect x="78" y="250" width="26" height="36" rx="4" fill="#F6EFE3" stroke="#2B1E16"/>
      <rect x="108" y="250" width="26" height="36" rx="4" fill="#F6EFE3" stroke="#2B1E16"/>
      <text x="106" y="300" text-anchor="middle" font-size="11">Assets</text>
      <rect x="148" y="250" width="26" height="36" rx="4" fill="#2F5D50" stroke="#2B1E16"/>
      <text x="161" y="300" text-anchor="middle" font-size="11">Deck</text>
      <rect x="192" y="250" width="26" height="36" rx="4" fill="#B9AD9C" fill-opacity="0.5" stroke="#2B1E16"/>
      <text x="205" y="300" text-anchor="middle" font-size="11">Discard</text>
    </g>
    <g>
      <rect x="244" y="216" width="228" height="96" rx="12" fill="#E0A23B" fill-opacity="0.12" stroke="#B9AD9C" stroke-width="1.5"/>
      <text x="254" y="233" font-size="13" font-weight="700">Player 2</text>
      <rect x="320" y="222" width="144" height="18" rx="4" fill="#2B1E16" fill-opacity="0.08" stroke="#B9AD9C"/>
      <text x="392" y="235" text-anchor="middle" font-size="11">Threat area</text>
      <rect x="254" y="246" width="52" height="40" rx="5" fill="#F6EFE3" stroke="#E0A23B" stroke-width="2"/>
      <text x="280" y="300" text-anchor="middle" font-size="11">Investigator</text>
      <rect x="314" y="250" width="26" height="36" rx="4" fill="#F6EFE3" stroke="#2B1E16"/>
      <rect x="344" y="250" width="26" height="36" rx="4" fill="#F6EFE3" stroke="#2B1E16"/>
      <text x="342" y="300" text-anchor="middle" font-size="11">Assets</text>
      <rect x="384" y="250" width="26" height="36" rx="4" fill="#2F5D50" stroke="#2B1E16"/>
      <text x="397" y="300" text-anchor="middle" font-size="11">Deck</text>
      <rect x="428" y="250" width="26" height="36" rx="4" fill="#B9AD9C" fill-opacity="0.5" stroke="#2B1E16"/>
      <text x="441" y="300" text-anchor="middle" font-size="11">Discard</text>
    </g>
  </g>
</svg>
