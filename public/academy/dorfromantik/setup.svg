<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
<title id="t">Dorfromantik setup</title>
<desc id="d">Dorfromantik: The Board Game at setup, seen from above. The play area in the middle starts empty; the first Task tile revealed on turn 1 starts the map. On the left, facedown stacks of Task tiles and five facedown piles of Task markers, one per type. On the right, facedown stacks of Landscape tiles, with 3 Landscape tiles going back to the box unseen. At the top, the game box with its 5 closed boxes. At the bottom, the Score pad and Campaign pad set aside, and a space for completed Task markers.</desc>
