<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Pokémon TCG play area</title>
  <desc id="d">The play area for two players. On each side: the Active Spot in the middle, a Bench of up to 5 Pokémon behind it, 6 face-down Prize cards on the left, and the deck and discard pile on the right. A shared Stadium spot sits by the center line. Each player's hand stays off the table, hidden.</desc>
  <defs>
    <!-- One player's side of the table, drawn for the bottom player -->
    <g id="side">
      <!-- Active Spot -->
      <rect x="221" y="170" width="38" height="52" rx="4" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.2"/>
      <circle cx="240" cy="190" r="8" fill="#E0A23B"/>
      <!-- Bench: 5 spaces -->
      <rect x="145" y="236" width="38" height="50" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="187" y="236" width="38" height="50" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="229" y="236" width="38" height="50" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="271" y="236" width="38" height="50" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="313" y="236" width="38" height="50" rx="4" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.2" stroke-dasharray="3 2"/>
      <!-- Prize cards: 6 face down -->
      <rect x="24" y="180" width="28" height="36" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="58" y="180" width="28" height="36" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="24" y="220" width="28" height="36" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="58" y="220" width="28" height="36" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="24" y="260" width="28" height="36" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="58" y="260" width="28" height="36" rx="3" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <!-- Deck: a face-down stack -->
      <rect x="410" y="182" width="38" height="52" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="407" y="179" width="38" height="52" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <rect x="404" y="176" width="38" height="52" rx="4" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/>
      <!-- Discard pile: face up -->
      <rect x="404" y="252" width="38" height="46" rx="4" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1"/>
      <rect x="410" y="258" width="26" height="14" rx="2" fill="#B9AD9C"/>
    </g>
  </defs>
  <rect width="480" height="320" fill="#F6EFE3"/>

  <!-- Center line -->
  <line x1="16" y1="160" x2="271" y2="160" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="365" y1="160" x2="464" y2="160" stroke="#B9AD9C" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Opponent's side: the same layout, turned to face them -->
  <g transform="rotate(180 240 160)" opacity="0.55">
    <use href="#side"/>
  </g>
  <!-- Your side -->
  <use href="#side"/>

  <!-- Shared Stadium spot -->
  <rect x="277" y="145" width="82" height="30" rx="4" fill="#F6EFE3" stroke="#E0A23B" stroke-width="1.5"/>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#2B1E16">
    <text x="318" y="158" text-anchor="middle" font-weight="700">Stadium</text>
    <text x="318" y="170" text-anchor="middle" font-size="9">shared, 1 at a time</text>

    <!-- Opponent labels -->
    <text x="240" y="22" text-anchor="middle" fill="#2F5D50">Opponent's Bench</text>
    <text x="212" y="128" text-anchor="end" fill="#2F5D50">Opponent's Active</text>
    <text x="464" y="154" text-anchor="end" fill="#2F5D50">Opponent's Prizes</text>

    <!-- Your labels -->
    <text x="266" y="192" font-weight="700">Active Spot</text>
    <text x="266" y="206" font-size="11">1 Pokémon</text>
    <text x="248" y="300" text-anchor="middle" font-weight="700">Bench: up to 5 Pokémon</text>
    <text x="55" y="310" text-anchor="middle" font-weight="700">6 Prize cards</text>
    <text x="55" y="174" text-anchor="middle" font-size="11">face down</text>
    <text x="423" y="246" text-anchor="middle" font-weight="700">Deck</text>
    <text x="423" y="311" text-anchor="middle" font-weight="700">Discard pile</text>
    <text x="248" y="315" text-anchor="middle" font-size="11" fill="#2F5D50">Your hand stays in your hand, hidden</text>
  </g>
</svg>
