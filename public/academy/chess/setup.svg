<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">The chess starting position, White at the bottom</title>
  <desc id="d">An eight by eight board with files a to h along the bottom and ranks 1 to 8 up the side. The square at h1, in White's near right corner, is light. White's pawns fill rank 2 and Black's fill rank 7. On rank 1, from a to h, White has rook, knight, bishop, queen, king, bishop, knight, rook, so the white queen stands on the light square d1. Black mirrors this on rank 8, with the black queen on the dark square d8, facing the white queen. A side panel gives the piece key and three setup checks.</desc>
