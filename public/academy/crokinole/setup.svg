    <circle cx="240" cy="170" r="6" fill="#2B1E16"/>
    <text x="240" y="154" text-anchor="middle" font-weight="700">15</text>
    <text x="240" y="123" text-anchor="middle" font-weight="700">10</text>
    <text x="240" y="89" text-anchor="middle" font-weight="700">5</text>
    <text x="240" y="55" text-anchor="middle" font-size="11">ditch</text>
    <circle cx="139" cy="170" r="5.5" fill="#2F5D50" stroke="#2B1E16" stroke-width="1"/>
