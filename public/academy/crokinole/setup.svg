<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Crokinole board at the start of a two-player round, seen from above</title>
  <desc id="d">A round board with the 20 hole in the center, the 15 ring, whose line is marked as the place the eight pegs stand, the 10 ring, and the wide 5 ring split into four quarters by short lines. A ditch runs around the playing surface. Two players sit across from each other. Each has one disc touching the outer line in their own quarter and seven more discs waiting on the table.</desc>
