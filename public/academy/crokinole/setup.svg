    <circle cx="240" cy="170" r="102" fill="none" stroke="#2B1E16" stroke-width="1.4"/>
    <circle cx="240" cy="170" r="68" fill="none" stroke="#2B1E16" stroke-width="1.2"/>
    <circle cx="240" cy="170" r="34" fill="#2F5D50" fill-opacity="0.10" stroke="#2B1E16" stroke-width="2.4"/>
