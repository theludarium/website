    <rect x="273" y="48" width="60" height="36" rx="5" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/><text x="303.0" y="64" text-anchor="middle" fill="#2B1E16">Monster</text><text x="303.0" y="77" text-anchor="middle" fill="#2B1E16">Zone</text>
    <rect x="336" y="48" width="60" height="36" rx="5" fill="#F6EFE3" stroke="#2F5D50" stroke-width="1.5"/><text x="366.0" y="64" text-anchor="middle" fill="#2B1E16">Monster</text><text x="366.0" y="77" text-anchor="middle" fill="#2B1E16">Zone</text>
    <rect x="21" y="48" width="60" height="36" rx="5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/><text x="51.0" y="70" text-anchor="middle" fill="#2B1E16">GY</text>
    <rect x="402" y="11" width="60" height="36" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/><rect x="399" y="8" width="60" height="36" rx="5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/><text x="429.0" y="24" text-anchor="middle" fill="#2B1E16">Extra</text><text x="429.0" y="37" text-anchor="middle" fill="#2B1E16">Deck</text>
    <rect x="84" y="8" width="60" height="36" rx="5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1.5"/><text x="114.0" y="24" text-anchor="middle" fill="#2B1E16" letter-spacing="-0.4">Pendulum</text><text x="114.0" y="37" text-anchor="middle" fill="#2B1E16">+ S &amp; T</text>
    <rect x="147" y="8" width="60" height="36" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1.5"/><text x="177.0" y="24" text-anchor="middle" fill="#2B1E16">Spell &amp;</text><text x="177.0" y="37" text-anchor="middle" fill="#2B1E16">Trap</text>
    <rect x="210" y="8" width="60" height="36" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1.5"/><text x="240.0" y="24" text-anchor="middle" fill="#2B1E16">Spell &amp;</text><text x="240.0" y="37" text-anchor="middle" fill="#2B1E16">Trap</text>
    <rect x="273" y="8" width="60" height="36" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1.5"/><text x="303.0" y="24" text-anchor="middle" fill="#2B1E16">Spell &amp;</text><text x="303.0" y="37" text-anchor="middle" fill="#2B1E16">Trap</text>
    <rect x="336" y="8" width="60" height="36" rx="5" fill="#E0A23B" stroke="#2B1E16" stroke-width="1.5"/><text x="366.0" y="24" text-anchor="middle" fill="#2B1E16" letter-spacing="-0.4">Pendulum</text><text x="366.0" y="37" text-anchor="middle" fill="#2B1E16">+ S &amp; T</text>
    <rect x="24" y="11" width="60" height="36" rx="5" fill="#B9AD9C" stroke="#2B1E16" stroke-width="1"/><rect x="21" y="8" width="60" height="36" rx="5" fill="#F6EFE3" stroke="#2B1E16" stroke-width="1.5"/><text x="51.0" y="30" text-anchor="middle" fill="#2B1E16">Deck</text>
    <rect x="147" y="106" width="60" height="36" rx="5" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.5"/><text x="177.0" y="122" text-anchor="middle" fill="#F6EFE3">Extra</text><text x="177.0" y="135" text-anchor="middle" fill="#F6EFE3">Monster</text>
    <rect x="273" y="106" width="60" height="36" rx="5" fill="#2F5D50" stroke="#2B1E16" stroke-width="1.5"/><text x="303.0" y="122" text-anchor="middle" fill="#F6EFE3">Extra</text><text x="303.0" y="135" text-anchor="middle" fill="#F6EFE3">Monster</text>
    <!-- Legend -->
    <g font-size="12">
      <text x="23" y="262">S &amp; T: Spell &amp; Trap Zone. The two end zones double as Pendulum Zones.</text>
      <text x="23" y="279">GY: Graveyard, face up and public. Deck and Extra Deck stay face down.</text>
      <text x="23" y="296">Hand: held and hidden. Banished cards: set apart, out of play.</text>
      <text x="23" y="313" fill="#2F5D50" font-weight="700">Each player starts with 8000 LP and draws 5 cards.</text>
    </g>
  </g>
</svg>
