faq:
  - q: "How much does a ship cost in Catan Seafarers?"
    a: "A ship costs 1 wood and 1 wool. A road still costs 1 brick and 1 wood. Each player has 15 ships."
  - q: "Can you connect a ship to a road in Seafarers?"
    a: "Not directly. A new ship must connect to one of your ships or to one of your settlements or cities, never to a road. Roads and ships only count as one route for Longest Route where they meet at one of your buildings."
  - q: "How do gold fields work in Catan Seafarers?"
    a: "When a gold field's number is rolled, each settlement on it takes 1 resource card of its owner's choice. Each city takes 2, in any combination of brick, wood, wool, wheat, or ore."
  - q: "Can you move ships in Seafarers?"
    a: "Yes, 1 ship per turn during your Action phase. It cannot be a ship you built this turn, it needs one open end, and it cannot sit in an unbroken line of ships between two of your buildings. You also cannot move a ship to or from an edge of the pirate's hex."
  - q: "What does the pirate do in Catan Seafarers?"
    a: "When you roll a 7 or play a Knight, you may move the pirate instead of the robber, to a new sea hex or to the frame. On a sea hex you steal 1 random card from a player with a ship on that hex. No one may build or move ships on the edges of the pirate's hex."
  - q: "Can you play Seafarers with 5 or 6 players?"
    a: "Yes, with the Seafarers 5 to 6 Player Extension, which also needs the base CATAN 5 to 6 extension. Its 2025 edition uses paired turns: a second player takes an Action phase after each player's turn, but cannot trade with other players."
teachSheet:
  goal: "Reach the scenario's victory point goal on your own turn. Heading for New Shores: 14 VP."
  setup:
    - "Flip the CATAN frame pieces to their plain side. Build the frame shown on the scenario map."
    - "Lay out the hexes, number discs, and ports from the 3 or 4 player map."
    - "Place the robber and the pirate where the map shows."
    - "Each player adds 15 ships to the usual roads, settlements, and cities."
    - "Place starting pieces as in base CATAN. A coastal settlement may take a ship instead of a road."
    - "Heading for New Shores: both starting settlements go on the main island."
  turn:
    - "Roll for production, as in base CATAN."
    - "Gold field: 1 resource of your choice per settlement, 2 per city."
    - "On a 7 or a Knight, move the robber or the pirate. The pirate steals from a ship on its hex."
    - "Trade and build as usual. A ship costs 1 wood and 1 wool."
    - "A new ship joins your ship or building, never a road. None on the pirate's hex."
    - "Move 1 ship with an open end. Not one you built this turn."
    - "Road Building gives 2 roads, 2 ships, or 1 of each."
  scoring:
    - "Settlement 1 VP. City 2 VP. Victory Point cards 1 VP each."
    - "Longest Route: 5 or more connected roads and ships, 2 VP."
    - "Roads and ships join only at your own building."
    - "Largest Army: 2 VP, as in base CATAN."
    - "Heading for New Shores: your first settlement on each small island earns 2 VP tokens."
  endGame: "The game ends the moment a player reaches the scenario's goal during their own turn. Heading for New Shores: 14 VP."
  tips:
    - "Settle on the coast. Ships can only start from a building or another ship."
    - "Count the ships to the next island before you set sail."
    - "Park the pirate beside a rival's lead ship to stop their voyage."
diagramAlt: "A corner of a Seafarers board: a main island of land hexes with the robber, open sea with the pirate ship, a small island with a gold field, a settlement with a road on land and a ship on a sea edge, the sea frame along the bottom, and a supply of 15 ships per player, at 1 wood and 1 wool each."
