faq:
  - q: "How many Action cards can you play in a Dominion turn?"
    a: "One, unless your cards give you more. A card that says +1 Action or +2 Actions adds to how many Action cards you may play, but you finish the current card before you play the next one."
  - q: "When do you shuffle your deck in Dominion?"
    a: "Only when you need a card from your deck and it is empty or too small. Then you shuffle your discard pile and put it under whatever is left of your deck. Never shuffle early."
  - q: "How does a game of Dominion end?"
    a: "At the end of any turn in which the Province pile is empty or any three Supply piles are empty. Every pile counts, including Curses, Copper, Estates, and the Kingdom piles."
  - q: "Which ten Kingdom cards should you use for your first game of Dominion?"
    a: "The rulebook's First Game set: Cellar, Market, Merchant, Militia, Mine, Moat, Remodel, Smithy, Village, and Workshop. It shows the main ideas of the game without any card that is hard to explain."
  - q: "Who wins a tie in Dominion?"
    a: "The tied player who took fewer turns. If the tied players also took the same number of turns, they share the win."
  - q: "Can you play Treasures after you buy a card?"
    a: "No. In your Buy phase you play the Treasures you want first, then you buy. Once you have bought a card, you cannot add more Treasures that turn."
teachSheet:
  goal: "Build a better deck as you play, then use it to collect the most victory points by the end."
  setup:
    - "Each player shuffles 7 Coppers and 3 Estates face down as their deck."
    - "Lay out the 7 Base piles: Copper, Silver, Gold, Estate, Duchy, Province, Curse."
    - "Estates, Duchies, Provinces: 8 each for 2 players, 12 each for 3 or 4."
    - "Curses: 10 for 2 players, 20 for 3, 30 for 4."
    - "First game: Cellar, Market, Merchant, Militia, Mine, Moat, Remodel, Smithy, Village, Workshop."
    - "Put out 10 of each Kingdom card (Gardens: 8 for 2 players, 12 for 3 or 4)."
    - "Put the Trash mat nearby."
    - "Pick a first player at random. Everyone draws 5 cards."
  turn:
    - "Action: you may play 1 Action card. +Actions let you play more."
    - "Finish each card, top to bottom, before you play the next."
    - "Buy: play any Treasures, then buy 1 card costing up to your total."
    - "Bought cards go to your discard pile. +Buys let you buy more."
    - "Clean-up: discard your hand and every card you played."
    - "Draw 5. If your deck runs short, shuffle your discard pile under it."
  scoring:
    - "Copper is worth $1 to spend, Silver $2, Gold $3."
    - "Estate 1 point, Duchy 3, Province 6. Each Curse is minus 1."
    - "At the end, count every card you own: hand, deck, and discard."
    - "Most points wins. A tie goes to whoever took fewer turns."
  endGame: "The game ends after any turn in which the Province pile is empty or any three Supply piles are empty."
  tips:
    - "Buy a Province whenever you have $8."
    - "Early on, Silver beats a cheap Action card you have no plan for."
    - "Without Villages, one or two Smithies is plenty."
diagramAlt: "Dominion setup for two players: the Supply of 17 face-up piles, with 7 Base card piles (46 Copper, 40 Silver, 30 Gold, 8 Estates, 8 Duchies, 8 Provinces, 10 Curses) and the 10 First Game Kingdom piles sorted by cost, the Trash mat beside them, and each player's shuffled deck of 7 Coppers and 3 Estates with a hand of 5 cards drawn."
