faq:
  - q: "How do you set up a chess board?"
    a: "Turn the board so each player has a light square in the near right corner. Pawns fill the second row. The back row runs rook, knight, bishop, queen, king, bishop, knight, rook, with each queen on her own color."
  - q: "Is stalemate a win or a draw in chess?"
    a: "A draw. Stalemate means the player to move has no legal move and is not in check. It is the most common way a winning player throws away a won game."
  - q: "Can you castle out of check or through check?"
    a: "No. The FIDE Laws forbid castling when the king is in check, when it would cross a square an enemy piece attacks, or when it would land in check. The rook may pass an attacked square."
  - q: "What is the 50-move rule in chess?"
    a: "If each player has made 50 moves in a row with no pawn move and no capture, the player to move can claim a draw. Under FIDE rules, at 75 moves each the game is drawn automatically."
  - q: "What is a good chess rating for a beginner?"
    a: "There is no single answer, because US Chess, FIDE, and online sites use different scales. Compare yourself only within one system, and judge progress by your own rating over months, not by one number."
teachSheet:
  goal: "Checkmate the other king: attack it so it has no legal way out."
  setup:
    - "Light square in each player's near right corner."
    - "Pawns fill each player's second row."
    - "Back row from the corners in: rook, knight, bishop."
    - "Queen on her own color, king on the last square."
    - "White moves first. Players alternate, one move each."
  turn:
    - "Move one piece. Capture by landing on an enemy piece."
    - "Rook: straight lines. Bishop: diagonals. Queen: both."
    - "King: one square any way. Never into check."
    - "Knight: an L shape, jumping over pieces."
    - "Pawn: forward one, or two on its first move. Captures diagonally."
    - "Castling, en passant, and promotion are special moves. See lesson 3."
    - "In check? Move the king, block, or capture the attacker."
  scoring:
    - "Checkmate wins at once. Resigning loses."
    - "Running out of time loses, unless the other side cannot mate."
    - "Stalemate is a draw: no legal move and not in check."
    - "Draws: agreement, threefold repetition, 50-move rule, no mating material."
  endGame: "The game ends at checkmate, resignation, a draw, or when a player runs out of time on the clock."
  tips:
    - "Before every move, ask what the last enemy move threatens."
    - "Take the center, bring out knights and bishops, then castle."
    - "When far ahead, leave the lone king a move so it is not stalemate."
diagramAlt: "The chess starting position with White at the bottom. Files a to h run along the bottom and ranks 1 to 8 up the side. The near right corner, h1, is a light square. White's pawns fill rank 2 and Black's fill rank 7. Each back rank runs rook, knight, bishop, queen, king, bishop, knight, rook from the a file, so the white queen stands on the light square d1 and the black queen on the dark square d8, facing each other."
