faq:
  - q: "How long does a game of Twilight Imperium take?"
    a: "Fantasy Flight lists 4 to 6 hours. First games with new players usually run longer, because every rule is new. Prepare the map and factions before game day and teach in advance, and a group can usually finish in one long sitting."
  - q: "How do you win Twilight Imperium?"
    a: "The first player to reach 10 victory points wins immediately. Most points come from public and secret objectives, scored mostly in the status phase. The game also ends if a public objective must be revealed and none are left; then the player with the most points wins."
  - q: "How many players does Twilight Imperium need?"
    a: "The base game plays 3 to 6, and the Prophecy of Kings expansion adds pieces for 7 and 8. With 3 or 4 players, each player takes two strategy cards each round. Six players fill the standard map."
  - q: "What is the custodians token in Twilight Imperium?"
    a: "It starts on Mecatol Rex, the planet at the center. To remove it, spend 6 influence and land at least 1 ground force there. You gain 1 victory point, and the agenda phase joins every round from then on, including that one."
  - q: "Which Twilight Imperium factions are best for beginners?"
    a: "Factions with simple, always-on abilities teach the game without extra rules: the Federation of Sol, the Barony of Letnev, Sardakk N'orr, the Emirates of Hacan, and the Xxcha Kingdom are common picks. Save the Nekro Virus and the Ghosts of Creuss for later games."
teachSheet:
  goal: "Be the first to 10 victory points, mostly by scoring public and secret objectives."
  setup:
    - "Pick a random speaker. Each player takes a faction, a color, and its components."
    - "Build the galaxy: Mecatol Rex in the center, home systems in the third ring."
    - "Put the custodians token on Mecatol Rex. Shuffle all the common decks."
    - "Place the eight strategy cards near the speaker. Set out starting units and technologies."
    - "Command tokens: 3 in your tactic pool, 3 in your fleet pool, 2 in your strategy pool."
    - "Each player draws 2 secret objectives and keeps 1."
    - "Deal 5 stage I and 5 stage II objectives face down. Reveal 2 stage I."
  turn:
    - "Strategy phase: from the speaker, clockwise, take a strategy card. With 3 or 4 players, take two."
    - "Action phase: in initiative order, take one action per turn until everyone passes."
    - "Strategic action: use your card's primary. Others may pay a strategy token for its secondary."
    - "Tactical action: put a tactic token in a system, move ships in, fight, invade, produce."
    - "Component action: use an Action ability on a card or your faction sheet."
    - "You cannot pass until you have used your strategy card, or both cards at 3 or 4."
    - "Status phase: score, reveal an objective, draw an action card, reclaim tokens, gain 2."
    - "Agenda phase, once the custodians are gone: vote on two agendas with planet influence."
  scoring:
    - "Stage I public objectives score 1 point. Stage II score 2."
    - "Secret objectives score 1 point. Hold at most 3, scored and unscored."
    - "Each status phase: at most one public and one secret objective."
    - "To score public objectives, you must control every planet in your home system."
    - "Removing the custodians token from Mecatol Rex scores 1 point."
    - "Imperial strategy card: score a public objective, plus 1 point if you control Mecatol Rex."
  endGame: "The game ends the moment a player reaches 10 points. It also ends if the speaker must reveal a public objective and none are left: most points wins, ties broken by initiative order."
  tips:
    - "Read the revealed objectives aloud every status phase. They are the real scoreboard."
    - "Spend command tokens like time: every tactical action costs one, and they come back slowly."
    - "Teach combat at the first battle, not before. The first round has enough to learn."
diagramAlt: "An abstract six-player Twilight Imperium setup. On the left, a hex galaxy of three rings around Mecatol Rex, which holds the custodians token. Six home systems sit at the corners of the third ring, with blue planet systems and red anomaly or empty systems between them. On the right, a panel shows the victory point track to 10, five stage I objectives with two revealed, five stage II objectives face down, the eight strategy cards beside the speaker, the shared decks, and each player's command sheet with 3 tactic, 3 fleet, and 2 strategy tokens plus one secret objective."
