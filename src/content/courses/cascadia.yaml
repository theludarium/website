faq:
  - q: "How many turns do you get in Cascadia?"
    a: "Exactly 20. Setup uses 20 habitat tiles per player plus 3, and the game ends at the end of the turn when a taken tile cannot be replaced from the stacks. Solo games also last 20 turns."
  - q: "What happens when three or four wildlife tokens in Cascadia are the same?"
    a: "If all four tokens in the display show the same animal, they are wiped automatically and replaced from the bag, and that can happen more than once in a turn. If exactly three match, the active player may wipe those three, once per turn."
  - q: "What do nature tokens do in Cascadia?"
    a: "You take one when you place a wildlife token on a keystone tile showing that animal. Before you pick, you may spend one to take any tile with any token, or to wipe and replace any number of tokens. Each one you keep is worth 1 point at the end."
  - q: "Do habitat tiles have to match when you place them?"
    a: "No. A new tile only has to touch a tile already in your environment. Matching edges are not a placement rule, but they connect habitat corridors, and your largest corridor of each habitat scores 1 point per tile."
  - q: "Which scoring cards should you use for your first game of Cascadia?"
    a: "The rulebook recommends the A cards, one for each animal. After that, draw one card per animal at random. For young or brand-new players, the Family variant card scores every animal the same simple way."
  - q: "How do the habitat bonuses work in Cascadia?"
    a: "With three or four players, the largest corridor of each habitat earns 3 bonus points and the second largest earns 1. If two players tie for largest, each gets 2 and nobody scores second. With two players, the largest earns 2, and a tie gives 1 each."
teachSheet:
  goal: "Score the most points by arranging wildlife in the patterns on the scoring cards and growing big habitat corridors."
  setup:
    - "Put all the wildlife tokens in the bag and shake it."
    - "Shuffle 20 habitat tiles per player, plus 3, into face-down stacks."
    - "Lay out one scoring card per animal. First game: the A cards."
    - "Give each player a random starter habitat tile, face up."
    - "Reveal 4 habitat tiles; pair each with a token drawn from the bag."
    - "Put the nature tokens within reach and choose a first player."
  turn:
    - "Four matching tokens are wiped. Three matching: you may wipe them, once."
    - "Optional: spend a nature token to take any tile and any token, or wipe tokens."
    - "Take one tile and the token paired with it."
    - "Place the tile touching your environment. No stacking, no moving."
    - "Place the token on an empty tile showing that animal, or return it."
    - "Matching token on a keystone tile: take a nature token."
    - "Refill the gaps in the display from the stacks and the bag."
  scoring:
    - "Each animal scores by the pattern on its card."
    - "Each habitat: 1 point per tile in your largest corridor."
    - "3 or 4 players: largest corridor +3, second largest +1."
    - "Two tied for largest get 2 each; nobody scores second."
    - "Three or four tied for largest: 1 each. A tie for second scores 0."
    - "2 players: largest corridor +2; a tie gives 1 each."
    - "Each unspent nature token: 1 point."
  endGame: "The game ends when a taken tile cannot be replaced, so everyone plays exactly 20 turns. Most points wins; ties go to most nature tokens."
  tips:
    - "Build toward two or three animals; twenty turns cannot feed all five."
    - "Grow one big corridor per habitat instead of scattered patches."
    - "A kept nature token is 1 point; spend it only for more."
