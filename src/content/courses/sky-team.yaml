faq:
  - q: "Can you talk while playing Sky Team?"
    a: "Only before the dice are rolled. Each round opens with a strategy talk, but you may not discuss dice values. Once you roll, both players stay silent until all 8 dice are placed, except to point out a rules mistake."
  - q: "How do you win Sky Team?"
    a: "At the end of the final round, four things must be true: no Airplane tokens left on the Approach Track, every Landing Gear and Flaps switch showing green, the plane level on the Axis, and your Engines total lower than the Brake marker."
  - q: "How do coffee tokens work in Sky Team?"
    a: "Placing a die on a Concentration space earns a Coffee token, up to 3 at a time. When you place a die, you can spend tokens to raise or lower it by 1 each, but never below 1 or above 6. Either player can spend them, and unspent tokens carry over to the next round."
  - q: "What happens if you reach the airport too early in Sky Team?"
    a: "You go into a holding pattern. Keep playing rounds without moving forward, which means keeping your Engines total below the blue Aerodynamics marker. If you ever have to move forward from the airport space, you overshoot and lose."
  - q: "Do you need all the brakes in Sky Team?"
    a: "No. The Pilot deploys them in order, the 2, then the 4, then the 6, and only as many as your landing speed needs. In the final round your Engines total must be lower than the Brake marker, so with no brakes at all you cannot land."
  - q: "Can you play Sky Team with more than two players?"
    a: "No. Sky Team is made for exactly two: one Pilot and one Co-Pilot. Each player has 4 dice and their own color of spaces on the Control Panel."
teachSheet:
  goal: "Land the plane together in round 7: traffic cleared, gear and flaps down, wings level, and speed under the brakes."
  setup:
    - "Sit side by side. Pilot takes the blue side and 4 blue dice; Co-Pilot, orange."
    - "Axis arrow points straight up. All 10 Switches cover their green lights."
    - "Blue Aerodynamics marker between 4 and 5; orange between 8 and 9."
    - "Red Brake marker to the left of the 2 on the Brake track."
    - "Altitude Track, green and yellow side, at 6000. A Reroll token on each Reroll icon."
    - "Montreal (YUL) Approach Track in its slot. An Airplane token on every Traffic icon."
    - "Coffee tokens beside the board, not on it. Each player takes a screen."
    - "First game: leave the closed compartment and the Flight Log booklet in the box."
  turn:
    - "Talk strategy, never dice. Then roll your 4 dice behind your screen. Silence from here."
    - "Take turns placing 1 die on a free space of your color. The altitude arrow says who starts."
    - "Each player must place 1 die on the Axis and 1 on the Engines every round."
    - "Axis: the plane tilts toward the higher die, 1 mark per point of difference."
    - "Engines: total below the blue marker, stay. Between markers, move 1. Above orange, move 2."
    - "Radio: a die of N removes a plane from space N, counting your own space as 1."
    - "Gear (Pilot), Flaps (Co-Pilot, in order), and Brakes (Pilot, 2, 4, 6) each move a marker."
    - "All 8 dice placed: talk again, drop 1,000 feet, and take back your dice."
  scoring:
    - "No points. You land together or crash together."
    - "Coffee: any die on Concentration earns 1, up to 3. Spend one to shift the die you place by 1."
    - "Reroll: take the token at its altitude. Spending it lets both players reroll once."
    - "To land: no Airplane tokens left on the Approach Track."
    - "To land: all 3 Landing Gear and all 4 Flaps switches show green."
    - "To land: the Axis is level, and the final Engines total is below the Brake marker."
    - "Crash: the Axis hits an X, or the Axis or Engines miss a die."
    - "Crash: moving forward with planes in your space, overshooting the airport, or arriving late."
  endGame: "The final round starts when the airport shows in the position screen and the airplane in the altitude screen. Arrive early and you circle without moving. In the final round, Engines are compared to the Brakes; meet all four landing conditions to win."
  tips:
    - "Settle the Axis early. Leaving it for both last dice is how planes spin."
    - "Every die you place is a message. Ask what your partner will read from it."
    - "Need speed? Hold the Flaps. Need to stay put? Lower the Landing Gear."
diagramAlt: "Sky Team setup, drawn as a simple map of the Control Panel. Above it, the Montreal Approach Track with Airplane tokens and the Altitude Track at 6000 with a Reroll token. On the Pilot's side: one Radio space and three Landing Gear spaces. On the Co-Pilot's side: two Radio spaces and four Flaps spaces, used in order. In the middle: the Axis disc with one space on each side, the speed gauge with both Aerodynamics markers, the two Engines spaces, the Brake track with its marker left of the 2, the three Brakes spaces, and three shared Concentration spaces beside the empty Coffee spaces. The Pilot sits on the left and the Co-Pilot on the right, each with 4 dice and a screen, and the Coffee reserve waits beside the board."
