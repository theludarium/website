faq:
  - q: "How many players does 7 Wonders need?"
    a: "The current edition of 7 Wonders plays 3 to 7. For two players, the publisher makes 7 Wonders Duel, a separate game built for exactly two, with its own cards and three ways to win. It has its own free course on this site."
  - q: "What is the difference between 7 Wonders and 7 Wonders Duel?"
    a: "In 7 Wonders, 3 to 7 players pick a card from their hand at the same time and pass the rest. In Duel, two players take turns choosing cards from a shared layout and can win early through military or science. This course covers 7 Wonders; Duel has its own course."
  - q: "Who can you buy resources from in 7 Wonders?"
    a: "Only your two neighbors, the players directly to your left and right. Each resource costs 2 coins, paid to that neighbor (some yellow cards cut that to 1), and you can buy only what their brown cards, grey cards, and Wonder board's starting resource produce."
  - q: "How does science scoring work in 7 Wonders?"
    a: "Each of the three science symbols scores its count squared: 1, 4, 9, 16, and so on. Every complete set of three different symbols scores 7 more points on top."
  - q: "Which way do you pass cards in 7 Wonders?"
    a: "To the left in Ages I and III, and to the right in Age II. The back of every Age card shows the direction. On the sixth turn of each Age you play one of your last 2 cards and discard the other."
teachSheet:
  goal: "Have the most points after three Ages of building your city."
  setup:
    - "Each player takes a random Wonder board, Day side up for a first game."
    - "Put 3 coins on each board. Other coins and the Conflict tokens go in the middle."
    - "Keep only the Age cards marked for your player count or fewer."
    - "Shuffle random guilds into Age III: the number of players plus 2."
    - "At the start of each Age, shuffle its deck and deal 7 cards to each player."
  turn:
    - "Everyone picks 1 card from their hand at the same time."
    - "Build it, tuck it under your next Wonder stage, or sell it for 3 coins."
    - "Missing a resource? Buy it from a neighbor for 2 coins."
    - "Pass the rest: left in Ages I and III, right in Age II."
    - "Sixth turn: play 1 of your last 2 cards and discard the other."
    - "Chains: own the card a symbol points to, and the new card is free."
  scoring:
    - "Military: beat a neighbor for 1, 3, or 5 by Age; lose for minus 1."
    - "Coins: 1 point per 3."
    - "Wonder stages, blue, yellow, and purple cards: as printed."
    - "Science: each symbol's count squared, plus 7 per set of three different."
  endGame: "The game ends after the Age III battles. Most points wins; most coins breaks a tie, then players share the win."
  tips:
    - "Take resources in Age I; everything later costs them."
    - "Watch your neighbors: you trade with them, fight them, and feed them cards."
    - "Before passing, check what your next neighbor needs."
diagramAlt: "7 Wonders setup for four players: the Age I, II, and III decks, a discard space, the coin reserve, and the Conflict tokens in the middle of the table, and each player's Wonder board, Day side up, with a starting resource and 3 coins on it. Your left and right neighbors are marked; Ages I and III pass left, Age II passes right."
