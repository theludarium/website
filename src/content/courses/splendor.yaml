faq:
  - q: "Can you take two gems of the same color in Splendor?"
    a: "Yes, but only if at least 4 gems of that color are in the supply before you take them. You can never take Gold this way; Gold comes only from reserving a card."
  - q: "How do nobles work in Splendor?"
    a: "At the end of your turn, if the bonuses on your development cards meet a noble's requirement, you take that noble and its 3 prestige points. It is not an action. Gem pieces do not count, and you can take only 1 noble per turn."
  - q: "Can you have more than 10 gems in Splendor?"
    a: "Only during your turn. At the end of your turn, if you hold more than 10 pieces, Gold included, you return pieces of your choice to the supply until you have 10."
  - q: "What happens when someone reaches 15 points in Splendor?"
    a: "The end is triggered, but the game does not stop at once. Play continues until everyone has had the same number of turns, so the player to the right of the First Player takes the last turn. Then most points wins."
  - q: "Can you reserve a card from the deck in Splendor?"
    a: "Yes. Instead of a face-up card, you can take the top card of any of the three decks without showing it. You still take 1 Gold if any are left, and you can hold at most 3 reserved cards."
  - q: "Who wins a tie in Splendor?"
    a: "The tied player who bought the fewest development cards wins. Nobles do not count as cards. If that is still tied, the tied players share the victory."
teachSheet:
  goal: "Score the most prestige points by buying development cards and attracting nobles; reaching 15 starts the end."
  setup:
    - "Shuffle each level's deck. Stack them face down in a column, level 1 at the bottom."
    - "Reveal 4 cards from each deck in a row beside it."
    - "Reveal nobles, one more than the number of players, in a row above the cards."
    - "Sort the pieces into 6 stacks: five gem colors and Gold."
    - "3 players: remove 2 of each gem. 2 players: remove 3 of each. Gold stays at 5."
    - "The youngest player takes the First Player marker. Play goes clockwise."
  turn:
    - "Do exactly 1 action."
    - "Take 3 gems of different colors. Never Gold."
    - "Or take 2 gems of one color, only if 4 or more are in the supply."
    - "Or reserve 1 card, face up or from a deck top, and take 1 Gold."
    - "Or buy 1 card from the table or your hand; spent pieces go back."
    - "Refill the table from the matching deck."
    - "End of turn: return pieces down to 10, and take 1 noble if you qualify."
  scoring:
    - "Each card shows its prestige points in the top left corner."
    - "Each card gives a permanent bonus: 1 gem of its color off future purchases."
    - "Gold is wild and stands in for any gem."
    - "Each noble is worth 3 points. Only card bonuses count toward nobles."
    - "Hold at most 3 reserved cards. They score nothing until bought."
  endGame: "When a player ends a turn with 15 or more points, finish the round so everyone has equal turns. Most points wins; ties go to fewest cards."
  tips:
    - "Buy cheap level 1 cards early; bonuses beat points in the first turns."
    - "Build two or three colors that the nobles and level 3 cards want."
    - "Before you reach 15, check what everyone after you can score."
diagramAlt: "Splendor setup for four players: three face-down development decks in a column with level 1 at the bottom, four face-up cards beside each deck, five noble tiles in a row above the cards, the supply of six stacks (7 each of Diamond, Sapphire, Emerald, Ruby, and Onyx, plus 5 Gold), and the First Player marker."
