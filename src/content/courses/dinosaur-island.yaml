faq:
  - q: "How do you win Dinosaur Island?"
    a: "Have the most victory points after final scoring. Points come from patrons each round, plus attractions, dinosaur exhibits, completed objectives, and leftover money at the end. If players tie, the one with more money left wins."
  - q: "When does Dinosaur Island end?"
    a: "The game ends when only one objective card is left unclaimed. Finish the round, then score. You choose short, medium, or long objectives at setup, which sets roughly how long the game runs."
  - q: "What happens when threat is higher than security in Dinosaur Island?"
    a: "Dinosaurs get loose. In the Park Phase, for each point your threat beats your security, one visitor is eaten, patrons before hooligans, and you lose 1 VP for each. Your threat that round includes the threat pips on the die in the holding area."
  - q: "Can you play Dinosaur Island solo?"
    a: "Yes. The base game has solo rules with 16 solo objective cards and a small AI deck that removes dice and market items each round. You play seven rounds, and objectives score more the earlier you finish them."
  - q: "What does the Totally Liquid expansion add?"
    a: "Totally Liquid adds a fifth player and several modules, including water dinosaurs, secret blueprints, executive workers, new facilities, and a Mega Rex. You need the base game to play it."
teachSheet:
  goal: "Have the most VPs after final scoring: patrons, attractions, exhibits, objectives, and money."
  setup:
    - "Boards in the middle. Bank, dinosaurs, paddocks, and modifier tokens to the side. Visitors in the bag."
    - "Dice pool: 2 dice per player, plus 1. Return the rest to the box."
    - "Fill market rows $2 to $5: one attraction, lab upgrade, and specialist each."
    - "Flip the top recipe of each stack. Reveal objectives equal to players plus 1."
    - "Draw 2 plot twists. First game: the hooligan plot twist."
    - "Each player: lab and park boards, 4 workers, 3 scientists, 1 dinosaur in the starting paddock."
    - "Cold storage limits 4 basic, 2 advanced. Start with 1 of each basic DNA."
    - "Excitement 1, score 10, threat 1, security 1. Cash: $15, then $1 more per seat."
  turn:
    - "Research: roll dice. Place scientists one at a time: DNA, cold storage, recipe, or pass."
    - "Leftover die with the most threat pips goes to the holding area."
    - "Market: two actions each. Hire, build, buy an upgrade, buy DNA, or pass for $2."
    - "Workers, all at once: refine DNA, create dinosaurs, raise security, upgrade paddocks."
    - "Park: draw visitors equal to excitement. $1 per patron. Place hooligans first."
    - "Threat plus holding die over security? That many visitors eaten, 1 VP lost each."
    - "Score 1 VP per patron at an attraction or exhibit. Food attractions may pay $2 instead."
    - "Cleanup: fewest VPs goes first next round. Refresh market and recipes. Visitors back in the bag."
  scoring:
    - "Each round: 1 VP per surviving patron at an attraction or exhibit."
    - "Each visitor eaten: minus 1 VP."
    - "End: each attraction scores its listed VPs."
    - "End: each exhibit scores its VP value times its dinosaurs. Empty exhibit: minus 10."
    - "End: each claimed objective scores its value, 6 to 8 VPs."
    - "End: every $5 left is 1 VP. Ties go to the most money."
  endGame: "When only one objective is left unclaimed, finish the round, then do final scoring."
  tips:
    - "Never leave an exhibit empty at the end. It costs 10 VPs."
    - "The holding die is known before the Worker Phase. Buy the security it calls for."
    - "An eaten patron usually costs 2 VPs: the penalty and the point it would have scored."
diagramAlt: "Dinosaur Island setup: the research center with DNA dice, three face-up recipes that need a level 1, 2, or 3 scientist, and cold storage slots; the marketplace with rows priced $2 to $5, each holding an attraction, a lab upgrade, and a specialist; the track board with excitement at 1 and score at 10; objective cards and 2 plot twists; and the supply. Below, a player's lab with cold storage limits of 4 basic and 2 advanced, threat and security at 1, 3 scientists and 4 workers; a spot for up to 3 specialists; and a park with 1 dinosaur in the starting exhibit."
