promise: "Learn what a Cube is, draft and build a deck with confidence, host a night your friends ask to repeat, and start a Cube of your own."
description: "A free course on Magic: The Gathering Cube draft: how a draft works, how to pick, building your deck, hosting a draft night, and building your own Cube."
audience:
  - "Magic players who want a format where nobody buys packs and every pick matters."
  - "Friends who want a regular game night built around one shared box of cards."
  - "Newer players who know a little Magic and want a welcoming first draft."
  - "Collectors and tinkerers curious about building a Cube of their own."
afterLesson3: "Explain what a Cube is, follow a draft from the first pick to the last, read every part of a card, and make sound early picks."
afterLesson8: "Host a Cube draft night, build a solid 40-card deck, be a welcome guest at any Cube, start your own, and find drafts locally and online."
faq:
  - q: "What is a Cube draft in Magic: The Gathering?"
    a: "A Cube is a set of hand-picked Magic cards, usually 360 or more, that one owner keeps for drafting. Players deal it into packs of 15, draft them like booster packs, build 40-card decks, and play. At the end of the night, every card goes back in the box."
  - q: "Do you keep the cards you draft in a Cube?"
    a: "No. The Cube belongs to its owner, and every card goes back into it when the night ends. That is why a Cube draft usually costs the players nothing to join."
  - q: "How many cards are in a Cube?"
    a: "Eight drafters with three packs of 15 use 360 cards, so 360 is the classic size. Larger Cubes of 450 or 540 cards change what shows up each night. A 180-card Cube works well for four players."
  - q: "How many lands should a Cube deck play?"
    a: "The rules only require at least 40 cards, and basic lands are free to add. Most Cube drafters play 17 lands and 23 spells, and fewer lands only when the deck's spells are very cheap."
  - q: "Can you Cube draft with fewer than eight players?"
    a: "Yes. Four to seven players can draft three packs of 15 each as usual, since each pack simply comes around more often, and two players can use formats such as Winston draft or Grid draft. Eight is the classic count because 360 cards divide evenly."
  - q: "Are proxies allowed in a Cube?"
    a: "In a casual Cube, that is the owner's call, and it should be said out loud before anyone drafts. Player-made proxies are not legal in sanctioned tournaments, and a fake made to pass as a real card is a counterfeit. Lesson 7 covers the details."
teachSheet:
  goal: "Draft a deck from one shared box of cards, then beat the other drafters with it. Nobody keeps the cards."
  setup:
    - "Before guests arrive, shuffle the Cube and deal three packs of 15 per seat: 24 for eight drafters."
    - "Seat drafters at random. Put basic lands, dice, and tokens within reach."
    - "Draft: take one card, pass the rest. Pack 1 left, pack 2 right, pack 3 left."
    - "Keep picks face down. Talk about anything but the cards in the packs."
    - "Build at least 40 cards. Basic lands are free; most decks play 17."
    - "Every drafted card you do not play is your sideboard."
    - "Pair players. Shuffle, start at 20 life, and draw 7 cards."
    - "Mulligan: reshuffle, draw 7, then bottom 1 card for each mulligan taken."
  turn:
    - "Untap your cards. Draw a card; the first player skips this draw on turn one."
    - "Main phase: play one land per turn and cast creatures and other spells."
    - "Combat: you choose attackers, your opponent chooses blockers. Unblocked creatures hit the player."
    - "A new creature cannot attack until your next turn, unless it has haste."
    - "Second main phase: play your land if you have not yet, or cast spells you held back."
    - "Instants and some abilities can be used on either player's turn."
    - "End of turn: discard down to seven cards in hand."
  scoring:
    - "Everyone starts at 20 life."
    - "You lose at 0 life, or when you must draw from an empty library."
    - "Matches are best of three games."
    - "The loser of a game chooses who plays first in the next one."
    - "Between games, swap cards freely with your sideboard."
    - "Play two or three rounds: random pairings, or winners play winners."
  endGame: "The night ends after the last round. Every card goes back into the Cube, sorted, ready for next time."
  tips:
    - "Draft two colors and play 17 lands in a 40-card deck."
    - "Take cheap removal and two-mana creatures over big, flashy cards."
    - "Return every card sorted, and thank the Cube's owner."
diagramAlt: "An eight-player Cube draft seen from above: eight seats around one table, numbered clockwise from your seat. Packs 1 and 3 pass to the left, clockwise. Pack 2 passes to the right, counterclockwise. A 360-card Cube makes 24 packs of 15, three per drafter, for 45 picks each and a 40-card deck."
