faq:
  - q: "How many turns do you get in Wingspan?"
    a: "You get 8 turns in round 1, 7 in round 2, 6 in round 3, and 5 in round 4, for 26 in all. At the end of each round, one of your action cubes stays on the goal board to mark your score, so you have one fewer cube to play."
  - q: "How much does it cost to play a bird in Wingspan?"
    a: "You pay the food cost in the top left of the card, plus an egg cost set by the column. The first column is free, columns 2 and 3 cost 1 egg, and columns 4 and 5 cost 2 eggs. When you play a bird, any 2 food tokens can stand in for 1 food of any type."
  - q: "When can you reroll the birdfeeder in Wingspan?"
    a: "If every die in the birdfeeder shows the same face, including when only one die is left, you may reroll all 5 dice before you gain food. If the birdfeeder is empty, roll all 5 dice back in."
  - q: "How do ties work for end-of-round goals in Wingspan?"
    a: "On the green side of the goal board, tied players add the points for their place and the next place, divide by the number of tied players, and round down. The next place is not awarded to anyone else."
  - q: "Who wins a tie in Wingspan?"
    a: "The player with the most unused food tokens wins. If players are still tied, they share the victory."
  - q: "Can you play Wingspan solo?"
    a: "Yes. The base game includes the Automa, a solo opponent run by a small deck of cards. You always take the first turn of each round, and the Automa always takes the last."
teachSheet:
  goal: "Score the most points by attracting birds to three habitats and building an engine that grows every round."
  setup:
    - "Shuffle the bird deck. Put 3 birds face up on the bird tray."
    - "Toss the 5 food dice into the birdfeeder. Put food and eggs in a shared supply."
    - "Place the goal board (blue side for new players) and 4 random goal tiles."
    - "Each player takes a mat, 8 cubes, 2 bonus cards, 5 birds, and 5 food (1 of each)."
    - "Keep up to 5 birds, paying 1 food for each bird you keep."
    - "Keep 1 bonus card. Pick a random first player."
  turn:
    - "Place 1 action cube and take 1 of 4 actions."
    - "Play a bird: pay its food cost and the column's egg cost. Use any when played power."
    - "Or gain food (forest), lay eggs (grassland), or draw birds (wetland) from your leftmost open slot."
    - "Then move your cube right to left, using that row's brown powers. All are optional."
    - "Pink powers fire on other players' turns, once between each of your turns."
    - "Refill the bird tray at the end of your turn."
  scoring:
    - "Each bird scores its printed points."
    - "Bonus cards score as printed on the card."
    - "End-of-round goals score as marked on the goal board."
    - "1 point for each egg, each cached food, and each tucked card."
    - "Tie: most unused food tokens wins. Still tied: share the win."
  endGame: "The game ends after round 4. Rounds give 8, 7, 6, then 5 turns, since each round's goal keeps 1 cube."
  tips:
    - "Build early. A bird played in round 1 can fire all game."
    - "Read all four round goals before you play your first bird."
    - "In round 4, eggs are often the most points per turn."
diagramAlt: "Wingspan setup: a shared area with the face-down bird deck, the bird tray holding 3 face-up birds, the birdfeeder with 5 food dice, the goal board with goal tiles for rounds 1 to 4, the bonus card deck, and the food and egg supply. Below, one player's mat with egg costs over its 5 columns (free, 1 egg, 1 egg, 2 eggs, 2 eggs) and empty forest, grassland, and wetland rows, beside that player's 8 action cubes, 5 starting birds and 5 food, 2 bonus cards to choose from, and the first-player token."
