faq:
  - q: "How do farmers work in Carcassonne?"
    a: "A farmer lies down on a field and stays there until the end of the game. At final scoring, each field is worth 3 points for every completed city it touches, and the player with the most farmers on that field scores it. Tied players all score the full points."
  - q: "Can you move a meeple after you place it?"
    a: "No. A meeple stays where you put it until its feature is completed and scored, then it returns to your supply. Farmers never come back during the game."
  - q: "What happens if a tile cannot be placed anywhere?"
    a: "In the current rules, you return that tile to the box and draw a new one. It is rare, but it does happen late in the game."
  - q: "Should you play with farmers in your first game?"
    a: "The rulebook suggests leaving them out until you have played two or three games. If your group learns fast, adding them in game two works well."
  - q: "How many points do incomplete features score at the end?"
    a: "Roads score 1 per tile, cities 1 per tile and 1 per coat of arms, and monasteries 1 plus 1 per surrounding tile. Completed cities score double that during the game."
teachSheet:
  goal: "Score the most points by claiming roads, cities, monasteries, and fields as the map grows."
  setup:
    - "Put the start tile in the middle of the table."
    - "Shuffle the land tiles into face-down stacks everyone can reach."
    - "Each player takes 7 meeples of one color as their supply."
    - "Put each player's 8th meeple on 0 on the scoreboard."
    - "First game: leave the river tiles and abbots in the box."
    - "The youngest player goes first; play passes clockwise."
  turn:
    - "Draw 1 tile and place it so every edge matches the map."
    - "You may place 1 meeple on that tile, on an unclaimed feature."
    - "Score every feature your tile completed, for every player on it."
    - "Return scored meeples to their owners' supplies."
  scoring:
    - "Completed road: 1 point per tile."
    - "Completed city: 2 points per tile and per coat of arms."
    - "Completed monastery: 9 points (itself plus 8 neighbors)."
    - "Most meeples on a feature scores it; ties all score in full."
    - "End: unfinished roads 1 per tile, cities 1 per tile and coat of arms."
    - "End: unfinished monastery 1 plus 1 per neighbor."
    - "End: each field scores 3 per completed city it touches."
  endGame: "The game ends when the last land tile is placed. Do final scoring; most points wins, and ties share the win."
  tips:
    - "Finish small features early so your meeples come back fast."
    - "Never spend your last meeple on a feature that cannot finish."
    - "Count farms before the last few tiles; they swing the game."
