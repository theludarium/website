faq:
  - q: "How do workers work in The Castles of Burgundy?"
    a: "Each worker you return to the supply changes one die by 1, up or down. A 6 can become a 1 and a 1 can become a 6, and you can spend several workers on one die. You can also spend any die to take 2 workers."
  - q: "Can you build the same building twice in one town?"
    a: "No. Each of the eight building types can appear only once in each town, a connected area of beige spaces. Monastery tile 1 lifts that limit for the player who places it."
  - q: "How does the black depot work?"
    a: "Once per turn, at any point in your turn, you may pay 2 silver to take one tile from the black depot in the center of the board. It goes to one of your storage spaces like any other tile. No die is needed."
  - q: "How is turn order decided?"
    a: "By the bridge, the turn order track. Every ship you place moves your piece one space forward, on top of any pieces already there. The player furthest along, and on top of a stack, goes first and takes the white die."
  - q: "Who wins a tie in The Castles of Burgundy?"
    a: "The tied player with the most empty spaces in their duchy wins. If that is also tied, the tied player furthest behind on the bridge wins."
  - q: "Can you play The Castles of Burgundy solo?"
    a: "Yes. The current edition includes solo duchies 13a and 13b. You play 25 rounds against a points target, and you win if you fill all 37 spaces of your duchy in time."
teachSheet:
  goal: "Score the most victory points by filling your duchy, completing regions, raising livestock, and selling goods."
  setup:
    - "Board in the middle. Silver, workers, white die, and hex piles sorted by back color beside it."
    - "Shuffle the goods: 5 face-down stacks of 5 on phases A to E."
    - "Bonus tiles on their spaces, large on top of small."
    - "Everyone uses the same duchy number. Castle on the center dark green space."
    - "Each player: 3 random goods, 1 silver, 2 dice, an overview board, score marker on 0."
    - "Roll for start player. Workers go 1, 2, 3, 4 in clockwise order."
    - "Turn pieces on bridge space 1, start player on top. Start player takes the white die."
  turn:
    - "Each phase: clear leftover hex tiles, refill the depots, lay out 5 goods."
    - "Everyone rolls. The start player rolls white and puts a goods tile on that depot."
    - "In bridge order, each player uses each die for one action."
    - "Take a tile from the depot matching the die, into a storage space."
    - "Place a stored tile on an empty space of its color and number, touching your tiles."
    - "Or sell all goods of the type the die shows, or take 2 workers with any die."
    - "Workers change a die by 1 each. 1 and 6 wrap around."
    - "Once per turn: buy one black depot tile for 2 silver."
  scoring:
    - "Livestock: points for its animals, plus same-type animals on that pasture."
    - "Completed region by size: 1, 3, 6, 10, 15, 21, 28, or 36."
    - "Plus a phase bonus per region: 10, 8, 6, 4, 2 in phases A to E."
    - "First to fill a color: large bonus tile. Second: small bonus tile."
    - "Selling goods: 1 silver, plus 2, 3, or 4 points per tile by player count."
    - "Watchtower: 4 points. Some monasteries score at the end."
    - "End: 1 point per unsold good and per silver, 1 per 2 workers."
  endGame: "The game ends after phase E, 25 rounds in all. Most points wins; a tie goes to the most empty duchy spaces."
  tips:
    - "Keep a worker or two in hand so no roll is ever wasted."
    - "Close small regions early. The phase bonus shrinks every phase."
    - "Ships pay twice: goods to sell, and an earlier turn next round."
diagramAlt: "The Castles of Burgundy setup for four players. The game board shows face-down goods stacks on phases A to E, six numbered depots around the black depot, the bridge with every turn piece stacked on space 1, the bonus tiles, and every score marker on 0. Beside it are the supply of silver coins, workers, and the white die, and face-down hex tile piles sorted by color. Below are two player areas, each with a duchy board, a castle on the center space, 3 goods, 1 silver, 2 dice, workers, tile storage, and an overview board."
