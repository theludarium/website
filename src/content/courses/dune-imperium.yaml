faq:
  - q: "What is the difference between Dune: Imperium and Uprising?"
    a: "Uprising is a standalone game on the same engine. It drops the Mentat, reworks the board, and adds spies, optional CHOAM contracts, sandworms that double Conflict rewards, and a six-player team mode. If you know one, the other takes a few minutes to learn."
  - q: "Do you need Dune: Imperium to play Uprising?"
    a: "No. Dire Wolf calls Uprising a stand-alone expansion, and the box has everything you need. Its rules also explain how to mix in content from the original game and its expansions."
  - q: "How many troops can you send to a Conflict in Dune: Imperium?"
    a: "Only when you send an Agent to a Combat space. Then you may deploy any troops you recruited that turn, plus up to two from your garrison. Troops recruited anywhere else go to your garrison and wait."
  - q: "What happens when players tie in a Conflict?"
    a: "If players tie for first, nobody wins the Conflict and each tied player takes the second reward. Players tied for second each take the third reward. A tie for third gets nothing."
  - q: "When does Dune: Imperium end?"
    a: "Check at the end of every round. If anyone has 10 or more Victory Points, or the Conflict deck is empty, players use any Endgame Intrigue cards and the most points wins. Ties go to spice, then Solari, water, and garrisoned troops."
  - q: "How does the six-player mode in Uprising work?"
    a: "Two teams of three. Each team has a Commander, Muad'Dib or Shaddam Corrino IV, who has no troops and activates an Ally on each turn. Allies fight in Conflicts separately, and the team with the highest combined score wins."
teachSheet:
  goal: "Earn Victory Points through Conflicts, Influence, and Alliances; the game ends at the end of the round someone reaches 10."
  setup:
    - "Conflict deck: 4 Conflict III on the bottom, 5 Conflict II, then 1 Conflict I on top."
    - "Deal 5 Imperium cards face up as the Imperium Row. Set out the Reserve and Intrigue decks."
    - "Each player takes a Leader, a shuffled 10-card starting deck, and 1 water."
    - "Put 2 Agents on your Leader and your Swordmaster beside the board."
    - "Put 3 troops in your garrison and a cube at the bottom of each Influence track."
    - "Score marker on 0, or on 1 in a four-player game. Choose a first player at random."
    - "Uprising: also take 3 Spies and an Objective card. There is no Mentat."
  turn:
    - "Round start: reveal a Conflict card, then everyone draws 5 cards."
    - "Agent turn: play a card and send an Agent to an empty space with a matching icon."
    - "Pay the space's cost, then use its effect and the card's Agent box."
    - "Combat space: deploy troops recruited this turn plus up to 2 from your garrison."
    - "Reveal turn: reveal your hand, use the Reveal boxes, spend Persuasion on new cards."
    - "Strength: 2 per troop in the Conflict, 1 per sword. Uprising sandworms add 3."
    - "Combat: play Combat Intrigue cards, then pay rewards by strength."
    - "Makers: 1 spice on each empty Maker space. Recall Agents and pass first player."
  scoring:
    - "2 Influence with a Faction: 1 Victory Point. Drop below 2 and you lose it."
    - "First to 4 Influence takes that Alliance token and its point, until someone passes them."
    - "Conflicts: top reward to the strongest, second to the next. Third reward at 4 or 6 players."
    - "Ties: tied for first take the second reward; tied for second take the third."
    - "The Spice Must Flow: 1 Victory Point the moment you acquire it."
    - "Uprising: a sandworm in the Conflict doubles your rewards."
    - "Uprising: two matching battle icons score 1 Victory Point."
  endGame: "At the end of a round, if anyone has 10 or more Victory Points or the Conflict deck is empty, play Endgame Intrigue cards. Most points wins; ties go to spice, then Solari, water, and garrisoned troops."
  tips:
    - "Buy cards for their Agent icons as well as their effects."
    - "Deploy late when you can: the last player to commit knows the most."
    - "Watch the Alliance races; one step on a track can swing two points."
diagramAlt: "Dune: Imperium setup: the game board with every player's cube at the bottom of the four Influence tracks and an Alliance token on each 4 space, three troops in each garrison around the Conflict area, the 10-card Conflict deck, the Mentat, and the score track. Below the board sit the Imperium deck, the five-card Imperium Row, the Intrigue deck, and the Reserve stacks. Each player has a Leader with two Agents, a 10-card deck, 1 water, and a Swordmaster beside the board."
