faq:
  - q: "What happens when you flip 7 in Flip 7?"
    a: "Getting seven different number cards in your row ends the round at once, for everyone. You score your cards plus a 15-point bonus. Modifier and action cards do not count toward the seven, but the 0 does."
  - q: "How does Flip Three work in Flip 7?"
    a: "The player who gets it must take the next three cards, one at a time, stopping early only on a bust or a Flip 7. A Second Chance that turns up can be used right away. A Freeze or another Flip Three waits until all three cards are flipped."
  - q: "Can you play a Freeze card on yourself?"
    a: "Yes. Action cards can go to any active player, yourself included. Freezing yourself banks your points and takes you out of the round. The last active player must use a Freeze or Flip Three on themself."
  - q: "Does the x2 card double the Flip 7 bonus?"
    a: "No. The x2 doubles only the total of your number cards. Add your other modifiers after doubling, then the 15-point bonus if you flipped 7."
  - q: "How many players can play Flip 7?"
    a: "The box says 3 or more. The rulebook recommends a second deck for more than 18 players. With two or fewer, it suggests a challenge: count how many rounds it takes you to reach 200."
  - q: "When should you stay in Flip 7?"
    a: "Count the cards that can bust you: each number from 1 to 12 in your row has its value minus one copies left. In a fresh deck, staying once your row reaches about 20 to 25 points gives the best average round. Near the end, play the score gap instead."
teachSheet:
  goal: "Have the most points when someone reaches 200, by flipping cards each round and stopping before a number repeats."
  setup:
    - "Shuffle all 94 cards thoroughly into one face-down deck."
    - "Grab a pen and paper, or the publisher's scoring web app."
    - "Choose a dealer for the first round."
    - "More than 18 players: add a second deck."
    - "The dealer deals 1 card face up to each player, themself included."
    - "Action card during the deal? Pause and resolve it, then keep dealing."
    - "After each round, set used cards aside and pass the deck left to the new dealer."
  turn:
    - "On your turn, Hit (take a card) or Stay (bank your points and leave the round)."
    - "Number cards go in one row; modifier and action cards go above it."
    - "Flip a number already in your row and you bust: 0 points this round."
    - "You can Stay only with at least one card in front of you."
    - "Action card: give it to any active player, yourself included."
    - "Freeze: that player banks their points and is out of the round."
    - "Flip Three: that player takes the next 3 cards, one at a time."
    - "Second Chance: keep it. It cancels one duplicate; discard both."
  scoring:
    - "Add up your number cards."
    - "x2 card: double that total."
    - "Then add any +2 to +10 modifiers."
    - "Flip 7 (seven different numbers): add 15 bonus points."
    - "Busted: 0 points for the round."
    - "Modifiers and action cards never count toward the seven."
  endGame: "A round ends when everyone has stayed or busted, or the moment someone flips 7. After a round where anyone has 200 or more, the highest score wins. Tied? Everyone keeps playing rounds until there is one winner."
  tips:
    - "Each number has that many copies, so 12s bust you most often."
    - "Freeze yourself to lock in a big row without another flip."
    - "Aim Flip Three at a long row, unless that player is one number from Flip 7."
