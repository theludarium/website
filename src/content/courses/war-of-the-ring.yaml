levels:
  - level: 0
    name: "Traveler"
    label: "Learn to play"
    outcome: "Set up, teach, and finish a game of War of the Ring with the turn, the Hunt, and battles played right."
  - level: 1
    name: "Scout"
    label: "Beginner"
    outcome: "Avoid the rules slips most new tables make, and play either side toward one of the four victory conditions on purpose."
  - level: 2
    name: "Captain"
    label: "Intermediate"
    outcome: "Spend every action die with intent, and run or survive the Hunt for the Ring knowing the odds of each move."
