faq:
  - q: "How many destination tickets do you keep in Ticket to Ride?"
    a: "In the current edition you are dealt 4 tickets at the start and must keep at least 2. Older printings deal 3 and you keep at least 2. When you draw tickets during the game, you draw 3 and keep at least 1."
  - q: "Can you take two locomotives in one turn in Ticket to Ride?"
    a: "Only if both come blind from the top of the deck. A face-up locomotive must be the first card you take, and then you take no second card. A locomotive drawn blind counts as one card, so you still draw your second."
  - q: "What happens when a player gets down to two trains?"
    a: "When a player ends their turn with 0, 1, or 2 trains left, every player, including that player, gets one final turn. Then the game ends and you score tickets and the longest path."
  - q: "Can both double routes be used in a two-player game?"
    a: "No. With 2 or 3 players, only one route of each double pair can be claimed, and the other closes. With 4 or 5 players both can be used, but never by the same player."
  - q: "Do you lose points for tickets you do not finish?"
    a: "Yes. At the end, every ticket you kept adds its value if you connected both cities with your own trains, and subtracts its value if you did not."
teachSheet:
  goal: "Score the most points by claiming routes, completing your tickets, and building the longest path."
  setup:
    - "Put the board in the middle. Every scoring marker starts on 0."
    - "Each player takes 45 trains of one color."
    - "Deal 4 train cards to each player."
    - "Turn 5 train cards face up. If 3 or more are locomotives, discard all 5 and deal 5 new."
    - "Put the longest path bonus card next to the board."
    - "Deal 4 tickets each. Keep at least 2. Older boxes deal 3."
    - "Pick a first player any way you like. Play goes clockwise."
  turn:
    - "Do exactly one: draw train cards, claim a route, or draw tickets."
    - "Draw cards: take 2, face up or blind from the deck."
    - "A face-up locomotive must be your first card, and it is your only card."
    - "Claim: play cards matching the route's color and length, then place your trains."
    - "Gray routes take any one color. Locomotives are wild."
    - "With 2 or 3 players, only one route of each double pair can be claimed."
    - "Draw tickets: take 3, keep at least 1, return the rest to the bottom."
  scoring:
    - "Routes score when claimed: 1, 2, 4, 7, 10, or 15 points for 1 to 6 trains."
    - "Each kept ticket you completed adds its value."
    - "Each kept ticket you did not complete subtracts its value."
    - "Longest continuous path scores 10. Tied players all score it."
    - "Tie for the win: most completed tickets, then the longest path card."
  endGame: "When a player ends a turn with 2 or fewer trains, everyone, that player included, gets one final turn. Then reveal tickets and score."
  tips:
    - "Keep tickets that share cities, so one network pays twice."
    - "Claim the routes others want first. Draw cards for the safe ones."
    - "Stop drawing new tickets once anyone is down to about 12 trains."
diagramAlt: "Ticket to Ride setup: the board in the middle with every scoring marker on 0, the face-down train deck with 5 train cards face up beside it, the ticket deck and the longest path bonus card next to the board, and each player's 45 trains, 4 train cards, and 4 tickets."
