faq:
  - q: "Can you heal while you are in Tokyo?"
    a: "No. Heal results do nothing while you are in Tokyo, though Power cards can still give you Life. Outside Tokyo, each Heal result gives you 1 Life, up to your maximum of 10."
  - q: "When can you leave Tokyo in King of Tokyo?"
    a: "Only right after another Monster wounds you with Smash results. You still lose the Life, then you may Yield, and the Monster that hit you enters Tokyo. Life lost to a Power card effect does not let you Yield."
  - q: "How do you score points with the dice in King of Tokyo?"
    a: "Number faces score only in sets of three or more. Three 1s score 1 point, three 2s score 2, and three 3s score 3. Each extra matching die adds 1 more point."
  - q: "How do you play King of Tokyo with 2 players?"
    a: "The rulebook offers an optional 2-player rule. Entering Tokyo gives you 1 Energy instead of 1 point, and starting your turn there gives you 1 Energy instead of 2 points. Everything else stays the same."
  - q: "What is Tokyo Bay?"
    a: "A second space in Tokyo, used only with 5 or 6 players. It works just like Tokyo City. Once 4 or fewer Monsters remain, the Monster in Tokyo Bay leaves at once, or moves to Tokyo City if it is empty."
  - q: "What happens when a Monster is eliminated?"
    a: "At 0 Life your Monster is out of the game, and its Keep cards and Energy cubes are discarded. If every Monster is eliminated at the same time, everyone loses."
teachSheet:
  goal: "Be the first Monster to reach 20 Victory Points, or be the last Monster standing."
  setup:
    - "Each player picks a Monster, takes its board and figure, and sets Life to 10 and points to 0."
    - "Put the Tokyo board in the middle. With 2 to 4 players, use only Tokyo City."
    - "With 5 or 6 players, use both Tokyo City and Tokyo Bay."
    - "Shuffle the Power cards into a deck. Deal 3 face up beside the board."
    - "Make a pool of Energy cubes. Put the tokens nearby."
    - "Put the 6 black dice in the middle. Set the 2 green dice aside."
    - "Everyone rolls the black dice. Whoever rolls the most Smash results goes first. Play passes clockwise."
  turn:
    - "Roll all 6 black dice. Keep any you like and reroll the rest, up to two more times."
    - "Resolve every die, in any order you like."
    - "Numbers: three of a kind scores that number. Each extra match adds 1."
    - "Energy: take 1 cube each. Heal: gain 1 Life each, but only outside Tokyo."
    - "Smash: in Tokyo, wound everyone outside. Outside, wound whoever is in Tokyo."
    - "Wounded by Smash while in Tokyo? You may Yield and leave. You still lose the Life."
    - "Enter Tokyo: if Tokyo is empty, you must move in."
    - "Buy face-up Power cards with Energy. You may also pay 2 to sweep all three. Pass the dice left."
  scoring:
    - "Three 1s: 1 point. Three 2s: 2 points. Three 3s: 3 points."
    - "Each extra die that matches a scoring set: 1 more point."
    - "Enter Tokyo: 1 point."
    - "Start your turn in Tokyo: 2 points."
    - "Some Power cards score points too. Read each one aloud when it is bought."
    - "Life never goes above 10 unless a Keep card says so. At 0 Life, your Monster is out."
  endGame: "The game ends at the end of a turn when a Monster has 20 points or only one Monster is left. You must survive your turn to win."
  tips:
    - "Tokyo pays points but blocks healing. Yield before your Life runs low."
    - "Do not ignore Energy. Power cards are how Monsters pull ahead."
    - "Watch the leader. A Monster at 17 or more can win on one good turn."
diagramAlt: "King of Tokyo setup: the Tokyo board in the middle with Tokyo City and Tokyo Bay, used only with 5 or 6 players. Below it, the six black dice and the two green dice set aside. The Power card deck with three cards face up, the tokens, the Energy cube pool, and a Monster board at each corner with Life at 10 and Victory Points at 0."
