faq:
  - q: "How does scoring work in Ark Nova?"
    a: "Your appeal counter climbs one track while your conservation counter climbs toward it from the other end. At the end, add your appeal to the small number printed on your conservation space. Each conservation point counts for 2 appeal up to 10 points, then 3 each after that."
  - q: "When does Ark Nova end?"
    a: "When any player's appeal and conservation counters sit in the same scoring area or pass each other. If that happens at the end of your turn, every other player takes one more turn and you do not. If it happens during a break, everyone takes one more turn."
  - q: "How do the action cards work in Ark Nova?"
    a: "You have five action cards in slots numbered 1 to 5, and the slot number is the action's strength. After you use a card, it moves to slot 1 and the cards that were to its left slide one slot right. Actions you leave alone never lose strength and usually climb while they wait."
  - q: "Which zoo map should you use in your first game?"
    a: "Map A. All four copies are identical and give a generous start. Move to Map 0 after your first game, then to the advanced maps 1 to 8, which each have their own special ability."
  - q: "Can you play Ark Nova solo?"
    a: "Yes. The rulebook has solo rules: there is no Break token, a solo tile times the breaks, and you start at 20 appeal. You win with at least 100 points. Starting at 10 or 0 appeal makes it harder."
  - q: "Is there an Ark Nova world championship?"
    a: "Yes. Feuerland Spiele has announced a world championship in Berlin on July 9 and 10, 2027, for four qualified players. Seats come from a World Series of Board Gaming event, the Ark Nova Digital app, and Board Game Arena."
teachSheet:
  goal: "Build the best zoo: raise appeal and conservation until your two counters cross, then score the most points."
  setup:
    - "Board in the middle. Break token on the start space for your player count."
    - "Put 4 random Bonus tiles on the blank yellow Bonus spaces."
    - "Shuffle the Zoo cards. Deal 6 face down to the display."
    - "Association board: 1 partner zoo per continent, 1 of each university, 3 base projects below (4 at four players)."
    - "Each player: Map A, empty 3-space enclosure by the kiosk, action cards side I, Animals in slot 1."
    - "Counters on the first spaces. Appeal starts at 0, 1, 2, 3 in turn order."
    - "Take 25 money, 1 active worker, 7 tokens on the map's left edge, 2 secret Final Scoring cards."
    - "Draw 8 Zoo cards, keep 4. Then flip the display face up."
  turn:
    - "Pick one action card. Its slot number, 1 to 5, is its strength."
    - "Spend X-tokens for +1 strength each if you like. Then do the action."
    - "Move the used card to slot 1. Slide the cards from its left one slot right."
    - "Cards: move the break 2. Draw from the deck, or at strength 5, snap from the display."
    - "Build: one building up to the strength in size. Pay 2 money per space."
    - "Animals: one animal at strength 2 to 4, two at 5. Pay the cost, fill an empty enclosure."
    - "Association: a worker does one task: 2 reputation, partner zoo, university, or a project."
    - "Sponsors: play a sponsor up to the strength, or move the break that far and take that much money."
  scoring:
    - "Appeal comes mostly from animals. It also sets your income at every break."
    - "Conservation comes from projects, some cards, and Final Scoring cards."
    - "Up to 10 conservation, each point counts for 2 appeal. After 10, each counts for 3."
    - "End: score your Final Scoring card and any end-game sponsor cards."
    - "Final score: your appeal plus the small number on your conservation space."
    - "Tie: the player who supported the most conservation projects wins."
  endGame: "The end triggers when a player's two counters meet or cross. Everyone else takes one last turn (everyone, if it happens in a break), then score."
  tips:
    - "Plan two turns ahead. The card you use now waits at strength 1."
    - "Early appeal is income. Late conservation is points."
    - "Take a partner zoo that matches your animals. It saves 3 money per continent icon."
diagramAlt: "Ark Nova setup: the game board with the appeal and conservation tracks running toward each other, the 6-card display, the reputation and break tracks, the association board with base projects below, and your zoo map with 7 tokens, a kiosk, an empty 3-space enclosure, 1 worker, 25 money, and Animals in action slot 1."
