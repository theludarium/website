faq:
  - q: "How do you win Heat: Pedal to the Metal?"
    a: "Be the first car to cross the finish line after the number of laps shown on the board. If several cars finish in the same round, the car furthest ahead wins. Side by side, the car on the Spot closer to the Race Line wins."
  - q: "What happens if you take a corner too fast in Heat?"
    a: "You pay 1 Heat from your Engine for every point your Speed is over the corner's Speed Limit. If you cannot pay it all, you spin out: you move back before the corner, take Stress cards, and drop to 1st gear."
  - q: "Does slipstreaming count toward your Speed in a corner?"
    a: "No. Slipstream moves you 2 extra Spaces, but it never adds to your Speed when you check a corner. Boost and the Adrenaline extra Space do count."
  - q: "Can you play Heat solo?"
    a: "Yes. The Legends module in the base box gives you automated rival cars run by a small deck of cards. You race against them alone, or add them to a small group."
  - q: "How does the Championship mode work in Heat?"
    a: "You race a season of 3 or 4 races, improving your car with one new Upgrade card before each race. Event cards, weather, and sponsors change every race, and Championship points from the Hall of Fame decide the season."
teachSheet:
  goal: "Be the first car across the finish line after the laps shown on the board."
  setup:
    - "Board in the middle. First race: USA track, and consider 1 lap instead of 2."
    - "Each player takes a car, mat, Gear pawn, 12 Basic cards, and 3 Starting Upgrades."
    - "Check the board for Heat and Stress per car, usually 6 Heat and 3 Stress."
    - "Shuffle Basic, Starting Upgrade, and Stress cards into a face-down deck on your mat's left."
    - "Heat cards face up on your Engine. Gear pawn in 1st gear."
    - "Remaining Stress cards go face up near the board as a reserve."
    - "Place cars on the starting grid at random. Everyone draws 7 cards."
  turn:
    - "All at once: stay in gear or shift one gear. Two gears costs 1 Heat."
    - "All at once: play face down exactly as many cards as your gear number."
    - "Front car first: reveal, add up your Speed, move exactly that many Spaces."
    - "Last car (last two with 5 or more cars): Adrenaline, +1 Space and +1 Cooldown."
    - "React: Cooldown in 1st or 2nd gear. Boost once for 1 Heat in any gear."
    - "Next to a car or right behind one? Slipstream 2 more Spaces."
    - "Crossed a Corner Line? Pay 1 Heat per point over the Speed Limit."
    - "Discard if you like (never Heat or Stress), then draw back up to 7."
  scoring:
    - "First car across the finish line on the final lap wins."
    - "Same round: furthest ahead wins. Side by side, the Spot nearer the Race Line wins."
    - "Speed Limits stop counting past the finish line. No slipstreaming across it."
    - "Cannot pay a corner? Pay all your Heat and spin out."
    - "Spin out: back before the corner, take 1 Stress (2 in 3rd or 4th), drop to 1st."
    - "Championship: points by finishing place, 9 for first, from the Hall of Fame."
  endGame: "The winner is the first car home. Keep racing until every car crosses the line, filling the Hall of Fame in order."
  tips:
    - "Count the Spaces to the next corner before you choose your gear."
    - "Heat left in your Engine at the finish is wasted, so spend it."
    - "Slipstream through corners: those 2 Spaces never count toward your Speed."
diagramAlt: "Heat: Pedal to the Metal setup: the game board with cars on the starting grid behind the finish line, a corner with its Speed Limit and Corner Line, the track info and Hall of Fame; the Stress reserve and a hand of 7 cards beside it; and a player mat with the face-down draw deck, 6 Heat cards on the Engine, an empty discard pile, and the Gear pawn in 1st gear."
