faq:
  - q: "How do you win Dorfromantik: The Board Game?"
    a: "There is no win or loss. You all build one map together and score points for completed Task markers, closed Flag territories, your longest Track, and your longest Stream. Your score moves your campaign forward and opens new content."
  - q: "How do task markers work in Dorfromantik?"
    a: "Each Task tile gets a marker showing 4, 5, or 6. The territory, Track, or Stream that tile belongs to must reach exactly that many tiles. Hit the number and you bank the marker's points. Go over it, or close the area off short of it, and the marker goes back to the box."
  - q: "When does Dorfromantik end?"
    a: "The game ends when you must reveal a Landscape tile and none are left. If the last Landscape tile completes or cancels a task, keep revealing and placing Task tiles until one no longer completes or cancels a task."
  - q: "Can you play Dorfromantik solo?"
    a: "Yes. The box says 1 to 6 players, and the rules are the same at every count. Solo, you make every placement decision yourself, and your score feeds the same campaign sheet."
  - q: "Is the Dorfromantik board game the same as the video game?"
    a: "No. It is based on the video game from Toukana Interactive and shares its look and hex tiles, but the board game is cooperative for up to six players, uses a fixed stack of tiles, and adds a campaign with sealed boxes."
teachSheet:
  goal: "Build one shared map and score as many points as you can. Nobody wins or loses: you play to beat your best score."
  setup:
    - "Shuffle the 25 Task tiles facedown into stacks at the edge of the table."
    - "Shuffle the Landscape tiles facedown. Return 3 to the box unseen."
    - "Stack the rest facedown, apart from the Task tiles."
    - "Mix the Task markers facedown and sort them into piles by color."
    - "Score pad and Campaign pad aside. Leave all 5 boxes closed."
    - "Pick a start player. Play goes clockwise."
  turn:
    - "No starting tile. First 3 turns: reveal a Task tile, add a random matching marker, number up."
    - "After that: fewer than 3 open Task markers in play? Reveal a Task tile. Otherwise, a Landscape tile."
    - "Talk it over as a group. The active player makes the final call."
    - "Place the tile touching the map on at least 1 edge."
    - "Track edges only meet Track edges. Stream edges only meet Stream edges."
    - "Forest, Grain, Village, and Meadow edges can meet anything."
    - "Area hits a marker's number exactly? Move that marker to your completed pile."
    - "Area grows past the number, or is closed off short of it? Return the marker to the box."
  scoring:
    - "Tasks: the total of every completed Task marker."
    - "Flags: a Flag in a closed territory scores 1 point per tile in that territory."
    - "Open Flag territories score nothing."
    - "Longest Track: 1 point per tile in your longest unbroken Track."
    - "Longest Stream: 1 point per tile in your longest unbroken Stream."
    - "Then mark the Campaign sheet: your result sets how many circles you cross off."
  endGame: "The game ends when you must reveal a Landscape tile and none are left. If the last Landscape tile completes or cancels a task, keep placing Task tiles until one does not."
  tips:
    - "Stack tasks: a territory can finish a 4, then a 5, then a 6 as it grows."
    - "Close a Flag territory before the stack runs out, or it scores zero."
    - "Finish tasks quickly. Each one brings a Task tile, an extra placement that does not use a Landscape tile."
diagramAlt: "Dorfromantik setup, seen from above. In the middle of the table, an empty play area where the first Task tile revealed on turn 1 will start the map. On the left, facedown stacks of Task tiles and five facedown piles of Task markers, one per type: Forest, Grain, Village, Track, and Stream. On the right, facedown stacks of Landscape tiles, with an arrow showing 3 Landscape tiles going back to the box unseen. Along the top, the game box with its 5 closed boxes. Along the bottom, the Score pad and the Campaign pad set aside, and a space marked for completed Task markers."
