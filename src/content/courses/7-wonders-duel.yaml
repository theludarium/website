faq:
  - q: "How do you win 7 Wonders Duel?"
    a: "Three ways. Push the Conflict pawn into your opponent's capital for military supremacy, or collect 6 different science symbols for scientific supremacy, and you win at once. If neither happens, the player with the most victory points after Age III wins."
  - q: "How much do resources cost in 7 Wonders Duel?"
    a: "You buy missing resources from the bank for 2 coins each, plus 1 coin for every matching symbol on your opponent's brown and grey cards. The coins go to the bank, not your opponent. Some yellow cards fix a resource's price at 1 coin."
  - q: "How do Progress tokens work in 7 Wonders Duel?"
    a: "Five random Progress tokens sit on the board. Each time you collect a pair of identical science symbols, you take one of them at once and keep it for the game. The Law token also counts as a science symbol."
  - q: "Who starts the next Age in 7 Wonders Duel?"
    a: "The player with the weaker military, meaning the Conflict pawn is on their side of the board, chooses who starts. If the pawn is on the middle space, the player who took the last card of the Age chooses."
  - q: "Can you play 7 Wonders Duel with the 7 Wonders expansions?"
    a: "No. Duel is its own game with its own cards. Its two expansions are Pantheon, which adds Divinities and Grand Temples, and Agora, which adds Senators, a Senate board, and political supremacy. They can be played together."
teachSheet:
  goal: "Win at once by military or science supremacy, or have the most points after Age III."
  setup:
    - "Board to one side. Conflict pawn on the middle space, 4 Military tokens face up."
    - "Place 5 random Progress tokens face up on the board. Box the rest."
    - "Each player takes 7 coins."
    - "Draft Wonders: 4 face up, first player takes 1, second takes 2, first takes the last."
    - "Deal 4 more; this time the second player picks first. Each player ends with 4."
    - "Box 3 unseen cards from each Age. Shuffle 3 random guilds into Age III."
    - "Lay out Age I: 20 cards in a pyramid, rows alternating face up and face down."
  turn:
    - "Take 1 card that no other card covers."
    - "Build it: pay its cost and add it to your city."
    - "Or sell it: 2 coins plus 1 per yellow card you own."
    - "Or tuck it under one of your Wonders and pay the Wonder's cost."
    - "Missing resources? Buy from the bank: 2 coins plus 1 per matching symbol your opponent's brown and grey cards show."
    - "Flip any face-down card your pick uncovered."
    - "Shields move the pawn. Each science pair takes a Progress token."
  scoring:
    - "Pawn's zone: 0, 2, 5, or 10 points to the player it leans toward."
    - "Points on blue, green, yellow, and purple cards and on Wonders."
    - "Progress tokens with points. 1 point per full set of 3 coins."
  endGame: "Instant win on reaching the enemy capital or 6 different science symbols. Otherwise after Age III: most points, then most blue-card points."
  tips:
    - "Before you take a card, check what it uncovers."
    - "Each brown or grey card also raises your opponent's price."
    - "Say the shield gap and both science counts every turn."
diagramAlt: "7 Wonders Duel setup. Player 1 sits on the left and Player 2 on the right, each with 7 coins and a column of 4 Wonders. The board runs between them along the top: a Conflict track of 19 spaces with the pawn on the middle space, a capital at each end, two Military tokens on each side (2 coins nearer the middle, 5 coins nearer the capital), and 5 Progress tokens face up. In the middle of the table, the Age I layout of 20 cards in rows of 2, 3, 4, 5, and 6, alternating face up and face down. Below it, the discard pile, the bank, and the box for 3 unseen cards from each Age."
