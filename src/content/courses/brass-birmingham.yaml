faq:
  - q: "Where does beer come from in Brass: Birmingham?"
    a: "From three places. Your own breweries need no connection. A rival's brewery must be connected to where the beer is used. The barrel beside a merchant can only be used when you sell to that merchant, and it earns that merchant's bonus."
  - q: "Do you need a connection to buy coal from the market?"
    a: "Yes. First you must take coal from the closest connected coal mine that has coal, whoever owns it, for free. Only if none is connected can you buy from the coal market, and that needs a connection to a merchant location. Iron never needs a connection."
  - q: "How do canals and rails score in Brass: Birmingham?"
    a: "At the end of each era, each of your links scores 1 VP for every link icon in the two locations it touches. Flipped industry tiles show link icons, whoever owns them, and each merchant location shows 2. Unflipped tiles show none."
  - q: "Should you take loans in Brass: Birmingham?"
    a: "Often, yes. A loan gives £30 now and lowers your income by 3 levels. Final income and money only break ties, so a loan that funds a strong build is usually worth it, and the later in the game you take it, the less it costs."
  - q: "What happens at the end of the Canal Era?"
    a: "Links score, then flipped industry tiles score. All links leave the board and level 1 tiles are removed, but level 2 and higher tiles stay. Empty merchant beer spaces refill, the discards become a new deck, and everyone draws 8 cards."
teachSheet:
  goal: "Score the most VPs over two eras from your flipped industry tiles and the link icons your links touch."
  setup:
    - "With 2 or 3 players, return cards and merchant tiles marked for more players."
    - "Wild cards face up in their spaces; shuffle the rest into the draw deck."
    - "Merchant tiles face up on spaces for your count; beer beside each non-blank tile."
    - "Fill the coal market except one £1 space, and the iron market except both £1 spaces."
    - "Each player takes a mat, £17, 14 links, 45 industry tiles, and a character tile."
    - "VP marker on 0. Income marker on the 10 space, which is income level 0."
    - "Deal 8 cards each, plus 1 face down to start each discard pile."
    - "Shuffle the character tiles into a random turn order."
  turn:
    - "Take 2 actions, discarding 1 card each. First Canal Era round: 1 action."
    - "Build, Network, Develop, Sell, Loan, or Scout. Only Build needs a matching card."
    - "Put all money you spend on your character tile, then refill to 8 cards."
    - "Coal: closest connected mine, free. Otherwise the market, which needs a merchant connection."
    - "Iron: any iron works, free, no connection. Otherwise the market."
    - "Beer: your brewery anywhere, a rival's if connected, merchant beer only when selling there."
    - "Round end: least spent goes first next round. Then collect income (not after the last round)."
  scoring:
    - "An era ends when hands run out: 8, 9, or 10 rounds for 4, 3, or 2 players."
    - "Each link scores 1 VP per link icon in its two locations."
    - "Flipped tiles show link icons, whoever owns them. Each merchant location shows 2."
    - "Then each flipped industry tile scores its VPs. Unflipped tiles score nothing."
    - "Links leave the board after scoring, in both eras."
    - "After the Canal Era: remove level 1 tiles, refill merchant beer, deal new hands."
    - "Level 2 and higher tiles stay and can score in both eras."
  endGame: "The game ends after Rail Era scoring. Most VPs wins; ties go to higher income, then more money."
  tips:
    - "Do not fear loans: final income and money only break ties."
    - "Develop past level 1 so your tiles survive and can score twice."
    - "Keep a brewery of your own; most sales need beer."
diagramAlt: "Brass: Birmingham setup for four players: the board with the draw deck and the face-up wild cards, merchant tiles, three of them blank, with beer barrels beside the others at Warrington, Nottingham, Shrewsbury, Gloucester, and Oxford, the coal market with one £1 space empty, the iron market with both £1 spaces empty, the turn order track, and markers on the progress track. Below the board sit the general supply and the bank, and beside it one player's area: player mat, £17, 14 link tiles, a hand of 8 cards, and a face-down discard."
