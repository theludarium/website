afterLesson3: "Teach and play a clean game of Everdell, with the seasons, free Critters, the hand limit, and Events done right, and skip the slips most new tables make."
afterLesson8: "Plan your winter and spring, time your engine through summer, count every point in autumn, pick an expansion, and find a tournament or online table."
faq:
  - q: "How many cards can you have in your city in Everdell?"
    a: "Fifteen. Each Critter or Construction takes one space. Events do not count toward the limit, the Wanderer takes no space, and a Harvester and Gatherer can share one space."
  - q: "When can you prepare for season in Everdell?"
    a: "Only when all of your workers are deployed. You bring them all back, gain the new workers and bonus for the next season, and your turn ends. Players do not have to prepare at the same time."
  - q: "How do you play a Critter for free in Everdell?"
    a: "Each Critter names a Construction in its top left corner. If that Construction is in your city, you may play the Critter without paying its berries. Put an occupied token on the Construction; each Construction can do this only once."
  - q: "What is the hand limit in Everdell?"
    a: "Eight cards, and you can never hold more. If you would draw past eight, you stop at eight. If you must give cards to an opponent, choose one with room in their hand, and discard any that nobody can take."
  - q: "How do you break a tie in Everdell?"
    a: "The player who achieved the most Events wins. If players are still tied, the one with the most leftover resources wins."
teachSheet:
  goal: "Build the city worth the most points, up to 15 cards, by the end of autumn."
  setup:
    - "Board in the middle, Ever Tree on its stump, shuffled deck inside the tree."
    - "Resources in piles by the river; point and occupied tokens beside the board."
    - "Forest cards on the clearings: 3 for two players, 4 for three or four."
    - "4 basic Events on the river; 4 special Events on the tree's lower branches."
    - "Deal 8 cards face up into the Meadow."
    - "Each player takes 2 workers. Deal 5, 6, 7, and 8 cards in turn order."
    - "Each player's other 4 workers go on the tree: 1 spring, 1 summer, 2 autumn."
    - "The most humble player goes first; play passes clockwise."
  turn:
    - "Take one action: place a worker, play a card, or prepare for season."
    - "Place a worker: take the reward. Open rings are shared; other spaces hold one worker."
    - "Play a card from your hand or the Meadow by paying its cost. Refill the Meadow."
    - "A Critter is free if its Construction is in your city. Mark that Construction occupied."
    - "Prepare only when all your workers are out: bring them home, add the new ones."
    - "Spring: 1 new worker, green cards produce. Summer: 1 new worker, draw up to 2 Meadow cards."
    - "Autumn: 2 new workers, green cards produce. Autumn is the last season."
  scoring:
    - "Base points printed on every card in your city."
    - "Point tokens you collected."
    - "Purple Prosperity card bonuses."
    - "Workers on the autumn trail: 2, 3, 4, or 5 points."
    - "Achieved Events: basic Events 3 each, special Events as printed."
    - "Ties: most Events wins, then most leftover resources."
  endGame: "After autumn, pass when you cannot or will not act; nobody can give a passed player anything. When everyone has passed, add up the scores. Most points wins."
  tips:
    - "Play green Production cards early; each one pays again every spring and autumn."
    - "Build a Construction first, then play its Critter for free."
    - "Count your open city spaces in summer and plan what fills the last ones."
diagramAlt: "Everdell setup for four players: the Ever Tree at the top of the board with waiting workers on its spring, summer, and autumn branches, 4 special Events on its lower branches, and the deck in its trunk; 4 basic Events on the river; resource piles and 8 basic locations along the path; the Meadow of 8 face-up cards between 4 Forest cards; the autumn trail, discard pile, and Haven along the bottom; point and occupied tokens beside the board; and each player with 2 workers and a starting hand of 5, 6, 7, or 8 cards."
