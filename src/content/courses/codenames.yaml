faq:
  - q: "How many players do you need for Codenames?"
    a: "At least four: two teams, each with a spymaster and at least one operative. Czech Games Edition lists 4 to 8 or more players. For two players, the cooperative Codenames: Duet is the version to reach for."
  - q: "What is the plus one rule in Codenames?"
    a: "As long as your team keeps guessing its own words, you may make one more guess than the number in the clue. A clue for 2 allows up to 3 guesses. Teams usually spend the extra guess on a word they missed from an earlier clue."
  - q: "What happens if you pick the assassin in Codenames?"
    a: "Your team loses on the spot, and the other team wins. It does not matter how many words either team still has to find."
  - q: "Can a Codenames clue be a word on the board?"
    a: "No. While a word is showing in the grid, you cannot say it, any form of it, or any part of a compound word on the table. Once that card is covered, the word is fair game."
  - q: "Do you have to guess on your turn in Codenames?"
    a: "Yes. Operatives must make at least one guess every turn. After any correct guess they may stop, and good teams often stop early rather than risk a wrong word."
  - q: "Can you give a clue for zero in Codenames?"
    a: "Yes, under the expert rules in the rulebook. A clue like spiders: 0 means do not guess the words it points to, and it allows unlimited guesses, as long as the team keeps guessing right. Save it for after your first few games."
teachSheet:
  goal: "Be the first team to find all of your agents, and never touch the assassin."
  setup:
    - "Split into red and blue teams of about equal size, at least 2 players each."
    - "Each team picks 1 spymaster. Everyone else is an operative."
    - "Both spymasters sit on one side, across the table from their operatives."
    - "Lay out 25 random word cards in a 5 by 5 grid."
    - "Spymasters slide a random key card into the stand. Only they look at it."
    - "Each spymaster takes 8 agent tiles. Bystanders and the assassin go between them."
    - "Triangles on the key's edge show who starts. That team adds the double agent."
  turn:
    - "Spymaster gives 1 word and 1 number, like ocean: 2. Nothing else."
    - "Operatives talk it over, then touch 1 word card."
    - "Spymaster covers it with the tile the key card shows."
    - "Your color: guess again, up to the number plus one."
    - "A bystander or the other team's word ends your turn."
    - "The assassin: your team loses right away."
    - "Stop after any right guess, but always make at least 1."
  scoring:
    - "No points to count. Covered words are the score."
    - "The starting team finds 9 words; the other team finds 8."
    - "Touch the other team's word and it counts for them."
    - "Clues are about meaning, not letters or where cards sit."
    - "No clue can be any form of a word still showing, or part of a compound one."
    - "Invalid clue: your turn ends, and the other spymaster may cover one of their words."
  endGame: "A team wins when all of its words are covered, even if the other team uncovered the last one. Touch the assassin and the other team wins at once."
  tips:
    - "Spymasters: give clues for 2 most of the time. Safe beats clever."
    - "Before you say a clue, check it against the assassin."
    - "Operatives: guess your surest word first, and stop when you are unsure."
diagramAlt: "Codenames setup: a 5 by 5 grid of 25 word cards in the middle of the table. Both spymasters sit on one side with the key card in its stand between them. The red spymaster has 8 agent tiles plus the double agent, the blue spymaster has 8 agent tiles, and the 7 bystanders and the assassin sit in the middle. The red and blue operatives sit across the table."
