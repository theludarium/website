faq:
  - q: "How do you win Pandemic?"
    a: "Discover cures for all four diseases. Your team wins the moment the fourth cure is found, even with cubes still on the board. You do not need to eradicate anything."
  - q: "How do you lose Pandemic?"
    a: "Three ways: the eighth outbreak, needing disease cubes of a color when that supply has run out, or a player who cannot draw 2 Player cards after their actions. Everyone loses together."
  - q: "How many Epidemic cards should you use in Pandemic?"
    a: "Four for an Introductory game, five for Standard, six for Heroic. The rulebook suggests four for your first game and six once you have mastered Standard."
  - q: "Can you give any card with Share Knowledge?"
    a: "No. You give or take only the City card that matches the city you are both in, and both players must agree. The Researcher is the exception: she may give any City card from her hand."
  - q: "Do you draw a replacement card after an Epidemic?"
    a: "No. Resolve the Epidemic, then remove it from the game. The card it took up in your draw is simply gone."
  - q: "Can you play Pandemic solo?"
    a: "Yes. Z-Man Games publishes official solo rules: you lead three roles that share one hand, and an archive of cards replaces Share Knowledge. Board Game Arena also lists Pandemic for 1 to 4 players."
teachSheet:
  goal: "Work as one team to discover cures for all four diseases before the world runs out of time."
  setup:
    - "Research station and every pawn in Atlanta. Sort the cubes by color beside the board."
    - "Outbreaks marker on 0, infection rate on the first 2, cure markers beside the board."
    - "Flip 9 Infection cards: 3 cubes on three cities, 2 on three, 1 on three. Discard all 9."
    - "Deal each player a role card and a reference card. Box the rest."
    - "Starting hands, no Epidemics: 4 cards each for 2 players, 3 for 3, 2 for 4."
    - "Split the rest into one pile per Epidemic, shuffle one into each, stack smaller piles at the bottom."
    - "First game: 4 Epidemics, and play with every hand face up."
    - "Highest city population in hand goes first."
  turn:
    - "Do 4 actions: move, treat, build, share, or cure, in any mix."
    - "Draw 2 Player cards. Resolve any Epidemic at once, then discard down to 7."
    - "Infect: flip Infection cards equal to the infection rate. 1 cube on each city."
    - "A 4th cube of one color means an outbreak: 1 cube on every connected city."
  scoring:
    - "No points. The whole team wins or loses together."
    - "Cure: discard 5 City cards of one color at any research station."
    - "After a cure, Treat Disease clears every cube of that color in your city."
    - "Cured with no cubes left on the board: eradicated. Its cities get no more cubes."
    - "Epidemic: raise the rate, fill the bottom card's city to 3 cubes (it outbreaks if it had any), reshuffle the discards on top."
    - "Lose: 8th outbreak, too few cubes of a color, or too few Player cards to draw 2."
  endGame: "You win the moment the fourth cure is found. You lose at once on the 8th outbreak, when a color's cubes run out, or when a player cannot draw 2 cards."
  tips:
    - "The Infection discard pile is the future. After an Epidemic, those cities come back first."
    - "Every flight spends a card you might need for a cure."
    - "Each player decides their own turn. Advise, never order."
diagramAlt: "Pandemic setup for four players: the board with one research station and all four pawns in Atlanta, nine cities starting with 3, 2, or 1 disease cubes, the infection rate marker on the first 2, the outbreaks marker on 0, cure markers beside the cure indicators, the Infection deck and its discard pile of 9 cards, the Player deck with one Epidemic in each pile, the cube supply in four colors, five spare research stations, and each player's role card, reference card, and 2-card hand."
