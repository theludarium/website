faq:
  - q: "How does Terraforming Mars end?"
    a: "The game ends when oxygen reaches 14%, the temperature reaches +8 °C, and all 9 oceans are on the map. Players finish that generation, including production. Then everyone gets one last chance to turn plants into greenery tiles, and the final scoring begins."
  - q: "What is terraform rating in Terraforming Mars?"
    a: "Terraform rating, or TR, starts at 20 and goes up 1 step each time you raise the temperature, the oxygen, or place an ocean. Each generation it is added to your M€ production as income, and at the end every step is worth 1 victory point."
  - q: "Should new players use the Beginner Corporation?"
    a: "The rulebook says yes. A new player takes a Beginner Corporation, starts with 42 M€, and draws 10 project cards for free instead of choosing between two corporations and paying for cards."
  - q: "What is Corporate Era, and should you play with it?"
    a: "Corporate Era is a set of extra cards about economy and technology, marked with a red and white icon. With them in, nobody starts with extra production. The rulebook says it makes the game longer and does not recommend it for new players."
  - q: "Can you play a card if the global parameter it raises is already maxed?"
    a: "Yes. You may still play the card and use its other effects. You just ignore the maxed part, and you do not gain TR for it."
  - q: "Can Terraforming Mars be played solo?"
    a: "Yes. The rulebook has a solo variant, written for the Corporate Era game. You start at TR 14 without the extra starting production, there are no milestones or awards, and you must finish terraforming by the end of generation 14 to win."
teachSheet:
  goal: "Have the most victory points when Mars is terraformed: from TR, tiles, cards, milestones, and awards."
  setup:
    - "Board: oxygen on 0%, temperature on -30 °C, 9 ocean tiles on their space."
    - "Take the Corporate Era cards (red and white icon) out of both decks."
    - "Each player: a player board with production at 1 on all six tracks."
    - "TR markers on 20, generation marker on 1. Last game's winner goes first."
    - "New players: a Beginner Corporation, 42 M€, and 10 free project cards."
    - "Others: deal 2 corporations and 10 cards. Keep 1 corporation; cards cost 3 M€ each."
    - "In player order, reveal corporations, take starting resources, pay for kept cards."
    - "Generation 1 starts straight with the action phase."
  turn:
    - "Player order: first player marker moves clockwise, generation marker moves up 1."
    - "Research: draw 4 cards, buy any of them for 3 M€ each."
    - "Actions: take 1 or 2 actions on your turn, or pass for the rest of the generation."
    - "Actions are: play a card, standard project, milestone, award, blue card action."
    - "Also actions: 8 plants become a greenery, 8 heat raises the temperature."
    - "Production: energy becomes heat, then take M€ equal to TR plus M€ production."
    - "Then take every other resource you produce. Clear markers from used blue cards."
  scoring:
    - "Every step you raise temperature, oxygen, or oceans: +1 TR."
    - "End: 1 VP per TR."
    - "Greenery: 1 VP. City: 1 VP per adjacent greenery, any owner."
    - "Milestone: 5 VP. Claim for 8 M€; only 3 of 5 can be claimed."
    - "Award: fund for 8, then 14, then 20 M€; only 3. First 5 VP, second 2 VP (none with 2 players)."
    - "Cards: printed VPs, including VPs from resources on cards."
    - "Tie: most M€ wins."
  endGame: "When oxygen is 14%, temperature is +8 °C, and all 9 oceans are placed, finish the generation. After production, everyone may turn plants into greenery one last time. Then score."
  tips:
    - "Buy production early. It pays you every generation that is left."
    - "Keep only cards you can play soon. Each one costs 3 M€ just to keep."
    - "Watch the three tracks. When they near the top, switch from engine to points."
