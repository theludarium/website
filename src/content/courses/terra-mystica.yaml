faq:
  - q: "How do you win Terra Mystica?"
    a: "Have the most Victory points after six rounds. Everyone starts on 20. You score during the game from Scoring tiles, Bonus cards, Favor tiles, and Towns, then at the end for cult majorities, your largest connected area, and leftover resources."
  - q: "What are the best Terra Mystica factions for beginners?"
    a: "The rulebook's introductory game uses the Witches, Nomads, Halflings, and Mermaids at four players, and those are a good first set. Feuerland's own balance table suggests the Fakirs are the weakest on the base map and the Darklings, Cultists, and Engineers the strongest."
  - q: "How does Power work in Terra Mystica?"
    a: "Each player has 12 Power tokens in three Bowls. Gaining Power moves tokens from Bowl I to II, and only once Bowl I is empty from II to III. You can spend only tokens in Bowl III, and spent tokens go back to Bowl I."
  - q: "Do you lose points for taking Power in Terra Mystica?"
    a: "Yes, when the Power comes from an opponent building next to you. You lose one Victory point fewer than the Power you gain, so 1 Power is free and 3 Power costs 2 points. You take all of it or none of it."
  - q: "Can you play Terra Mystica with two players?"
    a: "Yes. The game plays 2 to 5 and uses five Bonus cards at two players. The map is open at two, so expect less Power from neighbors and more room to spread out."
teachSheet:
  goal: "Have the most Victory points after six rounds. Everyone starts on 20."
  setup:
    - "Board and Cult board in the middle. First game: use the rulebook's fixed factions and Dwellings."
    - "Take your Faction board, buildings, Priests, Bridges, and Markers. Starting resources are on your board."
    - "Markers: Shipping 0, Exchange at 3 Workers per Spade, score 20, all four cults on 0."
    - "Move up on the cults your board shows. Put 12 Power in Bowls I and II as shown."
    - "Lay out Scoring tiles for rounds 1 to 6. Game end token covers half of round 6."
    - "Use Bonus cards equal to players plus 3. Lay out Favor tiles and the 10 Town tiles."
    - "Place two Dwellings each: clockwise, then back counterclockwise. Last player picks a Bonus card first."
  turn:
    - "Income: Workers, Coins, Priests, and Power from your boards, Bonus card, and Favor tiles."
    - "Actions: one per turn, in order, until everyone passes."
    - "Transform and build: dig with Spades, then build a Dwelling on your Home terrain."
    - "Upgrade: Dwelling to Trading house, then Temple or Stronghold. One Temple becomes the Sanctuary."
    - "Also: Shipping, cheaper Spades, Priest to a cult, Power actions, Special actions."
    - "Neighbors: when you build next to someone, they may take Power and pay points for it."
    - "Pass: swap your Bonus card. First to pass starts next round."
    - "End of round: cult bonuses from the Scoring tile, then 1 Coin on each unused Bonus card."
  scoring:
    - "During play: the current Scoring tile, Favor tiles, Bonus cards when you pass, and Towns."
    - "Each cult track: 8, 4, and 2 points for first, second, and third."
    - "Biggest connected area: 18, 12, and 6 points."
    - "Leftovers: 1 point per 3 Coins after converting what you can."
    - "Ties split the points of the tied places, rounded down."
  endGame: "The game ends after the Action phase of round 6. There are no cult bonuses that round, then final scoring."
  tips:
    - "Read all six Scoring tiles before you place a Dwelling, and plan around them."
    - "Build near opponents: Trading houses cost less there, and you gain Power when they build."
    - "Try not to end a round with Power in Bowl III. Spend it on a Power action or a conversion."
diagramAlt: "An abstract Terra Mystica setup: a simplified hex map with a green river running through it and two first Dwellings for each of four players. Below the map, six Scoring tiles for rounds 1 to 6 with the Game end token on round 6, six Power action spaces each covered by an Action token, and Bonus cards equal to the number of players plus three. To the right, the Cult board with four tracks and markers on 0, the Favor tiles in a grid, the ten Town tiles, and a Faction board with three Power bowls."
