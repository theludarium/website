faq:
  - q: "How does scoring work in Azul?"
    a: "When a tile moves to your wall, it scores 1 point if nothing touches it. If it touches other tiles, count the connected tiles in its row, including itself, then the connected tiles in its column, including itself, and score both totals."
  - q: "What happens to the leftover tiles on a factory display?"
    a: "When you take all tiles of one color from a factory display, the rest of that display moves to the center of the table. Later players can take them from there, one color at a time."
  - q: "Does the starting player marker cost points in Azul?"
    a: "Yes. The first player to take tiles from the center that round also takes the marker and puts it on the leftmost free space of their floor line, where it counts like a fallen tile. In exchange, that player goes first next round."
  - q: "Can you split one pick between two pattern lines?"
    a: "No. All the tiles you take go into one pattern line. Any that do not fit go to your floor line, and you may also put them there on purpose."
  - q: "When does a game of Azul end?"
    a: "The game ends after the wall-tiling phase of the round in which at least one player completes a horizontal row of 5 tiles on their wall. Then everyone adds end bonuses: 2 per row, 7 per column, and 10 per color with all 5 tiles placed."
  - q: "Can your score go below zero in Azul?"
    a: "No. Floor line penalties can take you down to 0, but never lower."
teachSheet:
  goal: "Score the most points by moving tiles to your wall, where tiles that touch score more."
  setup:
    - "Each player takes a board, colored wall side up, with their score marker on 0."
    - "Circle the factory displays: 5 for two players, 7 for three, 9 for four."
    - "Put all 100 tiles in the bag."
    - "Whoever most recently visited Portugal takes the starting player marker."
    - "That player fills every factory display with 4 tiles from the bag."
  turn:
    - "The starting player puts the marker in the center. Play goes clockwise."
    - "Take all tiles of one color from one display. Push the rest to the center."
    - "Or take all of one color from the center. First to do so puts the marker on their floor line."
    - "Put your tiles in one pattern line, filling right to left. One color per line."
    - "No color in a line whose wall row already has that color."
    - "Tiles that do not fit, or that you do not want, go on your floor line."
    - "When displays and center are empty, everyone tiles their wall."
  scoring:
    - "Top to bottom: each full pattern line moves its rightmost tile to its color on the wall."
    - "Clear the rest of that line to the box lid. Unfinished lines stay put."
    - "A tile alone scores 1. Otherwise count its connected row, then its connected column."
    - "Floor line: lose 1, 1, 2, 2, 2, 3, 3. Your score never drops below 0."
    - "End bonus: 2 per full row, 7 per full column, 10 per color with all 5 placed."
  endGame: "The game ends after the round in which anyone completes a horizontal row of 5. Add bonuses; most points wins. A tie goes to more complete rows, then is shared."
  tips:
    - "Fill pattern lines exactly. Every extra tile is a floor penalty."
    - "Place tiles next to each other. Connected tiles score more."
    - "Watch what you push to the center. Someone has to take it."
diagramAlt: "Azul setup for two players: five factory displays with 4 tiles each in a circle around the center of the table, two player boards with the score marker on 0, empty pattern lines, the colored wall and the floor line, plus the starting player marker, the bag of 100 tiles, and the box lid."
